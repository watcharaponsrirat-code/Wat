name: Deploy Science Learning Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify learning content and saved progress
        run: |
          node tests/account-regression.mjs
          node tests/navigation-regression.mjs
          node tests/game-regression.mjs
          node tests/onet-regression.mjs
          node tests/final-exam-regression.mjs
          node tests/final-exam-migration.mjs
          node tests/simulation-regression.mjs
          node tests/native-models-regression.mjs
          node tests/readiness-regression.mjs
      - name: Prepare static site
        run: |
          node scripts/build-site.mjs
          test -s _site/assets/theme/voxel-world.css
          test -s _site/assets/theme/voxel-ui.js
          test -s _site/assets/theme/ui-icons.js
          test -s _site/assets/theme/ui-icons.css
          test -s _site/assets/theme/voxel-landscape.svg
          test -s _site/assets/theme/school-world.png
          test -s _site/assets/theme/world-nature.png
          test -s _site/assets/theme/world-science.png
          test -s _site/assets/theme/world-space.png
          test -s _site/assets/simulations/scene3d.js
          test -s _site/assets/simulations/models3d.js
          test -s _site/assets/simulations/models3d-kit.js
          test -s _site/assets/simulations/models3d-grade1.js
          test -s _site/assets/simulations/models3d-grade2.js
          test -s _site/assets/simulations/models3d-grade3.js
          test -s _site/assets/simulations/studio3d.css
          test -s _site/assets/vendor/three/three.module.js
          test -s _site/assets/vendor/three/three.core.js
          test -s _site/assets/vendor/three/OrbitControls.js
          test -s _site/assets/vendor/three/RoomEnvironment.js
          test -s _site/assets/vendor/three/SVGLoader.js
      - name: Verify deployed resources and execution order
        run: node tests/deployment-regression.mjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
