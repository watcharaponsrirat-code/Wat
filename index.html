ทำให้ไอเย็นลงควบแน่นเป็นของเหลว เหมาะเมื่อจุดเดือดต่างกันมากหรือแยกตัวทำละลายจากสารละลาย","example":"กลั่นน้ำจากน้ำเกลือ","mis":"การกลั่นไม่ใช่การกรองไอ","formula":"","code":"G2U6L1S4"},{"title":"โครมาโทกราฟี","body":"องค์ประกอบเคลื่อนที่บนเฟสอยู่กับที่ต่างกันตามการละลายในตัวทำละลายและการยึดติด จึงแยกเป็นแถบ/จุด","example":"แยกสีหมึกบนกระดาษ","mis":"จุดที่วิ่งไกลไม่ได้แปลว่ามีปริมาณมากที่สุด","formula":"","code":"G2U6L1S5"},{"title":"การสกัดด้วยตัวทำละลาย","body":"เลือกตัวทำละลายที่ละลายสารเป้าหมายได้ดีและแยกจากส่วนอื่นได้ ต้องคำนึงถึงความปลอดภัยและการกำจัดตัวทำละลาย","example":"สกัดสีหรือกลิ่นจากพืช","mis":"ตัวทำละลายที่ละลายดีแต่เป็นพิษอาจไม่เหมาะ","formula":"","code":"G2U6L1S6"},{"title":"ออกแบบกระบวนการหลายขั้น","body":"สารผสมซับซ้อนอาจกรองของแข็งก่อน สกัดสารที่ต้องการ แล้วกลั่นหรือระเหยเพื่อแยกตัวทำละลาย","example":"ทราย+เกลือ+น้ำ: กรองทราย แล้วระเหย/กลั่น","mis":"ลำดับขั้นมีผลต่อประสิทธิภาพ","formula":"","code":"G2U6L1S7"}],"G2U7L1":[{"title":"หลักฐานโครงสร้างโลก","body":"มนุษย์เข้าถึงภายในโลกลึกมากไม่ได้โดยตรง จึงใช้คลื่นไหวสะเทือน ความหนาแน่น อุกกาบาต และข้อมูลอื่นสร้างแบบจำลอง","example":"คลื่น P และ S เดินทางต่างกันผ่านวัสดุต่างสถานะ","mis":"แบบจำลองชั้นโลกอาจแบ่งตามเกณฑ์ต่างกัน","formula":"","code":"G2U7L1S1"},{"title":"ชั้นโลกเชิงองค์ประกอบ","body":"เปลือกโลก เนื้อโลก และแก่นโลกต่างองค์ประกอบและความหนาแน่น โดยแก่นโลกมีธาตุเหล็ก/นิกเกิลเป็นส่วนสำคัญ","example":"เปลือกโลกบางมากเมื่อเทียบรัศมีโลก","mis":"ภาพหนังสือมักวาดความหนาไม่เป็นสเกล","formula":"","code":"G2U7L1S2"},{"title":"การผุพังทางกายภาพ","body":"หินแตกเป็นชิ้นเล็กโดยองค์ประกอบเคมีหลักไม่เปลี่ยน เช่น อุณหภูมิ การแช่แข็ง-ละลาย หรือรากไม้","example":"รากไม้ดันรอยแตก","mis":"การแตกไม่ได้แปลว่าเป็นการกร่อนแล้ว","formula":"","code":"G2U7L1S3"},{"title":"การผุพังทางเคมี","body":"แร่ในหินเกิดปฏิกิริยากับน้ำ ออกซิเจน หรือกรดอ่อน ทำให้องค์ประกอบหรือแร่เปลี่ยน","example":"หินปูนละลายด้วยน้ำกรดอ่อน","mis":"อัตราขึ้นกับสภาพอากาศและชนิดหิน","formula":"","code":"G2U7L1S4"},{"title":"การกร่อนและพัดพา","body":"น้ำ ลม คลื่น ธารน้ำแข็ง และแรงโน้มถ่วงเคลื่อนตะกอนออกจากที่เดิม ขนาดตะกอนที่พัดได้ขึ้นกับพลังงานของตัวกลาง","example":"น้ำไหลแรงพัดก้อนใหญ่ได้มากขึ้น","mis":"ผุพังเกิดที่เดิม ส่วนกร่อนมีการเคลื่อนย้าย","formula":"","code":"G2U7L1S5"},{"title":"การสะสมตะกอน","body":"เมื่อพลังงานตัวกลางลด ตะกอนตกและสะสม ขนาดใหญ่ตกก่อนในหลายสภาพ ทำให้เกิดรูปแบบชั้นตะกอนและภูมิประเทศ","example":"ปากแม่น้ำสะสมตะกอนเป็นดินดอน","mis":"ตะกอนไม่ตกพร้อมกันทุกขนาด","formula":"","code":"G2U7L1S6"}],"G2U7L2":[{"title":"การเกิดดิน","body":"ดินเกิดจากวัสดุหินผุพังผสมอินทรียวัตถุ น้ำ อากาศ และสิ่งมีชีวิต ใช้เวลานานและได้รับอิทธิพลจากภูมิอากาศ วัตถุต้นกำเนิด ภูมิประเทศ สิ่งมีชีวิต และเวลา","example":"ดินต่างพื้นที่จึงมีสมบัติต่างกัน","mis":"ดินไม่ใช่หินบดอย่างเดียว","formula":"","code":"G2U7L2S1"},{"title":"หน้าตัดและชั้นดิน","body":"ดินพัฒนาเป็นชั้นที่มีสี เนื้อดิน อินทรียวัตถุ และแร่ต่างกัน การศึกษาหน้าตัดช่วยเข้าใจการเกิดและการใช้ดิน","example":"ชั้นบนมักมีอินทรียวัตถุมากกว่า","mis":"ชื่อและจำนวนชั้นอาจต่างตามระบบจำแนก","formula":"","code":"G2U7L2S2"},{"title":"เนื้อดิน","body":"สัดส่วนทราย ทรายแป้ง และดินเหนียวกำหนดเนื้อดิน ทรายมีอนุภาคใหญ่ระบายน้ำเร็ว ดินเหนียวอนุภาคเล็กอุ้มน้ำมากกว่า","example":"ดินร่วนมีสมดุลหลายสมบัติ","mis":"สีดินไม่ได้ใช้ระบุเนื้อดินโดยตรง","formula":"","code":"G2U7L2S3"},{"title":"ความชื้นและการอุ้มน้ำ","body":"ช่องว่างและขนาดอนุภาคกำหนดการอุ้มน้ำ/ระบายน้ำ การวัดความชื้นควรชั่งมวลก่อนและหลังทำให้แห้งหรือใช้เครื่องมือเหมาะสม","example":"ดินเหนียวอาจเก็บน้ำมากแต่ระบายช้า","mis":"น้ำมากเกินทำให้รากขาดอากาศ","formula":"","code":"G2U7L2S4"},{"title":"pH ของดิน","body":"pH บอกความเป็นกรด-เบสและมีผลต่อการละลายธาตุอาหารและสิ่งมีชีวิตในดิน พืชต่างชนิดเหมาะกับช่วง pH ต่างกัน","example":"ใช้สารละลายดินและตัวชี้วัด/เครื่องวัด","mis":"pH ไม่ได้บอกความอุดมสมบูรณ์ทุกด้าน","formula":"","code":"G2U7L2S5"},{"title":"น้ำผิวดิน","body":"แม่น้ำ ลำธาร หนอง บึง และอ่างเก็บน้ำเป็นส่วนของวัฏจักรน้ำ รับน้ำจากฝน น้ำไหลบ่า และน้ำใต้ดิน","example":"คุณภาพน้ำขึ้นกับกิจกรรมในลุ่มน้ำ","mis":"น้ำใสไม่ได้แปลว่าสะอาดปลอดภัย","formula":"","code":"G2U7L2S6"},{"title":"น้ำใต้ดิน","body":"น้ำซึมผ่านช่องว่างลงสู่ชั้นอิ่มน้ำและสะสมในชั้นหินอุ้มน้ำ ระดับน้ำใต้ดินเปลี่ยนตามการเติมและการสูบ","example":"บ่อเจาะใช้น้ำจากชั้นหินอุ้มน้ำ","mis":"น้ำใต้ดินไม่ได้เป็นแม่น้ำใต้ดินเสมอ","formula":"","code":"G2U7L2S7"},{"title":"การใช้ดินและน้ำอย่างยั่งยืน","body":"การใช้ต้องพิจารณาอัตราการเกิด/เติมใหม่ การปนเปื้อน และความเสี่ยงต่อการพังทลายหรือแผ่นดินทรุด","example":"ลดการสูบน้ำเกินและป้องกันสารเคมีลงดิน","mis":"ทรัพยากรที่มีมากวันนี้อาจลดลงในระยะยาว","formula":"","code":"G2U7L2S8"}],"G2U7L3":[{"title":"น้ำท่วม","body":"เกิดเมื่อปริมาณน้ำไหลเข้าเกินความสามารถของพื้นที่หรือทางน้ำในการระบาย ปัจจัยได้แก่ฝนหนัก น้ำป่า เมืองมีพื้นผิวทึบน้ำ และการกีดขวางทางน้ำ","example":"พื้นที่ลุ่มใกล้ลำน้ำเสี่ยงสูง","mis":"น้ำท่วมทุกครั้งไม่ได้มีสาเหตุเดียว","formula":"","code":"G2U7L3S1"},{"title":"แผ่นดินถล่ม","body":"มวลดินหรือหินเคลื่อนลงตามลาดเมื่อแรงต้านน้อยกว่าแรงขับ ฝนทำให้ดินอิ่มน้ำเพิ่มน้ำหนักและลดความมั่นคง","example":"ลาดชันที่ถูกตัดไหล่เขาและฝนหนักเสี่ยงมาก","mis":"ต้นไม้ช่วยแต่ไม่ป้องกันได้ทุกกรณี","formula":"","code":"G2U7L3S2"},{"title":"กัดเซาะชายฝั่ง","body":"คลื่น กระแสน้ำ ลม และสมดุลตะกอนเปลี่ยนแนวชายฝั่ง โครงสร้างป้องกันจุดหนึ่งอาจเปลี่ยนการพัดพาตะกอนไปอีกพื้นที่","example":"กำแพงกันคลื่นอาจทำให้ตะกอนด้านข้างลด","mis":"ไม่ควรแก้เฉพาะจุดโดยไม่ดูระบบชายฝั่ง","formula":"","code":"G2U7L3S3"},{"title":"หลุมยุบ","body":"มักเกี่ยวกับโพรงใต้ดินในหินที่ละลายได้ เช่น หินปูน เมื่อหลังคาโพรงรับน้ำหนักไม่ไหวจึงยุบตัว ปัจจัยน้ำใต้ดินมีผล","example":"พื้นที่คาสต์มีความเสี่ยงเฉพาะ","mis":"หลุมยุบไม่เหมือนแผ่นดินทรุดกว้าง ๆ","formula":"","code":"G2U7L3S4"},{"title":"แผ่นดินทรุด","body":"พื้นดินลดระดับอย่างค่อยเป็นค่อยไปจากการอัดตัวของชั้นดิน เช่น สูบน้ำใต้ดินมากจนแรงดันน้ำลด","example":"บางเมืองทรุดจากการสูบน้ำบาดาล","mis":"ไม่ใช่การพังของโพรงจุดเดียว","formula":"","code":"G2U7L3S5"},{"title":"การประเมินความเสี่ยง","body":"ต้องใช้ข้อมูลฝน ความชัน ธรณีวิทยา การใช้ที่ดิน ระดับน้ำ และประวัติภัยร่วมกัน ทำแผนที่เสี่ยงและเตรียมอพยพ","example":"โรงเรียนควรรู้จุดปลอดภัยและเส้นทางอพยพ","mis":"การพยากรณ์ภัยมีความไม่แน่นอน","formula":"","code":"G2U7L3S6"}],"G2U8L1":[{"title":"พลังงานกับทรัพยากร","body":"มนุษย์ต้องเปลี่ยนพลังงานจากแหล่งต่าง ๆ เป็นไฟฟ้า ความร้อน หรือการเคลื่อนที่ การประเมินแหล่งพลังงานต้องมองทั้งวงจรชีวิต","example":"ไฟฟ้าไม่ใช่แหล่งพลังงานปฐมภูมิ แต่เป็นพาหะพลังงาน","mis":"อย่าดูเฉพาะช่วงใช้งาน","formula":"","code":"G2U8L1S1"},{"title":"ถ่านหิน","body":"เกิดจากซากพืชสะสมและเปลี่ยนแปลงภายใต้ความดัน/ความร้อนเป็นเวลานาน เผาให้พลังงานแต่ปล่อย CO₂ และมลพิษหลายชนิด","example":"โรงไฟฟ้าถ่านหินต้องควบคุมฝุ่นและก๊าซ","mis":"เป็นทรัพยากรใช้แล้วลดลง","formula":"","code":"G2U8L1S2"},{"title":"ปิโตรเลียมและแก๊สธรรมชาติ","body":"เกิดจากอินทรียวัตถุฝังในชั้นตะกอนและเปลี่ยนแปลงนาน ใช้ผลิตเชื้อเพลิงและวัตถุดิบเคมี","example":"น้ำมันดิบต้องกลั่นแยกส่วน","mis":"การรั่วไหลกระทบระบบนิเวศ","formula":"","code":"G2U8L1S3"},{"title":"พลังงานแสงอาทิตย์","body":"เซลล์แสงอาทิตย์เปลี่ยนพลังงานแสงเป็นไฟฟ้า มีการปล่อยระหว่างใช้งานต่ำแต่การผลิตแปรตามแสงและต้องใช้พื้นที่/ระบบกักเก็บหรือโครงข่าย","example":"หลังคาโรงเรียนติดโซลาร์","mis":"ไม่มีแสงกลางคืนจึงต้องจัดการพลังงาน","formula":"","code":"G2U8L1S4"},{"title":"พลังงานลมและน้ำ","body":"ลมใช้กังหันหมุนเครื่องกำเนิด ส่วนพลังน้ำใช้พลังงานศักย์/จลน์ของน้ำ ประสิทธิภาพดีบางพื้นที่แต่กระทบภูมิทัศน์/ระบบนิเวศ","example":"เขื่อนผลิตไฟแต่เปลี่ยนการไหลแม่น้ำ","mis":"พลังงานทดแทนไม่ใช่ไม่มีผลกระทบ","formula":"","code":"G2U8L1S5"},{"title":"ชีวมวล","body":"ใช้สารอินทรีย์จากพืช เศษวัสดุ หรือของเสียเป็นพลังงาน หากจัดการดีช่วยใช้ของเหลือ แต่ยังมีการปล่อยมลพิษและต้องพิจารณาการใช้ที่ดิน","example":"ก๊าซชีวภาพจากมูลสัตว์","mis":"คำว่า renewable ไม่เท่ากับ carbon neutral ทุกกรณี","formula":"","code":"G2U8L1S6"},{"title":"เปรียบเทียบและตัดสินใจ","body":"ใช้เกณฑ์ต้นทุน ความมั่นคงพลังงาน ทรัพยากรในพื้นที่ การปล่อยก๊าซ ผลต่อระบบนิเวศ และสังคม เพื่อเลือกชุดพลังงานที่เหมาะ","example":"พื้นที่แดดดีแต่ลมน้อยควรวิเคราะห์สัดส่วนต่างจากชายฝั่ง","mis":"ไม่มีแหล่งเดียวดีที่สุดทุกพื้นที่","formula":"","code":"G2U8L1S7"}],"G3U1L1":[{"title":"ปัญหากับคำถาม","body":"เริ่มจากนิยามปัญหาให้ชัดว่าเกิดกับใคร ที่ไหน เมื่อใด และผลกระทบอะไร จากนั้นเปลี่ยนเป็นคำถามที่เก็บข้อมูลได้","example":"ปัญหาขยะโรงเรียน → ขยะประเภทใดมากที่สุดและเกิดช่วงใด","mis":"ปัญหากว้างเกินไปทำให้หาแนวทางยาก","formula":"","code":"G3U1L1S1"},{"title":"รวบรวมหลักฐาน","body":"ใช้ข้อมูลปฐมภูมิ เช่น สำรวจ/วัด และข้อมูลทุติยภูมิจากแหล่งเชื่อถือ ตรวจที่มา วิธีเก็บ และความทันสมัย","example":"ชั่งขยะจริง 5 วันและอ่านข้อมูลเทศบาล","mis":"ข้อมูลบนอินเทอร์เน็ตไม่ได้มีคุณภาพเท่ากัน","formula":"","code":"G3U1L1S2"},{"title":"สร้างทางเลือก","body":"ใช้ความรู้หลายสาขาสร้างวิธีแก้มากกว่าหนึ่งแบบ คำนึงถึงเทคนิค งบ เวลา ผู้ใช้ และผลกระทบ","example":"ลดใช้ แยกขยะ ปรับระบบจัดซื้อ และให้แรงจูงใจ","mis":"อย่าตัดสินวิธีแรกก่อนเปรียบเทียบ","formula":"","code":"G3U1L1S3"},{"title":"เกณฑ์และข้อจำกัด","body":"กำหนดเกณฑ์ เช่น ประสิทธิภาพ ความปลอดภัย ต้นทุน สิ่งแวดล้อม และความเป็นธรรม พร้อมข้อจำกัดจริง","example":"งบ 20,000 บาทและต้องดำเนินใน 1 ภาคเรียน","mis":"เกณฑ์ต้องวัดหรือเปรียบเทียบได้","formula":"","code":"G3U1L1S4"},{"title":"ประเมินทางเลือก","body":"สร้างตารางตัดสินหรือวิเคราะห์ข้อดีข้อเสีย ใช้หลักฐานให้คะแนนและอธิบายเหตุผล","example":"ทางเลือก A ลดขยะได้มากแต่ต้นทุนสูง","mis":"การให้คะแนนต้องอธิบายฐานของคะแนน","formula":"","code":"G3U1L1S5"},{"title":"ทดสอบและปรับปรุง","body":"ทดลองขนาดเล็ก เก็บข้อมูลผลจริง เปรียบเทียบกับเกณฑ์ แล้วปรับแบบก่อนใช้เต็มรูปแบบ","example":"ทดลองถังแยกขยะหนึ่งอาคาร 2 สัปดาห์","mis":"ความล้มเหลวของต้นแบบเป็นข้อมูลเพื่อปรับปรุง","formula":"","code":"G3U1L1S6"},{"title":"ผลกระทบและจริยธรรม","body":"การแก้ปัญหาหนึ่งอาจสร้างผลกระทบใหม่ ต้องพิจารณาผู้ได้/เสียประโยชน์ ความเป็นส่วนตัว ความปลอดภัย และความยั่งยืน","example":"ระบบกล้องตรวจขยะมีประเด็นข้อมูลส่วนบุคคล","mis":"เทคโนโลยีที่ทำงานได้ไม่จำเป็นต้องเหมาะสมทางจริยธรรม","formula":"","code":"G3U1L1S7"}],"G3U2L1":[{"title":"โครโมโซม DNA และยีน","body":"DNA เป็นสารพันธุกรรม ยีนเป็นช่วงของ DNA ที่มีข้อมูลเกี่ยวข้องกับการสร้างผลิตภัณฑ์หรือควบคุมลักษณะ และ DNA จัดรวมกับโปรตีนเป็นโครโมโซม","example":"หนึ่งโครโมโซมมี DNA ยาวมากและมียีนจำนวนมาก","mis":"ยีนไม่ได้เป็นเม็ดเล็กที่เรียงอยู่นอก DNA","formula":"","code":"G3U2L1S1"},{"title":"แอลลีล","body":"ยีนตำแหน่งหนึ่งอาจมีรูปแบบต่างกันเรียกแอลลีล สิ่งมีชีวิตดิพลอยด์มีแอลลีลจากพ่อและแม่อย่างละหนึ่งสำหรับหลายยีน","example":"T และ t เป็นสัญลักษณ์แทนแอลลีลในแบบจำลอง","mis":"ตัวอักษรใหญ่ไม่ได้แปลว่าแอลลีลพบมากกว่า","formula":"","code":"G3U2L1S2"},{"title":"การทดลองเมนเดล","body":"เมนเดลเลือกถั่วที่ลักษณะต่างชัด ควบคุมการผสม และนับลูกจำนวนมาก พบอัตราส่วนที่อธิบายด้วยการแยกของปัจจัยพันธุกรรม","example":"รุ่น F2 ของลักษณะเด่นสมบูรณ์มักใกล้ 3:1","mis":"อัตราส่วนจริงไม่จำเป็นตรงเป๊ะเมื่อจำนวนตัวอย่างน้อย","formula":"","code":"G3U2L1S3"},{"title":"เด่นและด้อย","body":"ในแบบจำลองเด่นสมบูรณ์ แอลลีลเด่นแสดงฟีโนไทป์ในเฮเทอโรไซกัส ส่วนแอลลีลด้อยแสดงเมื่อไม่มีแอลลีลเด่น","example":"Tt แสดงลักษณะเด่น","mis":"เด่นไม่ได้แปลว่าดี แข็งแรง หรือพบมาก","formula":"","code":"G3U2L1S4"},{"title":"จีโนไทป์และฟีโนไทป์","body":"จีโนไทป์คือชุดแอลลีล เช่น TT Tt tt ส่วนฟีโนไทป์คือสิ่งที่สังเกตได้และอาจได้รับอิทธิพลจากสิ่งแวดล้อม","example":"TT กับ Tt อาจมีฟีโนไทป์เหมือนกัน","mis":"ฟีโนไทป์ไม่เปิดเผยจีโนไทป์ได้เสมอ","formula":"","code":"G3U2L1S5"},{"title":"ตารางพุนเนตต์","body":"เขียนแกมีตของพ่อแม่บนขอบตารางแล้วรวมแอลลีลในช่อง ใช้ทำนายความน่าจะเป็นของลูกแต่ละจีโนไทป์ ไม่ใช่ลำดับลูกจริง","example":"Tt×Tt → 1 TT : 2 Tt : 1 tt","mis":"ลูก 4 คนไม่ได้จำเป็นต้องได้ครบ 1:2:1","formula":"","code":"G3U2L1S6"},{"title":"ไมโทซิส","body":"เซลล์ร่างกายแบ่งเพื่อการเจริญ ซ่อมแซม และทดแทน ได้เซลล์ลูกที่มีจำนวนโครโมโซมเท่าเดิมโดยทั่วไป","example":"แผลหายจากการแบ่งเซลล์","mis":"ไมโทซิสไม่สร้างแกมีตเป็นหน้าที่หลัก","formula":"","code":"G3U2L1S7"},{"title":"ไมโอซิส","body":"สร้างเซลล์สืบพันธุ์ ลดจำนวนโครโมโซมครึ่งหนึ่งและสร้างความหลากหลายจากการจัดเรียง/แลกเปลี่ยนสารพันธุกรรม","example":"แกมีตมนุษย์มีโครโมโซมครึ่งเซลล์ร่างกาย","mis":"ไมโอซิสไม่ได้ให้เซลล์ลูกเหมือนกันทั้งหมด","formula":"","code":"G3U2L1S8"},{"title":"โรคทางพันธุกรรม","body":"เกิดจากการเปลี่ยนแปลงยีนหรือโครโมโซม รูปแบบถ่ายทอดแตกต่างกัน การวิเคราะห์ผังเครือญาติช่วยติดตามบางลักษณะ","example":"ธาลัสซีเมียเกี่ยวกับยีนการสร้างฮีโมโกลบิน","mis":"โรคทางพันธุกรรมไม่เท่ากับโรคที่พ่อแม่ต้องแสดงอาการเสมอ","formula":"","code":"G3U2L1S9"},{"title":"GMO","body":"สิ่งมีชีวิตดัดแปรพันธุกรรมถูกเปลี่ยน DNA ด้วยเทคโนโลยีเพื่อให้ได้ลักษณะเฉพาะ เช่น ต้านแมลงหรือสร้างสารบางชนิด การประเมินต้องดูประโยชน์ ความเสี่ยง และข้อมูลความปลอดภัยรายกรณี","example":"พืช Bt สร้างโปรตีนที่กระทบแมลงเป้าหมาย","mis":"คำว่า GMO ไม่บอกว่า “ดี” หรือ “อันตราย” โดยอัตโนมัติ","formula":"","code":"G3U2L1S10"}],"G3U3L1":[{"title":"คลื่นคืออะไร","body":"คลื่นถ่ายโอนพลังงานและข้อมูลจากที่หนึ่งไปอีกที่หนึ่ง โดยสสารของตัวกลางไม่จำเป็นต้องเคลื่อนตามคลื่นทั้งหมด","example":"คลื่นบนเชือกเคลื่อน แต่จุดบนเชือกสั่นรอบตำแหน่ง","mis":"อย่าสับสนการเคลื่อนของรูปคลื่นกับอนุภาค","formula":"","code":"G3U3L1S1"},{"title":"คลื่นตามขวางและตามยาว","body":"คลื่นตามขวางมีการสั่นตั้งฉากทิศเคลื่อนคลื่น ส่วนตามยาวสั่นขนานทิศคลื่น","example":"คลื่นเชือกตามขวาง เสียงในอากาศตามยาว","mis":"การจัดประเภทพิจารณาทิศการสั่นเทียบกับทิศคลื่น","formula":"","code":"G3U3L1S2"},{"title":"แอมพลิจูด","body":"แอมพลิจูดคือการกระจัดสูงสุดจากตำแหน่งสมดุลและสัมพันธ์กับพลังงานของคลื่นในหลายระบบ","example":"สั่นเชือกแรงขึ้นทำให้แอมพลิจูดมากขึ้น","mis":"แอมพลิจูดไม่ใช่ความยาวคลื่น","formula":"","code":"G3U3L1S3"},{"title":"ความยาวคลื่น","body":"ระยะระหว่างจุดที่มีเฟสเดียวกันติดกัน เช่น ยอดถึงยอด สัญลักษณ์ λ","example":"วัดยอดหนึ่งถึงยอดถัดไป","mis":"อย่าวัดยอดถึงท้องเป็นหนึ่งความยาวคลื่น","formula":"","code":"G3U3L1S4"},{"title":"ความถี่และคาบ","body":"ความถี่ f คือจำนวนรอบต่อวินาที หน่วย Hz คาบ T คือเวลาต่อหนึ่งรอบ และ T=1/f","example":"5 Hz → T=0.2 s","mis":"ความถี่สูงหมายถึงคาบสั้น","formula":"T = 1/f","code":"G3U3L1S5"},{"title":"อัตราเร็วคลื่น","body":"v=fλ เชื่อมอัตราเร็ว ความถี่ และความยาวคลื่น เมื่อคลื่นเปลี่ยนตัวกลางความถี่จากแหล่งกำเนิดมักคงเดิมแต่อัตราเร็วและ λ เปลี่ยน","example":"f=5 Hz, λ=2 m → v=10 m/s","mis":"อย่าเปลี่ยน f โดยไม่มีเหตุเมื่อผ่านตัวกลาง","formula":"v = fλ","code":"G3U3L1S6"},{"title":"คลื่นแม่เหล็กไฟฟ้า","body":"เกิดจากสนามไฟฟ้าและแม่เหล็กเปลี่ยนแปลง เดินทางในสุญญากาศได้และในสุญญากาศมีอัตราเร็วเท่ากันทุกช่วงสเปกตรัม","example":"แสงจากดวงอาทิตย์เดินทางผ่านอวกาศ","mis":"สีต่างกันไม่ได้เดินทางเร็วต่างกันในสุญญากาศ","formula":"","code":"G3U3L1S7"},{"title":"สเปกตรัมแม่เหล็กไฟฟ้า","body":"เรียงจากความถี่ต่ำไปสูง: วิทยุ ไมโครเวฟ อินฟราเรด แสงเห็นได้ อัลตราไวโอเลต เอกซ์ แกมมา พลังงานโฟตอนเพิ่มตามความถี่","example":"X-ray ใช้ภาพทางการแพทย์แต่ต้องจำกัดปริมาณรับ","mis":"คำว่า radiation ไม่ได้หมายถึงรังสีไอออไนซ์ทั้งหมด","formula":"","code":"G3U3L1S8"}],"G3U3L2":[{"title":"การเดินทางของแสง","body":"แสงเดินทางเป็นเส้นตรงในตัวกลางสม่ำเสมอและใช้รังสีแทนทิศการเดินทางในแบบจำลอง","example":"เงาเกิดเพราะแสงไม่อ้อมวัตถุใหญ่ชัดเจนในแบบเรขาคณิต","mis":"รังสีเป็นเส้นแบบจำลองไม่ใช่เส้นที่จับได้","formula":"","code":"G3U3L2S1"},{"title":"กฎการสะท้อน","body":"มุมตกกระทบเท่ากับมุมสะท้อนเมื่อวัดจากเส้นปกติ รังสีตกกระทบ รังสีสะท้อน และเส้นปกติอยู่ในระนาบเดียวกัน","example":"มุมตก 35° → มุมสะท้อน 35°","mis":"อย่าวัดจากผิวกระจก","formula":"","code":"G3U3L2S2"},{"title":"กระจกเงาราบ","body":"ให้ภาพเสมือน หัวตั้ง ขนาดเท่าวัตถุ ระยะภาพหลังกระจกเท่าระยะวัตถุหน้ากระจก และกลับซ้ายขวาเชิงการรับรู้","example":"ยืน 2 m หน้ากระจก ภาพอยู่ 2 m หลังกระจก","mis":"ภาพเสมือนไม่รวมแสงจริงบนฉาก","formula":"","code":"G3U3L2S3"},{"title":"กระจกเว้า","body":"รวมรังสีขนานสู่โฟกัส ให้ภาพจริงหรือเสมือนตามตำแหน่งวัตถุ ใช้รังสีหลักช่วยวาดภาพ","example":"วัตถุนอกจุดโฟกัสบางตำแหน่งได้ภาพจริงกลับหัว","mis":"อย่าจำชนิดภาพโดยไม่ดูตำแหน่งวัตถุ","formula":"","code":"G3U3L2S4"},{"title":"กระจกนูน","body":"กระจายรังสีเสมือนออกจากโฟกัสหลังกระจก ให้ภาพเสมือน หัวตั้ง และเล็กลงสำหรับวัตถุจริงทั่วไป จึงเห็นมุมกว้าง","example":"กระจกมองข้างรถ","mis":"ภาพเล็กทำให้กะระยะผิดได้","formula":"","code":"G3U3L2S5"},{"title":"การหักเห","body":"เมื่อแสงผ่านตัวกลางที่อัตราเร็วต่างกัน ทิศเปลี่ยนยกเว้นตกตั้งฉาก เข้าตัวกลางดัชนีสูงกว่าจะเบนเข้าใกล้เส้นปกติ","example":"หลอดในน้ำดูหัก","mis":"แสงไม่ได้หักเพราะชนผิวแล้วเด้งแบบสะท้อน","formula":"","code":"G3U3L2S6"},{"title":"ดัชนีหักเห","body":"n=c/v บอกว่าแสงช้าลงกว่าสุญญากาศเท่าใด ตัวกลางดัชนีสูงมีอัตราเร็วแสงต่ำกว่า","example":"แก้วมี n มากกว่าอากาศ","mis":"ดัชนีไม่ใช่ความหนาแน่นมวลโดยตรง","formula":"n = c/v","code":"G3U3L2S7"},{"title":"การสะท้อนกลับหมด","body":"เกิดเมื่อแสงเดินจากตัวกลางดัชนีสูงไปต่ำและมุมตกกระทบมากกว่ามุมวิกฤต แสงสะท้อนกลับทั้งหมด","example":"ใยแก้วนำแสงใช้หลักนี้","mis":"ไม่เกิดเมื่อเดินจากดัชนีต่ำไปสูง","formula":"","code":"G3U3L2S8"},{"title":"เลนส์นูน","body":"เลนส์นูนรวมแสง รังสีขนานผ่านโฟกัสหลังเลนส์ ให้ภาพจริงหรือเสมือนตามระยะวัตถุ","example":"แว่นขยายวางวัตถุภายในโฟกัสให้ภาพเสมือนขยาย","mis":"เลนส์นูนไม่ได้ให้ภาพขยายทุกตำแหน่ง","formula":"","code":"G3U3L2S9"},{"title":"เลนส์เว้า","body":"เลนส์เว้ากระจายแสง รังสีขนานดูเสมือนออกจากโฟกัสหน้าเลนส์ ให้ภาพเสมือน หัวตั้ง เล็กลงสำหรับวัตถุจริง","example":"แว่นแก้สายตาสั้นใช้เลนส์กระจายตามหลักพื้นฐาน","mis":"อย่าสลับโฟกัสจริง/เสมือน","formula":"","code":"G3U3L2S10"},{"title":"การมองเห็นและความสว่าง","body":"มองเห็นเมื่อแสงจากแหล่งกำเนิดหรือสะท้อนจากวัตถุเข้าสู่ตา แสงจ้าหรือมืดเกินทำให้ตาล้า ควรจัดแสงเหมาะและลดแสงสะท้อน","example":"หน้าจอในห้องมืดมากอาจทำให้ไม่สบายตา","mis":"ตาไม่ได้ปล่อยแสงออกไปเห็นวัตถุ","formula":"","code":"G3U3L2S11"}],"G3U4L1":[{"title":"แรงโน้มถ่วงในระบบสุริยะ","body":"ดวงอาทิตย์มีมวลมากจึงสร้างแรงโน้มถ่วงดึงดาวเคราะห์ ดาวเคราะห์และดวงจันทร์ก็ดึงดูดกัน แรงลดลงเมื่อระยะเพิ่ม","example":"แรงโน้มถ่วงยึดโลกในวงโคจร","mis":"อวกาศไม่ได้ไม่มีแรงโน้มถ่วง","formula":"","code":"G3U4L1S1"},{"title":"วงโคจร","body":"วัตถุโคจรเพราะมีความเร็วด้านข้างขณะถูกแรงโน้มถ่วงดึงเข้าศูนย์กลาง จึงเกิดการตกอย่างต่อเนื่องรอบวัตถุแม่","example":"ดาวเทียมตกไปรอบโลกโดยไม่ชนพื้น","mis":"ไม่มีแรงขับตลอดเวลาไม่ได้แปลว่าจะตกลงตรง ๆ","formula":"","code":"G3U4L1S2"},{"title":"แกนโลกเอียง","body":"แกนหมุนโลกเอียงประมาณ 23.5° เทียบระนาบโคจร ทำให้ซีกโลกได้รับมุมแสงและช่วงกลางวันต่างกันตลอดปี","example":"มิถุนายนซีกเหนือเอียงเข้าหาดวงอาทิตย์มากกว่า","mis":"ฤดูไม่เกิดจากระยะโลก-ดวงอาทิตย์เป็นหลัก","formula":"","code":"G3U4L1S3"},{"title":"ฤดู","body":"เมื่อซีกโลกเอียงเข้าหาดวงอาทิตย์ แสงตกตรงขึ้นและกลางวันนานขึ้น จึงรับพลังงานต่อพื้นที่มากขึ้น เกิดฤดูตรงข้ามกันระหว่างซีกโลก","example":"ธันวาคมซีกโลกใต้เป็นฤดูร้อน","mis":"ทั้งโลกไม่ได้มีฤดูเดียวกันพร้อมกัน","formula":"","code":"G3U4L1S4"},{"title":"เส้นทางปรากฏดวงอาทิตย์","body":"จุดขึ้น-ตกและความสูงเที่ยงวันเปลี่ยนตามฤดูกาลและละติจูด เป็นผลจากการหมุนโลก แกนเอียง และการโคจร","example":"เงาเที่ยงวันยาวต่างกันตามฤดู","mis":"การเคลื่อนปรากฏรายวันไม่ได้แปลว่าดวงอาทิตย์หมุนรอบโลก","formula":"","code":"G3U4L1S5"},{"title":"ข้างขึ้นข้างแรม","body":"ดวงจันทร์ครึ่งหนึ่งได้รับแสงเสมอ แต่เรามองเห็นส่วนสว่างต่างสัดส่วนเมื่อดวงจันทร์เปลี่ยนตำแหน่งรอบโลก","example":"เดือนดับอยู่ใกล้แนวโลก-ดวงอาทิตย์ด้านเดียวกัน","mis":"ไม่ใช่เงาโลกบัง ยกเว้นจันทรุปราคา","formula":"","code":"G3U4L1S6"},{"title":"น้ำขึ้นน้ำลง","body":"แรงโน้มถ่วงของดวงจันทร์ทำให้เกิดป่องน้ำสองด้านร่วมกับการเคลื่อนของระบบโลก-ดวงจันทร์ ดวงอาทิตย์เสริม/หักล้างบางส่วน","example":"วันเดือนดับ/วันเพ็ญเกิดน้ำเกิดช่วงต่างระดับมาก","mis":"เวลาน้ำขึ้นจริงขึ้นกับชายฝั่งและภูมิประเทศด้วย","formula":"","code":"G3U4L1S7"},{"title":"ดาวเทียม","body":"ดาวเทียมวงโคจรต่างระดับเหมาะกับงานต่างกัน เช่น สื่อสาร อุตุนิยมวิทยา สำรวจโลก นำทาง","example":"ดาวเทียมค้างฟ้าดูเหมือนอยู่ตำแหน่งเดิมเหนือเส้นศูนย์สูตร","mis":"ดาวเทียมทุกดวงไม่ได้ค้างฟ้า","formula":"","code":"G3U4L1S8"},{"title":"เทคโนโลยีอวกาศและข้อมูล","body":"กล้องโทรทรรศน์ ยานสำรวจ และดาวเทียมเก็บคลื่นแม่เหล็กไฟฟ้า/ข้อมูลจากระยะไกล ช่วยทดสอบแบบจำลองทางดาราศาสตร์และติดตามโลก","example":"ภาพดาวเทียมใช้ติดตามพายุ","mis":"ภาพสีดาวเทียมบางชนิดเป็นสีผสมเพื่อเน้นข้อมูล","formula":"","code":"G3U4L1S9"},{"title":"ขยะอวกาศและข้อจำกัด","body":"การใช้วงโคจรเพิ่มความเสี่ยงการชนและขยะอวกาศ ต้องออกแบบภารกิจ การลดเศษซาก และการจัดการเมื่อหมดอายุ","example":"ดาวเทียมบางดวงลดวงโคจรให้เผาไหม้ในบรรยากาศ","mis":"เทคโนโลยีอวกาศมีทั้งประโยชน์และต้นทุน","formula":"","code":"G3U4L1S10"}],"G3U5L1":[{"title":"การเปลี่ยนแปลงทางเคมี","body":"ปฏิกิริยาเคมีทำให้สารตั้งต้นเปลี่ยนเป็นผลิตภัณฑ์ที่มีองค์ประกอบหรือโครงสร้างใหม่ แตกต่างจากการเปลี่ยนสถานะทางกายภาพ","example":"เผาแมกนีเซียมเกิดสารใหม่","mis":"น้ำแข็งละลายไม่ใช่ปฏิกิริยาเคมี","formula":"","code":"G3U5L1S1"},{"title":"หลักฐานการเกิดปฏิกิริยา","body":"การเกิดแก๊ส ตะกอน สี กลิ่น แสง หรืออุณหภูมิเปลี่ยนอาจเป็นหลักฐาน แต่ควรพิจารณาร่วมกับบริบทเพราะบางการเปลี่ยนแปลงทางกายภาพก็ให้สัญญาณคล้ายกัน","example":"ฟองจากกรดกับโลหะเป็นแก๊สผลิตภัณฑ์","mis":"เดือดจากให้ความร้อนไม่ใช่หลักฐานเคมีเสมอ","formula":"","code":"G3U5L1S2"},{"title":"สมการข้อความ","body":"เขียนสารตั้งต้น → ผลิตภัณฑ์ช่วยสื่อสารว่าอะไรเปลี่ยนเป็นอะไร และเป็นฐานก่อนเรียนสมการเคมีเชิงสัญลักษณ์","example":"กรด + เบส → เกลือ + น้ำ","mis":"ลูกศรไม่ได้แปลว่าเท่ากับ","formula":"","code":"G3U5L1S3"},{"title":"กฎอนุรักษ์มวล","body":"ในระบบปิด มวลรวมก่อนและหลังปฏิกิริยาเท่ากันเพราะอะตอมไม่ได้หายหรือเกิดใหม่ เพียงจัดเรียงตัวใหม่","example":"ปฏิกิริยาในถุงปิดชั่งมวลเท่าเดิม","mis":"ระบบเปิดอาจมวลชั่งเปลี่ยนเพราะแก๊สเข้า/ออก","formula":"","code":"G3U5L1S4"},{"title":"คายและดูดความร้อน","body":"ปฏิกิริยาคายความร้อนถ่ายพลังงานสู่สิ่งแวดล้อม อุณหภูมิรอบระบบมักเพิ่ม; ดูดความร้อนรับพลังงาน อุณหภูมิมักลด","example":"ถุงประคบร้อน/เย็นบางชนิดใช้ปฏิกิริยา","mis":"อุณหภูมิเปลี่ยนต้องดูทิศพลังงานให้ถูก","formula":"","code":"G3U5L1S5"},{"title":"กรดและเบส","body":"สารละลายกรดและเบสมีสมบัติต่างกัน วัดด้วยตัวบ่งชี้หรือ pH ปฏิกิริยาการเป็นกลางระหว่างกรดกับเบสให้เกลือและน้ำตามกรณี","example":"HCl + NaOH → เกลือ + น้ำ","mis":"สารเป็นกลางไม่ได้แปลว่าไม่มีไอออน","formula":"","code":"G3U5L1S6"},{"title":"กรดกับโลหะ","body":"กรดหลายชนิดทำปฏิกิริยากับโลหะบางชนิดเกิดเกลือและแก๊สไฮโดรเจน อัตราขึ้นกับชนิดโลหะ ความเข้มข้น และพื้นที่ผิว","example":"สังกะสีกับกรดเกิดฟอง H₂","mis":"โลหะทุกชนิดไม่ได้ทำปฏิกิริยาเท่ากัน","formula":"","code":"G3U5L1S7"},{"title":"เบสกับโลหะบางชนิด","body":"เบสเข้มข้นบางชนิดทำปฏิกิริยากับโลหะบางประเภท เช่น อะลูมิเนียม ต้องทดลองด้วยความระมัดระวัง","example":"อะลูมิเนียมกับ NaOH ในเงื่อนไขเหมาะเกิดแก๊ส","mis":"อย่าเหมารวมเบสทุกชนิดกับโลหะทุกชนิด","formula":"","code":"G3U5L1S8"},{"title":"สนิมเหล็ก","body":"เหล็กเกิดออกซิเดชันเมื่อมีออกซิเจนและน้ำ/ความชื้น การเคลือบ ทาสี ชุบน้ำมัน หรือใช้โลหะป้องกันช่วยลดการสัมผัสหรือเปลี่ยนปฏิกิริยา","example":"ตะปูแห้งและไร้ออกซิเจนเกิดสนิมช้ากว่า","mis":"สนิมไม่ใช่เพียงเหล็กเปลี่ยนสี","formula":"","code":"G3U5L1S9"},{"title":"ประโยชน์และผลกระทบ","body":"ปฏิกิริยาใช้ผลิตอาหาร วัสดุ ยา และพลังงาน แต่ก็สร้างมลพิษ การกัดกร่อน หรือของเสีย การออกแบบกระบวนการต้องลดความเสี่ยง","example":"ตัวเร่งช่วยลดพลังงาน/เวลาบางกระบวนการ","mis":"ประโยชน์ทางเศรษฐกิจไม่ใช่เกณฑ์เดียว","formula":"","code":"G3U5L1S10"}],"G3U5L2":[{"title":"แนวคิดการเลือกวัสดุ","body":"เลือกวัสดุจากสมบัติที่เกี่ยวกับงาน เช่น ความแข็ง ความเหนียว การนำไฟฟ้า ความหนาแน่น ทนร้อน ทนสารเคมี ราคา และผลกระทบ","example":"ขวดน้ำต้องเบา ทนแตก และปลอดภัย","mis":"วัสดุแข็งที่สุดไม่ได้ดีที่สุดทุกงาน","formula":"","code":"G3U5L2S1"},{"title":"พอลิเมอร์","body":"โมเลกุลสายยาวเกิดจากหน่วยย่อยซ้ำ ทำให้ปรับสมบัติได้กว้าง เช่น ยืดหยุ่น ใส แข็ง หรือทนสารเคมี","example":"PE ใช้ถุง/ภาชนะหลายชนิด","mis":"พลาสติกทุกชนิดรีไซเคิลเหมือนกันไม่ได้","formula":"","code":"G3U5L2S2"},{"title":"เทอร์โมพลาสติกและเทอร์โมเซต","body":"เทอร์โมพลาสติกอ่อนตัวเมื่อร้อนและขึ้นรูปซ้ำได้หลายชนิด ส่วนเทอร์โมเซตมีโครงข่ายถาวรและไม่หลอมขึ้นรูปซ้ำง่าย","example":"ฝาขวดกับด้ามหม้ออาจใช้พอลิเมอร์ต่างกลุ่ม","mis":"ความร้อนสูงอาจทำให้สลายไม่ใช่หลอม","formula":"","code":"G3U5L2S3"},{"title":"เซรามิก","body":"วัสดุอนินทรีย์ที่ผ่านความร้อน มักแข็ง ทนสึก ทนร้อน และเป็นฉนวน แต่เปราะและแตกเมื่อกระแทก","example":"กระเบื้องและฉนวนไฟฟ้า","mis":"แข็งกับเหนียวเป็นคนละสมบัติ","formula":"","code":"G3U5L2S4"},{"title":"โลหะ","body":"พันธะโลหะทำให้โลหะหลายชนิดนำไฟฟ้า/ความร้อนดี เหนียวและขึ้นรูปได้ แต่ความหนาแน่นและการกัดกร่อนต่างกัน","example":"อะลูมิเนียมเบา เหล็กแข็งแรง ทองแดงนำไฟดี","mis":"โลหะทุกชนิดเป็นแม่เหล็กไม่ได้","formula":"","code":"G3U5L2S5"},{"title":"โลหะผสม","body":"ผสมโลหะหรือธาตุอื่นเพื่อปรับสมบัติ เช่น เพิ่มความแข็ง ทนกัดกร่อน หรือเปลี่ยนจุดหลอมเหลว","example":"สเตนเลสทนสนิมกว่าเหล็กกล้าบางชนิด","mis":"โลหะผสมไม่ใช่สารบริสุทธิ์","formula":"","code":"G3U5L2S6"},{"title":"วัสดุผสม","body":"รวมวัสดุสองชนิดขึ้นไปโดยยังมีเฟสต่างกัน เพื่อให้สมบัติรวมดีขึ้น เช่น เส้นใยรับแรงในเมทริกซ์","example":"คอนกรีตเสริมเหล็กและไฟเบอร์กลาส","mis":"สมบัติไม่ได้เป็นค่าเฉลี่ยง่าย ๆ","formula":"","code":"G3U5L2S7"},{"title":"ผลกระทบตลอดวงจรชีวิต","body":"ประเมินตั้งแต่การได้วัตถุดิบ การผลิต การขนส่ง การใช้งาน ไปจนถึงการซ่อม ใช้ซ้ำ รีไซเคิล หรือกำจัด","example":"วัสดุเบาอาจลดพลังงานขนส่ง","mis":"วัสดุรีไซเคิลได้แต่ไม่มีระบบเก็บก็อาจไม่ถูกรีไซเคิล","formula":"","code":"G3U5L2S8"}],"G3U6L1":[{"title":"วงจรไฟฟ้า","body":"กระแสไหลได้เมื่อมีเส้นทางปิดและแหล่งกำเนิดสร้างความต่างศักย์ วงจรประกอบด้วยแหล่งจ่าย สาย และอุปกรณ์ใช้พลังงาน","example":"สวิตช์เปิดทำให้วงจรขาดกระแสหยุด","mis":"คำว่า “ไฟไหลจากแบตเตอรี่หมด” ไม่ใช่แบบจำลองที่ดี","formula":"","code":"G3U6L1S1"},{"title":"กระแสไฟฟ้า","body":"กระแส I คืออัตราการไหลของประจุ I=Q/t หน่วยแอมแปร์ แอมมิเตอร์ต้องต่ออนุกรมและมีความต้านทานต่ำ","example":"ประจุ 10 C ผ่าน 2 s → 5 A","mis":"อย่าต่อแอมมิเตอร์คร่อมแหล่งจ่ายโดยตรง","formula":"I = Q/t","code":"G3U6L1S2"},{"title":"ทิศกระแสและอิเล็กตรอน","body":"ทิศกระแสแบบดั้งเดิมภายนอกแหล่งจ่ายกำหนดจากขั้วบวกไปลบ ขณะที่อิเล็กตรอนในโลหะเคลื่อนโดยเฉลี่ยจากลบไปบวก","example":"ใช้ทิศกระแสมาตรฐานในการวิเคราะห์วงจร","mis":"อย่าสลับทศจนคำนวณเครื่องหมายผิด","formula":"","code":"G3U6L1S3"},{"title":"ความต่างศักย์","body":"V คือพลังงานต่อประจุระหว่างสองจุด วัดด้วยโวลต์มิเตอร์ต่อขนานคร่อมอุปกรณ์","example":"แบตเตอรี่ 1.5 V ให้พลังงาน 1.5 J ต่อ 1 C โดยอุดมคติ","mis":"โวลต์มิเตอร์ไม่ได้วัดกระแส","formula":"","code":"G3U6L1S4"},{"title":"ความต้านทาน","body":"R บอกการขัดขวางกระแส ขึ้นกับวัสดุ รูปร่าง และอุณหภูมิ ตัวต้านทานใช้ควบคุมกระแสในวงจร","example":"ลวดยาว/บางมักต้านทานมากขึ้น","mis":"R ไม่ใช่การสูญเสียประจุ","formula":"","code":"G3U6L1S5"},{"title":"กฎของโอห์ม","body":"สำหรับตัวนำโอห์มิกที่อุณหภูมิคงที่ V=IR กราฟ V-I เป็นเส้นตรงผ่านจุดกำเนิดและความชันสัมพันธ์กับ R ตามแกนที่เลือก","example":"12 V กับ 6 Ω → 2 A","mis":"ต้องดูว่าแกนกราฟเป็น V เทียบ I หรือ I เทียบ V","formula":"V = IR","code":"G3U6L1S6"},{"title":"วงจรอนุกรม","body":"อุปกรณ์ต่อเส้นทางเดียว กระแสเท่ากันทุกจุด ความต่างศักย์รวมเท่าผลรวมคร่อมอุปกรณ์ และความต้านทานรวมเพิ่ม","example":"R 2Ω + 3Ω อนุกรม → 5Ω","mis":"แรงดันไม่ได้เท่ากันทุกตัวถ้า R ต่างกัน","formula":"","code":"G3U6L1S7"},{"title":"วงจรขนาน","body":"อุปกรณ์ต่อคร่อมจุดคู่เดียวกัน ความต่างศักย์แต่ละแขนงเท่ากับแหล่งจ่าย กระแสรวมเป็นผลรวมแขนง ความต้านทานรวมลดลง","example":"เครื่องใช้ในบ้านต่อขนาน","mis":"กระแสแขนงไม่จำเป็นเท่ากัน","formula":"","code":"G3U6L1S8"},{"title":"การต่อมิเตอร์","body":"แอมมิเตอร์อนุกรมกับส่วนที่วัดกระแส โวลต์มิเตอร์ขนานคร่อมส่วนที่วัดความต่างศักย์ ต้องเลือกช่วงวัดและขั้วให้เหมาะ","example":"วงจรทดลอง V-I ต้องวัดพร้อมกันหลายค่า","mis":"ต่อผิดอาจทำให้เครื่องมือเสียหาย","formula":"","code":"G3U6L1S9"},{"title":"ความปลอดภัย","body":"กระแสสูงทำให้ร้อนและอันตราย ฟิวส์/เบรกเกอร์ช่วยตัดเมื่อกระแสเกิน ฉนวนและสายดินช่วยลดความเสี่ยง","example":"ไม่จับอุปกรณ์ไฟฟ้าด้วยมือเปียก","mis":"แรงดันและกระแสทั้งคู่เกี่ยวข้องกับอันตราย","formula":"","code":"G3U6L1S10"}],"G3U6L2":[{"title":"กำลังไฟฟ้า","body":"กำลังคืออัตราการเปลี่ยน/ใช้พลังงาน P=VI หน่วยวัตต์ เครื่องกำลังสูงใช้พลังงานต่อเวลามากกว่าเมื่อทำงานที่ค่ากำหนด","example":"เครื่อง 1000 W ใช้พลังงาน 1000 J ต่อวินาที","mis":"กำลังไม่ใช่พลังงานรวม","formula":"P = VI","code":"G3U6L2S1"},{"title":"พลังงานไฟฟ้า","body":"E=Pt ถ้า P เป็น kW และ t เป็นชั่วโมง จะได้ kWh ซึ่งเป็นหน่วยที่ใช้คิดค่าไฟ","example":"1 kW เปิด 2 h = 2 kWh","mis":"kWh เป็นหน่วยพลังงาน ไม่ใช่กำลัง","formula":"E = Pt","code":"G3U6L2S2"},{"title":"ค่าไฟและการประหยัด","body":"พลังงานรวมขึ้นกับกำลังและเวลา จึงลดการใช้ได้ทั้งเลือกอุปกรณ์ประสิทธิภาพดีและลดเวลาทำงานที่ไม่จำเป็น","example":"แอร์ 1000 W เปิด 8 h ใช้มากกว่า 2000 W เปิด 1 h","mis":"อย่าดูแต่เลขวัตต์","formula":"","code":"G3U6L2S3"},{"title":"ตัวต้านทาน","body":"ใช้จำกัดกระแส แบ่งแรงดัน และกำหนดสภาวะวงจร เลือกค่าความต้านทานและกำลังวัตต์ให้เหมาะ","example":"ต่อ R กับ LED เพื่อจำกัดกระแส","mis":"ตัวต้านทานไม่สร้างพลังงาน","formula":"","code":"G3U6L2S4"},{"title":"ไดโอด","body":"รอยต่อสารกึ่งตัวนำยอมให้กระแสไหลดีในทิศ forward มากกว่า reverse ใช้เรียงกระแสและป้องกันกลับขั้ว","example":"LED เป็นไดโอดที่ปล่อยแสง","mis":"ไดโอดไม่ใช่สวิตช์สมบูรณ์แบบทุกเงื่อนไข","formula":"","code":"G3U6L2S5"},{"title":"LED","body":"LED ต้องต่อขั้วถูกและจำกัดกระแส สีต่างชนิดมีแรงดันตกคร่อมต่างกัน","example":"ต่อ LED กับตัวต้านทานอนุกรม","mis":"ต่อแบตเตอรี่ตรงโดยไม่มีการจำกัดกระแสอาจเสีย","formula":"","code":"G3U6L2S6"},{"title":"ตัวเก็บประจุ","body":"เก็บประจุและพลังงานในสนามไฟฟ้าระหว่างแผ่น ใช้กรอง หน่วงเวลา หรือเก็บพลังงานช่วงสั้น","example":"แฟลชกล้องใช้ตัวเก็บประจุ","mis":"ตัวเก็บประจุไม่เหมือนแบตเตอรี่","formula":"","code":"G3U6L2S7"},{"title":"ทรานซิสเตอร์","body":"อุปกรณ์สารกึ่งตัวนำใช้ควบคุมกระแส/แรงดัน เป็นสวิตช์หรือขยายสัญญาณ ทำให้วงจรดิจิทัลและอิเล็กทรอนิกส์สมัยใหม่เป็นไปได้","example":"สัญญาณเล็กควบคุมโหลดใหญ่ผ่านทรานซิสเตอร์","mis":"ไม่ควรเข้าใจเป็นสวิตช์กลธรรมดา","formula":"","code":"G3U6L2S8"},{"title":"วงจรประยุกต์","body":"การออกแบบวงจรต้องเชื่อมแหล่งจ่าย อุปกรณ์ควบคุม ตัวป้องกัน และโหลด พร้อมคำนวณค่าที่ไม่เกินพิกัด","example":"วงจร LED มีแหล่งจ่าย สวิตช์ R และ LED","mis":"ค่าพิกัดของอุปกรณ์สำคัญต่อความปลอดภัย","formula":"","code":"G3U6L2S9"}],"G3U7L1":[{"title":"องค์ประกอบชีวภาพและกายภาพ","body":"ระบบนิเวศมีสิ่งมีชีวิต เช่น ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย และปัจจัยกายภาพ เช่น แสง น้ำ อุณหภูมิ ดิน ทั้งสองส่วนมีปฏิสัมพันธ์กัน","example":"ปริมาณแสงมีผลต่อพืชน้ำและต่อผู้บริโภคต่อเนื่อง","mis":"อย่ามองสิ่งมีชีวิตแยกจากสิ่งแวดล้อม","formula":"","code":"G3U7L1S1"},{"title":"ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย","body":"ผู้ผลิตสร้างสารอินทรีย์จากพลังงานภายนอก ผู้บริโภครับพลังงานจากอาหาร ผู้ย่อยสลายย่อยซากคืนสารอาหารสู่ระบบ","example":"เห็ดราเป็นผู้ย่อยสลายหลายชนิด","mis":"ผู้ย่อยสลายไม่ได้ทำให้พลังงานหมุนเวียนกลับทั้งหมด","formula":"","code":"G3U7L1S2"},{"title":"โซ่อาหาร","body":"โซ่อาหารแสดงเส้นทางการถ่ายทอดพลังงานแบบเส้นเดียว ลูกศรชี้จากสิ่งที่ถูกกินไปยังผู้กิน","example":"หญ้า → ตั๊กแตน → กบ → งู","mis":"ลูกศรไม่ได้ชี้ว่าใครล่าใครจากผู้ล่าไปเหยื่อ","formula":"","code":"G3U7L1S3"},{"title":"สายใยอาหาร","body":"ในธรรมชาติสิ่งมีชีวิตกินอาหารหลายชนิด โซ่หลายเส้นเชื่อมเป็นสายใย การเปลี่ยนประชากรหนึ่งชนิดจึงกระทบหลายเส้นทาง","example":"กบลดอาจทำให้แมลงเพิ่มและผู้ล่ากบลด","mis":"อย่าทำนายผลจากเส้นทางเดียว","formula":"","code":"G3U7L1S4"},{"title":"การถ่ายทอดพลังงาน","body":"พลังงานลดลงในแต่ละลำดับการกินเพราะสิ่งมีชีวิตใช้หายใจ เคลื่อนไหว และสูญเป็นความร้อน จึงมีชีวมวล/จำนวนรองรับผู้บริโภคระดับสูงน้อยลง","example":"ผู้ผลิตต้องมีพลังงานมากเพื่อรองรับผู้บริโภค","mis":"พลังงานไม่หมุนเวียนเหมือนสาร","formula":"","code":"G3U7L1S5"},{"title":"การหมุนเวียนสาร","body":"ธาตุอาหารและสสารหมุนเวียนผ่านสิ่งมีชีวิตและสิ่งแวดล้อม ผู้ย่อยสลายมีบทบาทคืนสารอนินทรีย์","example":"คาร์บอนจากซากกลับสู่ระบบ","mis":"อย่าสับสนการหมุนเวียนสารกับการไหลพลังงาน","formula":"","code":"G3U7L1S6"},{"title":"การสะสมสารพิษ","body":"สารสลายยากบางชนิดสะสมในร่างกายและมีความเข้มข้นสูงขึ้นตามลำดับการกินเมื่อผู้ล่ากินเหยื่อจำนวนมาก","example":"ปรอทในห่วงโซ่อาหารน้ำ","mis":"สารทุกชนิดไม่ได้เกิด biomagnification","formula":"","code":"G3U7L1S7"},{"title":"ผู้ล่า–เหยื่อและการแข่งขัน","body":"ผู้ล่ากินเหยื่อ ส่วนการแข่งขันเกิดเมื่อทรัพยากรจำกัดและสิ่งมีชีวิตใช้ทรัพยากรเดียวกัน","example":"ต้นไม้แข่งขันแสงและน้ำ","mis":"การแข่งขันไม่ได้แปลว่าต้องต่อสู้โดยตรง","formula":"","code":"G3U7L1S8"},{"title":"พึ่งพา อิงอาศัย ปรสิต","body":"ภาวะพึ่งพาได้ประโยชน์ทั้งคู่ อิงอาศัยฝ่ายหนึ่งได้ประโยชน์อีกฝ่ายไม่ค่อยได้รับผล ปรสิตฝ่ายหนึ่งได้ประโยชน์อีกฝ่ายเสียประโยชน์","example":"เห็บกับสุนัขเป็นปรสิต","mis":"ต้องดูผลต่อทั้งสองฝ่าย","formula":"","code":"G3U7L1S9"}],"G3U7L2":[{"title":"ความหลากหลายทางพันธุกรรม","body":"ความแตกต่างของยีน/แอลลีลภายในชนิดทำให้บุคคลมีลักษณะแตกต่างและเพิ่มโอกาสที่ประชากรบางส่วนจะทนการเปลี่ยนแปลง","example":"พันธุ์ข้าวหลายพันธุ์ในชนิดเดียวกัน","mis":"จำนวนพันธุ์ชื่อการค้าอย่างเดียวไม่ได้บอกความหลากหลายทั้งหมด","formula":"","code":"G3U7L2S1"},{"title":"ความหลากหลายของชนิดพันธุ์","body":"พิจารณาทั้งจำนวนชนิดและความสม่ำเสมอของจำนวนแต่ละชนิด พื้นที่ที่มี 10 ชนิดแต่ชนิดหนึ่งครองเกือบทั้งหมดอาจต่างจากพื้นที่ที่กระจายสมดุล","example":"สำรวจจำนวนชนิดในแปลงตัวอย่าง","mis":"จำนวนตัวทั้งหมดไม่เท่าความหลากหลายชนิด","formula":"","code":"G3U7L2S2"},{"title":"ความหลากหลายของระบบนิเวศ","body":"หมายถึงความหลากหลายของถิ่นอาศัยและระบบนิเวศ เช่น ป่าดิบ ทุ่งหญ้า ชายเลน แนวปะการัง แต่ละระบบมีเงื่อนไขและชุมชนต่างกัน","example":"จังหวัดหนึ่งมีทั้งป่าและพื้นที่ชุ่มน้ำ","mis":"ไม่ใช่การนับชนิดอย่างเดียว","formula":"","code":"G3U7L2S3"},{"title":"ความสำคัญ","body":"ความหลากหลายช่วยการทำงานของระบบนิเวศ แหล่งอาหาร ยา พันธุกรรม การผสมเกสร การควบคุมศัตรู และความยืดหยุ่นต่อการรบกวน","example":"ความหลากหลายแมลงผสมเกสรช่วยพืชหลายชนิด","mis":"ระบบที่หลากหลายไม่ได้คงที่ไม่เปลี่ยนเลย","formula":"","code":"G3U7L2S4"},{"title":"สาเหตุการสูญเสีย","body":"การทำลายถิ่นอาศัย ใช้ทรัพยากรเกิน ชนิดต่างถิ่นรุกราน มลพิษ และการเปลี่ยนแปลงภูมิอากาศเป็นแรงกดดันสำคัญ","example":"ถนนแบ่งป่าเป็นหย่อมเล็ก ๆ","mis":"ปัจจัยหลายอย่างอาจเสริมกัน","formula":"","code":"G3U7L2S5"},{"title":"การอนุรักษ์ในถิ่นและนอกถิ่น","body":"อนุรักษ์ในถิ่นรักษาชนิดพร้อมระบบนิเวศ เช่น เขตคุ้มครอง ส่วนนอกถิ่น เช่น สวนพฤกษศาสตร์ ธนาคารเมล็ด ใช้เสริมเมื่อจำเป็น","example":"ธนาคารเมล็ดเก็บความหลากหลายพันธุกรรม","mis":"การเลี้ยงในสวนสัตว์อย่างเดียวไม่รักษาระบบนิเวศ","formula":"","code":"G3U7L2S6"},{"title":"ใช้ทรัพยากรอย่างยั่งยืน","body":"กำหนดอัตราใช้ไม่เกินการฟื้นตัว ลดของเสีย และให้ชุมชนมีส่วนร่วม ใช้ข้อมูลติดตามผลปรับการจัดการ","example":"กำหนดฤดูปิดจับสัตว์น้ำ","mis":"คำว่าอนุรักษ์ไม่ได้หมายถึงห้ามใช้ทุกอย่าง","formula":"","code":"G3U7L2S7"},{"title":"ตัดสินใจจากหลักฐาน","body":"เปรียบเทียบผลทางนิเวศ เศรษฐกิจ และสังคมของทางเลือก พร้อมระบุความไม่แน่นอนและติดตามผลหลังดำเนินการ","example":"โครงการท่องเที่ยวเชิงนิเวศต้องวัดผลต่อชนิดพันธุ์และรายได้ชุมชน","mis":"อย่าตัดสินด้วยความชอบชนิดสัตว์เพียงอย่างเดียว","formula":"","code":"G3U7L2S8"}]},"activities":{"G1U1L1":"สถานการณ์: ต้นถั่วสองกลุ่มโตต่างกัน ให้ออกแบบการตรวจสอบโดยระบุคำถาม สมมติฐาน ตัวแปร วิธีวัด การทำซ้ำ และวิธีสรุปจากหลักฐาน","G1U2L1":"ใช้ตารางอุณหภูมิระหว่างให้ความร้อนและข้อมูลมวล–ปริมาตรเพื่อจำแนกตัวอย่างสาร โดยต้องแสดงเหตุผลจากข้อมูล","G1U2L2":"สร้างแบบจำลองอะตอมและการรวมตัวเป็นธาตุ/สารประกอบ แล้วเลือกวัสดุจากสมบัติของโลหะ อโลหะ และกึ่งโลหะ","G1U3L1":"กล้องจุลทรรศน์เสมือน: เลือกกำลังขยาย ระบุโครงสร้างเซลล์พืช/สัตว์ และเชื่อมโครงสร้างกับหน้าที่","G1U3L2":"จำลองเซลล์ในสารละลายต่างความเข้มข้น แล้วทำนายทิศการเคลื่อนของน้ำและอนุภาค","G1U4L1":"เรียงเส้นทางถ่ายเรณู → ปฏิสนธิ → เมล็ด/ผล → งอก และเลือกวิธีขยายพันธุ์ให้เหมาะกับเป้าหมาย","G1U4L2":"ออกแบบการทดลองปัจจัยต่อการสังเคราะห์ด้วยแสงโดยเปลี่ยนเพียงปัจจัยเดียว มีชุดควบคุม ทำซ้ำ และเลือกตัวชี้วัด","G1U4L3":"ติดตามลูกศรน้ำจากดิน→ราก→ไซเล็ม→ใบ และน้ำตาลจากใบ→โฟลเอ็ม→แหล่งใช้/สะสม","G1U5L1":"ปรับอุณหภูมิในแบบจำลองอนุภาค แล้วอธิบายการเปลี่ยนการเคลื่อนที่ ระยะห่าง การขยายตัว และสถานะ","G1U5L2":"เลือกวัสดุและกลไกถ่ายโอนความร้อนสำหรับกระติก บ้าน และภาชนะ พร้อมอธิบายการนำ–พา–แผ่รังสี","G1U6L1":"อ่านข้อมูลสถานีอากาศ 3 เวลาแล้วพยากรณ์แนวโน้มโดยใช้มากกว่าหนึ่งตัวแปร","G1U6L2":"ประเมินสถานการณ์พายุและข้อมูลอุณหภูมิระยะยาว แยกการเตือนภัยระยะสั้นออกจากแนวโน้มภูมิอากาศ","G2U1L1":"เปรียบเทียบข้ออ้าง 3 แบบ แล้วจัดอันดับความน่าเชื่อถือจากคุณภาพหลักฐาน วิธีเก็บข้อมูล และข้อจำกัด","G2U2L1":"อ่านกราฟสภาพละลายได้ เปลี่ยนอุณหภูมิ/ความดัน และทำนายว่าจะละลายเพิ่ม ตกผลึก หรือเกิดฟอง","G2U2L2":"เตรียมสารละลายตามโจทย์ %w/w, %v/v และ %m/v พร้อมตรวจฐานและหน่วย","G2U3L1":"วัดชีพจรพัก 3 ครั้ง ทำกิจกรรมมาตรฐาน แล้ววัดหลังทำ 3 ครั้ง หาค่าเฉลี่ยและสรุปโดยควบคุมตัวแปร","G2U3L2":"ใช้แบบจำลองกะบังลมและข้อมูลอัตราหายใจก่อน–หลังออกกำลังกายเพื่ออธิบายกลไกและแลกเปลี่ยนแก๊ส","G2U3L3":"ติดตามสารจากเลือดผ่านหน่วยไต แยกสิ่งที่กรอง ดูดกลับ และขับออก แล้วเชื่อมกับสมดุลน้ำ","G2U3L4":"ทดลองเวลาตอบสนองด้ว function pack(){return PACKS[L.id]}

function ev(p,code,ok){if(!p.evidence[code])p.evidence[code]={c:0,t:0};p.evidence[code].t++;if(ok)p.evidence[code].c++}
function cDone(p){return pack().every(s=>p.read[s.code])}

function unlocked(s,p){if(USER?.teacher)return true;let i=stages.indexOf(s);if(i===0)return true;return done(stages[i-1],p)}
function bars(active){let p=gp();return`<div class="steps">${stages.map(s=>`<div class="step ${done(s,p)?"done":""} ${s===active?"cur":""} ${!unlocked(s,p)?"lock":""}">${names[s]}</div>`).join("")}</div>`}

 $$(".toc button").forEach(b=>b.onclick=()=>{PAGE=+b.dataset.i;renderContent()});$("#prev").onclick=()=>{PAGE--;renderContent()};$("#next").onclick=()=>{if(PAGE===secs.length-1){renderLesson();show("lesson")}else{PAGE++;renderContent()}};

function gradeSet(qs,pre,flag,fb){let p=gp(),score=0;qs.forEach((q,i)=>{let x=$("."+pre+"choice.sel[data-q='"+i+"']"),ok=x&&x.dataset.v===q.correct;if(ok)score++;if(x)x.classList.add(ok?"good":"bad");ev(p,q.code,!!ok);let why=$("[data-why='"+i+"']");why.classList.remove("hidden");why.className="feedback";why.innerHTML=ok?"✅ ถูกต้อง":"❌ คำตอบที่ถูก: <b>"+esc(q.correct)+"</b>"});if(score===qs.length)p[flag]=true;sp(p);$("#"+fb).innerHTML=`<div class="feedback">${score===qs.length?"✅ ผ่าน 100%":"ได้ "+score+"/"+qs.length+" ต้องแก้จนถูกครบ"}</div>`}
function makeQs(mode,n=6){let secs=pack(),arr=[];for(let i=0;i<n;i++){let s=secs[i%secs.length];if(mode==="basic")arr.push({code:s.code,q:`ข้อใดอธิบาย “${s.title}” ได้ถูกต้อง?`,correct:s.body,opts:distract(s)});if(mode==="apply")arr.push({code:s.code,q:`สถานการณ์ “${s.example||s.title}” ควรใช้แนวคิดใดมากที่สุด?`,correct:s.title,opts:titleOpts(s)});if(mode==="analysis")arr.push({code:s.code,q:`เมื่อตรวจข้อสรุปเกี่ยวกับ “${s.title}” ข้อใดปลอดภัยที่สุดตามเนื้อหา?`,correct:s.body,opts:distract(s)})}return arr}

function renderSeq(){let seq=SEQ[L.id],cyclic=L.id==="G2U3L1";PICK=[];$("#game").innerHTML=`<div class="crumb">ม.${G} › ${esc(L.title)} › เกม 2</div>${bars("g2")}<div class="hero"><span class="tag">🎮 เกม 2</span><h2>${cyclic?"เรียงวงจรแบบไม่มีจุดเริ่ม":"เรียงลำดับ/ความสัมพันธ์"}</h2><p class="mut">${cyclic?"เริ่มตรงไหนก็ได้ ระบบตรวจคู่ความสัมพันธ์ทุกลูกศรรวมคู่สุดท้ายกลับจุดแรก":"คลิกองค์ประกอบตามลำดับที่ถูกต้อง"}</p></div><div class="panel"><div class="sequence">${sh(seq).map(x=>`<button class="node sn" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="box"><div class="picked" id="picked">ยังไม่ได้เลือก</div></div><button class="btn out" id="sr">เริ่มใหม่</button> <button class="btn primary" id="sc">ตรวจ</button><div id="sfb"></div></div>`;$$(".sn").forEach(b=>b.onclick=()=>{PICK.push(b.dataset.v);b.disabled=true;$("#picked").textContent=PICK.join(" → ")});$("#sr").onclick=renderSeq;$("#sc").onclick=()=>{if(PICK.length!==seq.length){$("#sfb").innerHTML='<div class="feedback">เลือกให้ครบก่อน</div>';return}let score=0;if(cyclic){for(let i=0;i<PICK.length;i++){let ai=seq.indexOf(PICK[i]);if(PICK[(i+1)%PICK.length]===seq[(ai+1)%seq.length])score++}}else score=PICK.filter((x,i)=>x===seq[i]).length;let pass=score===seq.length,p=gp();if(pass){p.g2=true;pack().forEach(s=>ev(p,s.code,true));sp(p)}$("#sfb").innerHTML=`<div class="feedback">${pass?"✅ ผ่าน 100%":"ถูก "+score+"/"+seq.length+" ความสัมพันธ์ ลองใหม่"}</div>`}}
function renderGame(n){if(n===2&&SEQ[L.id])return renderSeq();let qs=n===1?makeQs("basic",6):n===2?makeQs("apply",6):makeQs("analysis",6);$("#game").innerHTML=`<div class="crumb">ม.${G} › ${esc(L.title)} › เกม ${n}</div>${bars("g"+n)}<div class="hero"><span class="tag">🎮 เกม ${n}</span><h2>${n===1?"จับคู่แนวคิด":n===2?"สถานการณ์ประยุกต์":"ล่าความเข้าใจผิด"}</h2><p class="mut">ต้องถูกครบ 100%</p></div><div class="panel">${qs.map((q,i)=>qhtml(q,i,"g")).join("")}<button class="btn primary" id="gg">ตรวจเกม</button><div id="gfb"></div></div>`;bind("g");$("#gg").onclick=()=>gradeSet(qs,"g","g"+n,"gfb")}

function pools(){let secs=pack(),P={u:[],a:[],n:[],c:[]};secs.forEach(s=>{P.u.push({code:s.code,level:"จำ/เข้าใจ",q:`ข้อใดอธิบาย “${s.title}” ได้ถูกต้องที่สุด?`,correct:s.body,opts:distract(s),why:s.body});P.a.push({code:s.code,level:"ประยุกต์",q:`จากสถานการณ์ “${s.example||s.title}” แนวคิดใดเกี่ยวข้องโดยตรงที่สุด?`,correct:s.title,opts:titleOpts(s),why:`สถานการณ์นี้เชื่อมกับ ${s.title}: ${s.body}`});P.n.push({code:s.code,level:"วิเคราะห์",q:`ถ้าต้องวิเคราะห์ข้อมูลเกี่ยวกับ “${s.title}” ข้อใดเป็นหลักที่สอดคล้องกับเนื้อหา?`,correct:s.body,opts:distract(s),why:s.body});P.c.push({code:s.code,level:"คิดซับซ้อน",q:`ผู้เรียนเสนอคำอธิบายเรื่อง “${s.title}” ข้อใดไม่เกินหลักฐานและตรงกลไกที่สุด?`,correct:s.body,opts:distract(s),why:s.body})});for(let k in P){let base=[...P[k]],i=0;while(P[k].length<10){let q=base[i%base.length];P[k].push({...q,q:"อีกสถานการณ์: "+q.q});i++}}return P}
function startTest(){let P=pools();TQ=sh([...sh(P.u).slice(0,5),...sh(P.a).slice(0,6),...sh(P.n).slice(0,5),...sh(P.c).slice(0,4)]).map(q=>({...q,opts:sh(q.opts)}));TI=0;TA={};renderTest()}
function renderTest(){let q=TQ[TI];$("#test").innerHTML=`<div class="crumb">ม.${G} › ${esc(L.title)} › ข้อสอบ</div>${bars("test")}<div class="hero"><span class="tag">ข้อ ${TI+1}/20 • ${q.level}</span><h2>ข้อสอบท้ายบท</h2><p class="mut">5 จำ/เข้าใจ • 6 ประยุกต์ • 5 วิเคราะห์ • 4 คิดซับซ้อน • ผ่าน 12/20 • ไม่เฉลยระหว่างทำ</p></div><div class="panel"><div class="testnav">${TQ.map((_,i)=>`<button data-i="${i}" class="${TA[i]!=null?"ans":""} ${i===TI?"cur":""}">${i+1}</button>`).join("")}</div><div class="q"><span class="pill">${q.code}</span><h3>${esc(q.q)}</h3><div class="choices">${q.opts.map(o=>`<button class="choice tc ${TA[TI]===o?"sel":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div><div style="display:flex;justify-content:space-between"><button class="btn out" id="tp" ${TI===0?"disabled":""}>← ก่อน</button>${TI===19?'<button class="btn primary" id="submit">ส่งคำตอบ</button>':'<button class="btn primary" id="tn">ถัดไป →</button>'}</div></div>`;$$(".testnav button").forEach(b=>b.onclick=()=>{TI=+b.dataset.i;renderTest()});$$(".tc").forEach(b=>b.onclick=()=>{TA[TI]=b.dataset.v;renderTest()});$("#tp").onclick=()=>{TI--;renderTest()};$("#tn")?.addEventListener("click",()=>{TI++;renderTest()});$("#submit")?.addEventListener("click",submit)}
function submit(){if(Object.keys(TA).length<20){alert("ตอบให้ครบ 20 ข้อก่อนครับ");return}let p=gp(),score=0,rv=[];TQ.forEach((q,i)=>{let ok=TA[i]===q.correct;if(ok)score++;ev(p,q.code,ok);if(!ok)rv.push({n:i+1,code:q.code,q:q.q,y:TA[i],a:q.correct,why:q.why})});p.score=score;p.test=score>=12;p.review=rv;p.attempts=(p.attempts||0)+1;sp(p);renderResult();show("result")}

function renderResult(){let p=gp(),ms=pack().map(s=>{let e=p.evidence[s.code]||{c:0,t:0},pct=e.t?Math.round(e.c/e.t*100):0;return{s,pct,label:pct>=90?"เชี่ยวชาญ":pct>=75?"ชำนาญ":pct>=60?"พื้นฐานดี":"กำลังพัฒนา"}}),strong=[...ms].sort((a,b)=>b.pct-a.pct)[0],weak=[...ms].sort((a,b)=>a.pct-b.pct)[0];$("#result").innerHTML=`<div class="crumb">ม.${G} › ${esc(L.title)} › ผล</div>${bars("result")}<div class="hero"><span class="tag">${p.test?"✅ ผ่าน":"🔁 ยังไม่ผ่าน"}</span><h1>${p.score??0}/20 (${(p.score??0)*5}%)</h1><p class="mut">${p.test?"ผ่านเกณฑ์แล้ว แต่ยังดูหัวข้อที่ควรพัฒนาได้":"กลับไปทบทวนหัวข้ออ่อนแล้วทำชุดสุ่มใหม่"}</p></div><div class="resultgrid"><div class="metric"><b>${p.score??0}/20</b>คะแนน</div><div class="metric"><b>${strong?.pct??0}%</b>เด่น: ${esc(strong?.s.title||"-")}</div><div class="metric"><b>${weak?.pct??0}%</b>พัฒนา: ${esc(weak?.s.title||"-")}</div></div><div class="panel" style="margin-top:13px"><h2>🏆 Mastery รายหัวข้อ</h2><div class="mastery">${ms.map(m=>`<div class="master"><div><b>${esc(m.s.title)}</b><br><small>${m.label}</small></div><div class="track"><span style="width:${m.pct}%"></span></div><b>${m.pct}%</b><button class="btn out rev" data-code="${m.s.code}">ทบทวน</button></div>`).join("")}</div></div>${(p.review||[]).length?`<div class="panel" style="margin-top:13px"><h2>🔎 วิเคราะห์ข้อผิด</h2>${p.review.map(r=>`<div class="q"><span class="pill">${r.code}</span><h4>ข้อ ${r.n}: ${esc(r.q)}</h4><p><b>ตอบ:</b> ${esc(r.y)}</p><p><b>คำตอบที่ถูก:</b> ${esc(r.a)}</p><div class="feedback"><b>เหตุผล:</b> ${esc(r.why)}</div><button class="btn out rev" data-code="${r.code}">กลับไปหัวข้อนี้</button></div>`).join("")}</div>`:""}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px"><button class="btn out" id="review">ทบทวนตั้งแต่ตอนแรก</button><button class="btn primary" id="retry">ข้อสอบชุดใหม่</button><button class="btn soft" id="bl">กลับหน้าบท</button></div>`;$$(".rev").forEach(b=>b.onclick=()=>{PAGE=idx(b.dataset.code);renderContent();sh
