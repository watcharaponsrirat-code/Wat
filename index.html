<style>
:root{--g:#176747;--g2:#2b8a62;--ink:#18352b;--mut:#61756e;--bg:#f4f8f5;--line:#d8e6df;--pale:#ebf8f1;--gold:#d6aa25;--red:#b84242;--blue:#eef6ff;--shadow:0 14px 34px rgba(24,76,56,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Noto Sans Thai",sans-serif}button,input{font:inherit}.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.top{max-width:1220px;margin:auto;padding:10px 16px;display:flex;gap:8px;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-weight:1000}.brand img{width:36px;height:36px;object-fit:contain}.spacer{flex:1}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--g);color:#fff}.btn.soft{background:var(--pale);color:var(--g)}.btn.out{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.gold{background:#fff7d6;border:1px solid #e5d078;color:#715700}.btn:disabled{opacity:.42;cursor:not-allowed}
main{max-width:1220px;margin:auto;padding:24px 16px 70px}.screen{display:none}.screen.active{display:block}.hero,.panel,.card,.reader{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero{padding:23px;margin-bottom:15px;background:linear-gradient(135deg,#fff,#effaf3)}.hero h1,.hero h2{margin:5px 0}.mut{color:var(--mut);line-height:1.7}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff7d6;border:1px solid #e6d078;color:#705600;font-size:12px;font-weight:900}
.grid{display:grid;gap:13px}.grades{grid-template-columns:repeat(3,1fr)}.units{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.click{cursor:pointer}.click:hover{border-color:#97c4a9}.unithead{display:flex;gap:11px}.num{width:43px;height:43px;border-radius:13px;background:var(--pale);color:var(--g);font-weight:1000;display:grid;place-items:center;flex:0 0 auto}.lessons{display:grid;gap:8px;margin-top:12px}.lessonrow{display:flex;gap:9px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fbfefc}.grow{flex:1}.lessonrow small{color:var(--mut)}
.crumb{font-size:12px;color:var(--mut);margin-bottom:9px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0 15px}.step{padding:8px 5px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:center;font-size:12px;font-weight:900}.step.done{background:#e7f7ee;border-color:#a6d1b7;color:var(--g)}.step.cur{outline:2px solid var(--gold)}.step.lock{opacity:.4}
.progress{height:9px;background:#e4ece8;border-radius:999px;overflow:hidden}.progress span{height:100%;display:block;background:var(--g)}.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:5px}
.stagegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.stage{padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.stage.locked{opacity:.45}.stage h3{margin:0 0 5px}
.contentgrid{display:grid;grid-template-columns:265px 1fr;gap:14px}.toc{position:sticky;top:72px;align-self:start;max-height:78vh;overflow:auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:17px}.toc button{width:100%;text-align:left;border:0;background:#f7faf8;border-radius:9px;padding:8px 9px;margin:3px 0;cursor:pointer}.toc button.active{background:var(--pale);color:var(--g);font-weight:900}.toc button.ok:after{content:" ✓";color:var(--g)}
.reader{padding:21px}.reader h2{margin:5px 0 10px}.box{padding:14px;border:1px solid var(--line);border-radius:15px;margin:10px 0;background:#fbfefc}.box.core{background:linear-gradient(135deg,#eefaf3,#fffdf0)}.box.blue{background:var(--blue)}.box.warn{background:#fff8df;border-color:#e6d48b}.box h3{margin:0 0 6px}.box p{margin:0;color:#3f5a50;line-height:1.8}.formula{font-size:20px;font-weight:900}.micro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.micro>div{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.micro b{display:block;margin-bottom:4px}
.panel{padding:19px}.q{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;margin:10px 0}.q h4{margin:0 0 8px;line-height:1.55}.pill{display:inline-flex;padding:4px 7px;background:#f0f5f2;border-radius:999px;color:var(--mut);font-size:11px;font-weight:900}.choices{display:grid;gap:7px;margin:9px 0}.choice{padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer}.choice.sel{background:#edf8f1;border-color:#80b996}.choice.good{background:#e6f7ed;border-color:#70b28c}.choice.bad{background:#fff0f0;border-color:#d98a8a}.feedback{padding:10px 12px;border-radius:12px;background:#f1f6f3;color:#405b51;line-height:1.65;margin:8px 0}
.sequence{display:flex;flex-wrap:wrap;gap:7px}.node{padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}.picked{min-height:50px;border:1px dashed #99c3a9;background:#f7fcf9;border-radius:13px;padding:11px;line-height:1.8}
.visual{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:18px;border:1px dashed #9fc6af;border-radius:16px;background:#f8fcfa;margin:10px 0}.vnode{padding:10px 12px;border-radius:13px;background:#fff;border:1px solid var(--line);font-weight:900}.arrow{font-size:20px;color:var(--g)}
.testnav{display:flex;flex-wrap:wrap;gap:5px}.testnav button{width:35px;height:35px;border:1px solid var(--line);border-radius:9px;background:#fff}.testnav .ans{background:var(--pale)}.testnav .cur{outline:2px solid var(--gold)}
.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:15px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center}.metric b{font-size:27px;display:block}.mastery{display:grid;gap:8px}.master{display:grid;grid-template-columns:1fr 180px 75px 110px;gap:9px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}.track{height:8px;background:#e3ece7;border-radius:999px;overflow:hidden}.track span{display:block;height:100%;background:var(--g)}
.login{max-width:470px;margin:45px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.login img{height:98px;display:block;margin:auto}.field{display:grid;gap:5px;margin:10px 0}.field input{padding:11px;border:1px solid var(--line);border-radius:11px}.notice{padding:11px;background:#fff8da;border:1px solid #e4d079;border-radius:13px;color:#6f5600;line-height:1.55}.teacher{padding:7px 9px;border-radius:10px;background:#fff3c8;color:#705500;font-size:12px;font-weight:900}
@media(max-width:860px){.grades,.units,.stagegrid,.resultgrid,.micro{grid-template-columns:1fr}.contentgrid{grid-template-columns:1fr}.toc{position:static;max-height:none}.steps{grid-template-columns:repeat(2,1fr)}.master{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style>

const DATA={"curriculum":{"1":[{"title":"เรียนรู้วิทยาศาสตร์อย่างไร","icon":"🔍","source":"ม.1 เล่ม 1 • หน่วยที่ 1","lessons":[{"id":"G1U1L1","title":"เรียนรู้วิทยาศาสตร์อย่างไร","concepts":[{"title":"วิทยาศาสตร์และวิธีการทางวิทยาศาสตร์","core":"ตั้งคำถามจากปรากฏการณ์ ใช้หลักฐาน สร้างคำอธิบาย และตรวจสอบคำอธิบาย","detail":"ตั้งคำถามจากปรากฏการณ์ ใช้หลักฐาน สร้างคำอธิบาย และตรวจสอบคำอธิบาย ให้แยกสิ่งที่สังเกตได้ออกจากการตีความ ระบุหลักฐานที่จำเป็น และตรวจว่าข้อสรุปไม่กว้างเกินข้อมูล","example":"ในภารกิจ “นักสืบหลักฐาน” ให้ใช้แนวคิด วิทยาศาสตร์และวิธีการทางวิทยาศาสตร์ อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าเลือกเฉพาะข้อมูลที่ตรงกับสมมติฐาน และอย่าสรุปจากข้อมูลครั้งเดียวโดยไม่ตรวจความน่าเชื่อถือ","formula":"","code":"G1U1L1C1","check":"ลองอธิบาย ‘วิทยาศาสตร์และวิธีการทางวิทยาศาสตร์’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ตั้งคำถามจากปรากฏการณ์ ใช้หลักฐาน สร้างคำอธิบาย และตรวจสอบคำอธิบาย"},{"title":"ทักษะกระบวนการทางวิทยาศาสตร์","core":"การสังเกต วัด จำแนก พยากรณ์ ลงความเห็น ตั้งสมมติฐาน กำหนดตัวแปร ทดลอง และสื่อสารข้อมูล","detail":"การสังเกต วัด จำแนก พยากรณ์ ลงความเห็น ตั้งสมมติฐาน กำหนดตัวแปร ทดลอง และสื่อสารข้อมูล ให้แยกสิ่งที่สังเกตได้ออกจากการตีความ ระบุหลักฐานที่จำเป็น และตรวจว่าข้อสรุปไม่กว้างเกินข้อมูล","example":"ในภารกิจ “นักสืบหลักฐาน” ให้ใช้แนวคิด ทักษะกระบวนการทางวิทยาศาสตร์ อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าเลือกเฉพาะข้อมูลที่ตรงกับสมมติฐาน และอย่าสรุปจากข้อมูลครั้งเดียวโดยไม่ตรวจความน่าเชื่อถือ","formula":"","code":"G1U1L1C2","check":"ลองอธิบาย ‘ทักษะกระบวนการทางวิทยาศาสตร์’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า การสังเกต วัด จำแนก พยากรณ์ ลงความเห็น ตั้งสมมติฐาน กำหนดตัวแปร ทดลอง และสื่อสารข้อมูล"}],"kind":"inquiry","mission":"นักสืบหลักฐาน","focus":"แยกข้อสังเกต การตีความ สมมติฐาน ตัวแปร และข้อสรุปจากหลักฐาน"}]},{"title":"สารบริสุทธิ์","icon":"⚛️","source":"ม.1 เล่ม 1 • หน่วยที่ 2","lessons":[{"id":"G1U2L1","title":"สมบัติของสารบริสุทธิ์","concepts":[{"title":"จุดเดือดของสารบริสุทธิ์และสารผสม","core":"เปรียบเทียบข้อมูลอุณหภูมิระหว่างการเดือดเพื่อจำแนกลักษณะของสาร","detail":"เปรียบเทียบข้อมูลอุณหภูมิระหว่างการเดือดเพื่อจำแนกลักษณะของสาร ให้เชื่อมข้อมูลเชิงปริมาณกับนิยามและสมบัติของสาร ตรวจหน่วยก่อนคำนวณ และใช้ข้อมูลสนับสนุนการจำแนก","example":"ในภารกิจ “ห้องแล็บสมบัติสาร” ให้ใช้แนวคิด จุดเดือดของสารบริสุทธิ์และสารผสม อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าใช้สูตรโดยไม่ตรวจนิยาม ตัวส่วน และหน่วย เพราะคำตอบตัวเลขถูกแต่ความหมายอาจผิดได้","formula":"","code":"G1U2L1C1","check":"ลองอธิบาย ‘จุดเดือดของสารบริสุทธิ์และสารผสม’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า เปรียบเทียบข้อมูลอุณหภูมิระหว่างการเดือดเพื่อจำแนกลักษณะของสาร"},{"title":"จุดหลอมเหลวของสารบริสุทธิ์และสารผสม","core":"อ่านช่วงอุณหภูมิการหลอมเหลวและเชื่อมโยงกับความบริสุทธิ์","detail":"อ่านช่วงอุณหภูมิการหลอมเหลวและเชื่อมโยงกับความบริสุทธิ์ ให้เชื่อมข้อมูลเชิงปริมาณกับนิยามและสมบัติของสาร ตรวจหน่วยก่อนคำนวณ และใช้ข้อมูลสนับสนุนการจำแนก","example":"ในภารกิจ “ห้องแล็บสมบัติสาร” ให้ใช้แนวคิด จุดหลอมเหลวของสารบริสุทธิ์และสารผสม อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าใช้สูตรโดยไม่ตรวจนิยาม ตัวส่วน และหน่วย เพราะคำตอบตัวเลขถูกแต่ความหมายอาจผิดได้","formula":"","code":"G1U2L1C2","check":"ลองอธิบาย ‘จุดหลอมเหลวของสารบริสุทธิ์และสารผสม’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า อ่านช่วงอุณหภูมิการหลอมเหลวและเชื่อมโยงกับความบริสุทธิ์"},{"title":"ความหนาแน่น","core":"มวล ปริมาตร และความหนาแน่น รวมถึงการใช้ข้อมูลเปรียบเทียบสาร","detail":"มวล ปริมาตร และความหนาแน่น รวมถึงการใช้ข้อมูลเปรียบเทียบสาร ให้เชื่อมข้อมูลเชิงปริมาณกับนิยามและสมบัติของสาร ตรวจหน่วยก่อนคำนวณ และใช้ข้อมูลสนับสนุนการจำแนก","example":"ก้อนอะลูมิเนียมใหญ่และเล็กมีมวลต่างกัน แต่ถ้าเป็นสารชนิดเดียวกันภายใต้เงื่อนไขเดียวกัน ความหนาแน่นควรใกล้เคียงกัน","mis":"อย่าใช้สูตรโดยไม่ตรวจนิยาม ตัวส่วน และหน่วย เพราะคำตอบตัวเลขถูกแต่ความหมายอาจผ ck":"ลองอธิบาย ‘ความเข้มข้นของสารละลาย’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ร้อยละโดยมวล ร้อยละโดยปริมาตร และร้อยละโดยมวลต่อปริมาตร"}],"kind":"chemdata","mission":"นักผสมสารละลาย","focus":"คำนวณร้อยละความเข้มข้นหลายรูปแบบและวางแผนเตรียม/เจือจางสารละลาย"}]},{"title":"ร่างกายมนุษย์","icon":"🫀","source":"ม.2 เล่ม 1 • หน่วยที่ 3","lessons":[{"id":"G2U3L1","title":"ระบบหมุนเวียนเลือด","concepts":[{"title":"ระบบหมุนเวียนเลือดทำอะไร","core":"ระบบหมุนเวียนเลือดประกอบด้วยหัวใจ หลอดเลือด และเลือด ทำหน้าที่ลำเลียงแก๊ส สารอาหาร ของเสีย ฮอร์โมน และสารต่าง ๆ ทั่วร่างกาย","detail":"หัวใจทำหน้าที่สร้างแรงดันให้เลือดเคลื่อนที่ หลอดเลือดเป็นทางลำเลียง และเลือดเป็นตัวกลางขนส่ง ทั้งสามส่วนต้องทำงานสัมพันธ์กันจึงรักษาสภาพแวดล้อมภายในร่างกายได้","example":"ขณะวิ่ง กล้ามเนื้อต้องใช้ออกซิเจนและสารอาหารมากขึ้น ระบบหมุนเวียนเลือดจึงต้องลำเลียงสารได้เร็วขึ้น","mis":"อย่ามองหัวใจ เลือด และหลอดเลือดเป็นเรื่องแยกกัน เพราะหน้าที่เกิดจากการทำงานเป็นระบบ","formula":"","code":"G2U3L1C1","check":"อธิบายด้วยภาษาของตนเองว่า ระบบหมุนเวียนเลือดประกอบด้วยหัวใจ หลอดเลือด และเลือด ทำหน้าที่ลำเลียงแก๊ส สารอาหาร ของเสีย ฮอร์โมน และสารต่าง ๆ ทั่วร่างกาย"},{"title":"เลือดและส่วนประกอบ","core":"เลือดประกอบด้วยพลาสมา เม็ดเลือดแดง เม็ดเลือดขาว และเกล็ดเลือด ซึ่งมีหน้าที่ต่างกัน","detail":"พลาสมาเป็นของเหลวที่ลำเลียงสารหลายชนิด เม็ดเลือดแดงช่วยลำเลียงออกซิเจน เม็ดเลือดขาวเกี่ยวข้องกับการป้องกันร่างกาย และเกล็ดเลือดช่วยการแข็งตัว/ห้ามเลือด","example":"เมื่อเกิดบาดแผล เกล็ดเลือดและกระบวนการแข็งตัวของเลือดช่วยลดการสูญเสียเลือด","mis":"ส่วนประกอบของเลือดไม่ได้มีหน้าที่เหมือนกัน","formula":"","code":"G2U3L1C2","check":"อธิบายด้วยภาษาของตนเองว่า เลือดประกอบด้วยพลาสมา เม็ดเลือดแดง เม็ดเลือดขาว และเกล็ดเลือด ซึ่งมีหน้าที่ต่างกัน"},{"title":"เม็ดเลือดแดงและฮีโมโกลบิน","core":"เม็ดเลือดแดงมีฮีโมโกลบินช่วยจับและลำเลียงออกซิเจน","detail":"เมื่อจำนวนเม็ดเลือดแดงหรือปริมาณฮีโมโกลบินต่ำ ความสามารถในการลำเลียงออกซิเจนอาจลดลง จึงอาจสัมพันธ์กับอาการอ่อนเพลียได้","example":"โจทย์ที่ให้ข้อมูลเม็ดเลือดแดงต่ำควรเชื่อมกับความสามารถในการลำเลียงออกซิเจน ไม่ใช่การแข็งตัวของเลือด","mis":"ฮีโมโกลบินไม่ใช่เม็ดเลือดขาวและไม่ได้มีหน้าที่หลักในการห้ามเลือด","formula":"","code":"G2U3L1C3","check":"อธิบายด้วยภาษาของตนเองว่า เม็ดเลือดแดงมีฮีโมโกลบินช่วยจับและลำเลียงออกซิเจน"},{"title":"เม็ดเลือดขาวและเกล็ดเลือด","core":"เม็ดเลือดขาวช่วยป้องกันและกำจัดเชื้อโรคหรือสิ่งแปลกปลอม ส่วนเกล็ดเลือดช่วยในการแข็งตัวและห้ามเลือด","detail":"จำนวนเม็ดเลือดขาวอาจเปลี่ยนเมื่อร่างกายตอบสนองต่อการติดเชื้อหรือภาวะอื่น ส่วนเกล็ดเลือดต่ำอาจทำให้เลือดหยุดไหลยากขึ้น","example":"ผู้ป่วยมีไข้และเม็ดเลือดขาวสูง ต้องตีความร่วมกับอาการและข้อมูลอื่น ไม่ควรฟันธงโรคจากค่าเดียว","mis":"เม็ดเลือดขาวสูงไม่ได้แปลว่าร่างกายแข็งแรงกว่าเสมอ","formula":"","code":"G2U3L1C4","check":"อธิบายด้วยภาษาของตนเองว่า เม็ดเลือดขาวช่วยป้องกันและกำจัดเชื้อโรคหรือสิ่งแปลกปลอม ส่วนเกล็ดเลือดช่วยในการแข็งตัวและห้ามเลือด"},{"title":"หลอดเลือดแดง","core":"หลอดเลือดแดงนำเลือดออกจากหัวใจและมีผนังหนา ยืดหยุ่น เหมาะกับการรับความดันสูง","detail":"คำว่า artery นิยามจากทิศทางการไหลออกจากหัวใจ ไม่ได้กำหนดจากปริมาณออกซิเจน","example":"หลอดเลือดแดงพัลโมนารีนำเลือดออกจากหัวใจไปปอด แม้เลือดมีออกซิเจนค่อนข้างต่ำ","mis":"หลอดเลือดแดงไม่ได้หมายถึงเลือดมีออกซิเจนสูงทุกเส้น","formula":"","code":"G2U3L1C5","check":"อธิบายด้วยภาษาของตนเองว่า หลอดเลือดแดงนำเลือดออกจากหัวใจและมีผนังหนา ยืดหยุ่น เหมาะกับการรับความดันสูง"},{"title":"หลอดเลือดดำ","core":"หลอดเลือดดำนำเลือดเข้าสู่หัวใจ ความดันต่ำกว่า และหลอดเลือดดำหลายบริเวณโดยเฉพาะแขนขามีลิ้นช่วยลดการไหลย้อน","detail":"ลิ้นหลอดเลือดดำช่วยให้เลือดกลับหัวใจโดยเฉพาะเมื่อเลือดต้องไหลทวนแรงโน้มถ่วงร่วมกับการบีบตัวของกล้ามเนื้อ","example":"เมื่อยืนนาน เลือดอาจคั่งบริเวณขาได้มากขึ้น หากการช่วยดันเลือดกลับหัวใจไม่ดี","mis":"ไม่ใช่หลอดเลือดดำทุกเส้นมีลิ้น และคำว่า vein ไม่ได้แปลว่าเลือดออกซิเจนต่ำเสมอ","formula":"","code":"G2U3L1C6","check":"อธิบายด้วยภาษาของตนเองว่า หลอดเลือดดำนำเลือดเข้าสู่หัวใจ ความดันต่ำกว่า และหลอดเลือดดำหลายบริเวณโดยเฉพาะแขนขามีลิ้นช่วยลดการไหลย้อน"},{"title":"หลอดเลือดฝอย","core":"หลอดเลือดฝอยมีผนังบางมาก เหมาะกับการแลกเ นซ้ายทางหลอดเลือดดำพัลโมนารี"},{"title":"วงจรหัวใจ–ร่างกาย","core":"หัวใจห้องล่างซ้ายส่งเลือดผ่านเอออร์ตาไปยังเนื้อเยื่อทั่วร่างกาย แล้วเลือดกลับหัวใจด้านขวาผ่านเวนาคาวา","detail":"เนื้อเยื่อรับออกซิเจนและสารอาหารจากเลือด และปล่อยคาร์บอนไดออกไซด์กับของเสียบางชนิดกลับเข้าสู่เลือด","example":"กล้ามเนื้อที่ทำงานหนักต้องการการลำเลียงออกซิเจนเพิ่มขึ้น","mis":"เลือดไม่ได้หยุดอยู่ที่อวัยวะ แต่ไหลต่อเนื่องเป็นวงจร","formula":"","code":"G2U3L1C11","check":"อธิบายด้วยภาษาของตนเองว่า หัวใจห้องล่างซ้ายส่งเลือดผ่านเอออร์ตาไปยังเนื้อเยื่อทั่วร่างกาย แล้วเลือดกลับหัวใจด้านขวาผ่านเวนาคาวา"},{"title":"เส้นทางการไหลเวียนเลือดเต็มวงจร","core":"ร่างกาย → เวนาคาวา → ห้องบนขวา → ห้องล่างขวา → หลอดเลือดแดงพัลโมนารี → ปอด → หลอดเลือดดำพัลโมนารี → ห้องบนซ้าย → ห้องล่างซ้าย → เอออร์ตา → ร่างกาย","detail":"เพราะเป็นวงจรจึงไม่มีจุดเริ่มตามธรรมชาติที่แท้จริง การเรียงลำดับควรตรวจความสัมพันธ์ระหว่างจุดที่อยู่ติดกัน","example":"เริ่มจากปอดก็ได้ หากเรียงต่อเป็น pulmonary vein → left atrium → left ventricle → aorta ... ถูกทิศครบวงจร","mis":"อย่ายึดว่าต้องเริ่มที่หัวใจห้องใดห้องหนึ่งเสมอ","formula":"","code":"G2U3L1C12","check":"อธิบายด้วยภาษาของตนเองว่า ร่างกาย → เวนาคาวา → ห้องบนขวา → ห้องล่างขวา → หลอดเลือดแดงพัลโมนารี → ปอด → หลอดเลือดดำพัลโมนารี → ห้องบนซ้าย → ห้องล่างซ้าย → เอออร์ตา → ร่างกาย"},{"title":"ชีพจรและการออกกำลังกาย","core":"ชีพจรสัมพันธ์กับจังหวะการเต้นของหัวใจ และมักเพิ่มหลังทำกิจกรรมเพื่อรองรับความต้องการลำเลียงสารของร่างกาย","detail":"ชีพจรแตกต่างระหว่างบุคคลและขึ้นกับกิจกรรม สุขภาพ อายุ อารมณ์ และปัจจัยอื่น การวัดควรใช้วิธีและช่วงเวลาให้สม่ำเสมอ","example":"เปรียบเทียบชีพจรขณะพักกับหลังวิ่งโดยใช้เวลาวิ่งเท่ากันและวัดด้วยวิธีเดียวกัน","mis":"ชีพจรหลังออกกำลังกายไม่จำเป็นต้องเท่ากันทุกคน","formula":"","code":"G2U3L1C13","check":"อธิบายด้วยภาษาของตนเองว่า ชีพจรสัมพันธ์กับจังหวะการเต้นของหัวใจ และมักเพิ่มหลังทำกิจกรรมเพื่อรองรับความต้องการลำเลียงสารของร่างกาย"},{"title":"การทดลองชีพจรและการดูแลระบบ","core":"การทดลองควรเปรียบเทียบชีพจรขณะพักกับหลังทำกิจกรรม โดยควบคุมวิธีวัดและเงื่อนไขสำคัญ ทำซ้ำและใช้ข้อมูลสรุป พร้อมดูแลระบบด้วยการออกกำลังกาย อาหาร พักผ่อน และอารมณ์ที่เหมาะสม","detail":"ถ้าต้องการศึกษาผลของระดับกิจกรรม ควรกำหนดตัวแปรต้นให้ชัด ตัวแปรตามคือชีพจร และควบคุมเวลา/วิธีวัด ไม่ควรเปลี่ยนหลายตัวแปรพร้อมกัน","example":"วัดชีพจรพัก 3 ครั้ง ทำกิจกรรมระยะเวลาคงที่ แล้ววัดหลังทำกิจกรรม 3 ครั้ง จากนั้นหาค่าเฉลี่ยและเปรียบเทียบ","mis":"ข้อมูลหลังออกกำลังกายอย่างเดียวไม่พอจะสรุปผลของกิจกรรม หากไม่มีค่าก่อนทำเพื่อเปรียบเทียบ","formula":"","code":"G2U3L1C14","check":"อธิบายด้วยภาษาของตนเองว่า การทดลองควรเปรียบเทียบชีพจรขณะพักกับหลังทำกิจกรรม โดยควบคุมวิธีวัดและเงื่อนไขสำคัญ ทำซ้ำและใช้ข้อมูลสรุป พร้อมดูแลระบบด้วยการออกกำลังกาย อาหาร พักผ่อน และอารมณ์ที่เหมาะสม"}],"kind":"circulation","mission":"ภารกิจระบบหมุนเวียนเลือด","focus":"ติดตามเลือด หลอดเลือด หัวใจ วงจรปอด–ร่างกาย ชีพจร และการทดลอง"},{"id":"G2U3L2","title":"ระบบหายใจ","concepts":[{"title":"ระบบหายใจ","core":"โครงสร้างระบบหายใจ การแลกเปลี่ยนแก๊ส กลไกหายใจเข้า–ออก และการดูแล","detail":"โครงสร้างระบบหายใจ การแลกเปลี่ยนแก๊ส กลไกหายใจเข้า–ออก และการดูแล ให้มองความสัมพันธ์ “โครงสร้าง → หน้าที่ → กระบวนการ → ผลต่อสิ่งมีชีวิต” และตรวจว่าทุกขั้นสอดคล้องกัน","example":"ในภารกิจ “ห้องจำลองการหายใจ” ให้ใช้แนวคิด ระบบหายใจ อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าจำชื่อส่วนประกอบโดยแยกจากหน้าที่ และอย่าเหมารวมว่ากระบวนการหนึ่งเกิดจากอวัยวะหรือปัจจัยเดียว","formula":"","code":"G2U3L2C1","check":"ลองอธิบาย ‘ระบบหายใจ’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า โครงสร้างระบบหายใจ การแลกเปลี่ยนแก๊ส กลไกหายใจเข้า–ออก และการดูแล"}],"kind":"bio","mission":"ห้องจำลองการหายใจ","focus":"ติดตามเส้นทางอากาศ การแลกเปลี่ยนแก๊ส และกลไกกะบังลม"},{"id":"G2U3L3","title":"ระบบขับถ่าย","concepts":[{"title":"ระบบขับถ่าย","core":"ไตและทางเดินปัสสาวะ การกำจัดของเสียและการรักษาสมดุลน้ำ","detail":"ไตและทางเดินปัสสาวะ การกำจัดของเสียและการรักษาสมดุลน้ำ ให้มองความสัมพันธ์ “โครงสร้าง → หน้าที่ → กระบวนการ → ผลต่อสิ่งมีชีวิต” และตรวจว่าทุกขั้นสอดคล้องกัน","example":"ในภารกิจ “เส้นทางสร้างปัสสาวะ” ให้ใช้แนวคิด ระบบขับถ่าย อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าจำชื่อส่วนประกอบโดยแยกจากหน้าที่ และอย่าเหมารวมว่ากระบวนการหนึ่งเกิดจากอวัยวะหรือปัจจัยเดียว","formula":"","code":"G2U3L3C1","check":"ลองอธิบาย ‘ระบบขับถ่าย’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ไตและทางเดินปัสสาวะ การกำจัดของเสียและการรักษาสมดุลน้ำ"}],"kind":"bio","mission":"เส้นทางสร้างปัสสาวะ","focus":"ติดตามการกรอง ดูดกลับ สมดุลน้ำ และเส้นทางปัสสาวะ"},{"id":"G2U3L4","title":"ระบบประสาท","concepts":[{"title":"ระบบประสาท","core":"สมอง ไขสันหลัง เส้นประสาท การรับสิ่งเร้า การตอบสนอง และรีเฟล็กซ์","detail":"สมอง ไขสันหลัง เส้นประสาท การรับสิ่งเร้า การตอบสนอง และรีเฟล็กซ์ ให้มองความสัมพันธ์ “โครงสร้าง → หน้าที่ → กระบวนการ → ผลต่อสิ่งมีชีวิต” และตรวจว่าทุกขั้นสอดคล้องกัน","example":"ในภารกิจ “ภารกิจรีเฟล็กซ์” ให้ใช้แนวคิด ระบบประสาท อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าจำชื่อส่วนประกอบโดยแยกจากหน้าที่ และอย่าเหมารวมว่ากระบวนการหนึ่งเกิดจากอวัยวะหรือปัจจัยเดียว","formula":"","code":"G2U3L4C1","check":"ลองอธิบาย ‘ระบบประสาท’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า สมอง ไขสันหลัง เส้นประสาท การรับสิ่งเร้า การตอบสนอง และรีเฟล็กซ์"}],"kind":"bio","mission":"ภารกิจรีเฟล็กซ์","focus":"ติดตามสิ่งเร้า → ตัวรับ → ระบบประสาทส่วนกลาง → อวัยวะตอบสนอง"},{"id":"G2U3L5","title":"ระบบสืบพันธุ์","concepts":[{"title":"ระบบสืบพันธุ์","core":"อวัยวะสืบพันธุ์ เซลล์สืบพันธุ์ ฮอร์โมน การปฏิสนธิ การพัฒนา และการคุมกำเนิด","detail":"อวัยวะสืบพันธุ์ เซลล์สืบพันธุ์ ฮอร์โมน การปฏิสนธิ การพัฒนา และการคุมกำเนิด ให้มองความสัมพันธ์ “โครงสร้าง → หน้าที่ → กระบวนการ → ผลต่อสิ่งมีชีวิต” และตรวจว่าทุกขั้นสอดคล้องกัน","example":"ในภารกิจ “แผนที่การสืบพันธุ์มนุษย์” ให้ใช้แนวคิด ระบบสืบพันธุ์ อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าจำชื่อส่วนประกอบโดยแยกจากหน้าที่ และอย่าเหมารวมว่ากระบวนการหนึ่งเกิดจากอวัยวะหรือปัจจัยเดียว","formula":"","code":"G2U3L5C1","check":"ลองอธิบาย ‘ระบบสืบพันธุ์’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า อวัยวะสืบพันธุ์ เซลล์สืบพันธุ์ ฮอร์โมน การปฏิสนธิ การพัฒนา และการคุมกำเนิด"}],"kind":"bio","mission":"แผนที่การสืบพันธุ์มนุษย์","focus":"เชื่อมโครงสร้าง ฮอร์โมน วงจรประจำเดือน ปฏิสนธิ พัฒนาการ และการคุมกำเนิด"}]},{"title":"การเคลื่อนที่และแรง","icon":"🏃","source":"ม.2 เล่ม 1 • หน่วยที่ 4","lessons":[{"id":"G2U4L1","title":"การเคลื่อนที่","concepts":[{"title":"ตำแหน่ง ระยะทาง และการกระจัด","core":"ใช้จุดอ้างอิง อธิบายเส้นทาง และเปรียบเทียบปริมาณสเกลาร์/มีทิศทาง","detail":"ใช้จุดอ้างอิง อธิบายเส้นทาง และเปรียบเทียบปริมาณสเกลาร์/มีทิศทาง ให้แยกปริมาณ เงื่อนไข ทิศทาง และหน่วยให้ชัด แล้วเชื่อมแบบจำลองหรือสมการกับสถานการณ์จริง","example":"เดินรอบสนามหนึ่งรอบกลับจุดเดิม ระยะทางมากกว่าศูนย์แต่การกระจัดเป็นศูนย์","mis":"ระยะทางกับการกระจัดไม่ใช่ปริมาณเดียวกัน การกระจัดขึ้นกับตำแหน่งต้นและปลายพร้อมทิศทาง","formula":"","code":"G2U4L1C1","check":"ลองอธิบาย ‘ตำแหน่ง ระยะทาง และการกระจัด’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ใช้จุดอ้างอิง อธิบายเส้นทาง และเปรียบเทียบปริมาณสเกลาร์/มีทิศทาง"},{"title":"อัตราเร็วและความเร็ว","core":"คำนวณและตีความจากข้อมูลการเคลื่อนที่","detail":"คำนวณและตีความจากข้อมูลการเคลื่อนที่ ให้แยกปริมาณ เงื่อนไข ทิศทาง และหน่วยให้ชัด แล้วเชื่อมแบบจำลองหรือสมการกับสถานการณ์จริง","example":"ในภารกิจ “สนามการเคลื่อนที่” ให้ใช้แนวคิด อัตราเร็วและความเร็ว อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าสับสนปริมาณที่ชื่อคล้ายกัน และอย่าใช้สูตรก่อนตรวจทิศทาง หน่วย และเงื่อนไขที่สูตรใช้ได้","formula":"อัตราเร็วเฉลี่ย = ระยะทางรวม / เวลารวม  •  ความเร็วเฉลี่ย = การกระจัด / เวลารวม","code":"G2U4L1C2","check":"ลองอธิบาย ‘อัตราเร็วและความเร็ว’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า คำนวณและตีความจากข้อมูลการเคลื่อนที่"}],"kind":"physics","mission":"สนามการเคลื่อนที่","focus":"แยกตำแหน่ง ระยะทาง การกระจัด อัตราเร็ว และความเร็วจากสถานการณ์"},{"id":"G2U4L2","title":"แรง","concepts":[{"title":" re":"ระบบปิดและแนวคิดการอนุรักษ์มวล","detail":"ระบบปิดและแนวคิดการอนุรักษ์มวล ให้พิจารณาองค์ประกอบ สมบัติ เงื่อนไขของกระบวนการ และหลักฐานที่สังเกตหรือวัดได้ ไม่จำคำศัพท์แยกส่วน","example":"ในภารกิจ “แล็บปฏิกิริยาเคมี” ให้ใช้แนวคิด มวลของสารเมื่อเกิดปฏิกิริยา อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"มวลที่ชั่งลดลงในระบบเปิดอาจเกิดจากแก๊สหลุดออก ไม่ใช่สสารถูกทำลาย","formula":"","code":"G3U5L1C2","check":"ลองอธิบาย ‘มวลของสารเมื่อเกิดปฏิกิริยา’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ระบบปิดและแนวคิดการอนุรักษ์มวล"},{"title":"การถ่ายโอนความร้อน","core":"ปฏิกิริยาคายความร้อนและดูดความร้อน","detail":"ปฏิกิริยาคายความร้อนและดูดความร้อน ให้พิจารณาองค์ประกอบ สมบัติ เงื่อนไขของกระบวนการ และหลักฐานที่สังเกตหรือวัดได้ ไม่จำคำศัพท์แยกส่วน","example":"ในภารกิจ “แล็บปฏิกิริยาเคมี” ให้ใช้แนวคิด การถ่ายโอนความร้อน อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าสรุปชนิดสารหรือกระบวนการจากสัญญาณเพียงอย่างเดียว ต้องพิจารณาสมบัติและหลักฐานร่วมกัน","formula":"","code":"G3U5L1C3","check":"ลองอธิบาย ‘การถ่ายโอนความร้อน’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ปฏิกิริยาคายความร้อนและดูดความร้อน"},{"title":"กรดกับเบส","core":"การเกิดผลิตภัณฑ์และการเปลี่ยนแปลงที่สังเกตได้","detail":"การเกิดผลิตภัณฑ์และการเปลี่ยนแปลงที่สังเกตได้ ให้พิจารณาองค์ประกอบ สมบัติ เงื่อนไขของกระบวนการ และหลักฐานที่สังเกตหรือวัดได้ ไม่จำคำศัพท์แยกส่วน","example":"ในภารกิจ “แล็บปฏิกิริยาเคมี” ให้ใช้แนวคิด กรดกับเบส อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าสรุปชนิดสารหรือกระบวนการจากสัญญาณเพียงอย่างเดียว ต้องพิจารณาสมบัติและหลักฐานร่วมกัน","formula":"","code":"G3U5L1C4","check":"ลองอธิบาย ‘กรดกับเบส’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า การเกิดผลิตภัณฑ์และการเปลี่ยนแปลงที่สังเกตได้"},{"title":"กรด/เบสกับโลหะ","core":"สังเกตผลิตภัณฑ์และเชื่อมกับสมบัติสาร","detail":"สังเกตผลิตภัณฑ์และเชื่อมกับสมบัติสาร ให้พิจารณาองค์ประกอบ สมบัติ เงื่ G3U7L1C2","check":"ลองอธิบาย ‘การถ่ายทอดพลังงานในสายใยอาหาร’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย และทิศทางพลังงาน"},{"title":"การสะสมสารพิษในสิ่งมีชีวิต","core":"การเพิ่มความเข้มข้นของสารตามลำดับการกิน","detail":"การเพิ่มความเข้มข้นของสารตามลำดับการกิน ให้ติดตามทิศทางพลังงาน ปฏิสัมพันธ์ และผลกระทบเป็นเครือข่าย ไม่มองสิ่งมีชีวิตแยกจากระบบ","example":"ในภารกิจ “ห้องจำลองสายใยอาหาร” ให้ใช้แนวคิด การสะสมสารพิษในสิ่งมีชีวิต อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าวาดลูกศรโซ่อาหารกลับทิศ และอย่าสรุปผลกระทบของการเปลี่ยนชนิดหนึ่งโดยไม่ดูทั้งสายใย","formula":"","code":"G3U7L1C3","check":"ลองอธิบาย ‘การสะสมสารพิษในสิ่งมีชีวิต’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า การเพิ่มความเข้มข้นของสารตามลำดับการกิน"},{"title":"รูปแบบความสัมพันธ์ของสิ่งมีชีวิต","core":"ผู้ล่า–เหยื่อ การแข่งขัน ภาวะพึ่งพา อิงอาศัย และปรสิต","detail":"ผู้ล่า–เหยื่อ การแข่งขัน ภาวะพึ่งพา อิงอาศัย และปรสิต ให้ติดตามทิศทางพลังงาน ปฏิสัมพันธ์ และผลกระทบเป็นเครือข่าย ไม่มองสิ่งมีชีวิตแยกจากระบบ","example":"ในภารกิจ “ห้องจำลองสายใยอาหาร” ให้ใช้แนวคิด รูปแบบความสัมพันธ์ของสิ่งมีชีวิต อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าวาดลูกศรโซ่อาหารกลับทิศ และอย่าสรุปผลกระทบของการเปลี่ยนชนิดหนึ่งโดยไม่ดูทั้งสายใย","formula":"","code":"G3U7L1C4","check":"ลองอธิบาย ‘รูปแบบความสัมพันธ์ของสิ่งมีชีวิต’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ผู้ล่า–เหยื่อ การแข่งขัน ภาวะพึ่งพา อิงอาศัย และปรสิต"}],"kind":"ecology","mission":"ห้องจำลองสายใยอาหาร","focus":"ติดตามพลังงาน ความสัมพันธ์ และการสะสมสารพิษในระบบนิเวศ"},{"id":"G3U7L2","title":"ความหลากหลายทางชีวภาพ","concepts":[{"title":"ความหลากหลายทางชีวภาพในระดับต่าง ๆ","core":"พันธุกรรม ชนิดพันธุ์ และระบบนิเวศ","detail":"พันธุกรรม ชนิดพันธุ์ และระบบนิเวศ ให้ติดตามทิศทางพลังงาน ปฏิสัมพันธ์ และผลกระทบเป็นเครือข่าย ไม่มองสิ่งมีชีวิตแยกจากระบบ","example":"ในภารกิจ “สภาอนุรักษ์” ให้ใช้แนวคิด ความหลากหลายทางชีวภาพในระดับต่าง ๆ อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าวาดลูกศรโซ่อาหารกลับทิศ และอย่าสรุปผลกระทบของการเปลี่ยนชนิดหนึ่งโดยไม่ดูทั้งสายใย","formula":"","code":"G3U7L2C1","check":"ลองอธิบาย ‘ความหลากหลายทางชีวภาพในระดับต่าง ๆ’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า พันธุกรรม ชนิดพันธุ์ และระบบนิเวศ"},{"title":"ความหลากหลายกับสมดุลระบบนิเวศ","core":"ความสำคัญ ผลของการสูญเสีย และแนวทางอนุรักษ์","detail":"ความสำคัญ ผลของการสูญเสีย และแนวทางอนุรักษ์ ให้ติดตามทิศทางพลังงาน ปฏิสัมพันธ์ และผลกระทบเป็นเครือข่าย ไม่มองสิ่งมีชีวิตแยกจากระบบ","example":"ในภารกิจ “สภาอนุรักษ์” ให้ใช้แนวคิด ความหลากหลายกับสมดุลระบบนิเวศ อธิบายสถานการณ์หนึ่ง โดยระบุข้อมูลที่สังเกตหรือวัดได้ เหตุผลที่ใช้ และข้อสรุปที่ไม่เกินหลักฐาน","mis":"อย่าวาดลูกศรโซ่อาหารกลับทิศ และอย่าสรุปผลกระทบของการเปลี่ยนชนิดหนึ่งโดยไม่ดูทั้งสายใย","formula":"","code":"G3U7L2C2","check":"ลองอธิบาย ‘ความหลากหลายกับสมดุลระบบนิเวศ’ ด้วยภาษาของตนเอง แล้วเชื่อมกับแนวคิดว่า ความสำคัญ ผลของการสูญเสีย และแนวทางอนุรักษ์"}],"kind":"ecology","mission":"สภาอนุรักษ์","focus":"ประเมินความหลากหลายระดับพันธุกรรม ชนิด และระบบนิเวศเพื่อออกแบบแนวทางอนุรักษ์"}]}]},"packs":{"G1U1L1":[{"title":"วิทยาศาสตร์คืออะไร","body":"วิทยาศาสตร์เป็นกระบวนการสร้างความรู้เกี่ยวกับธรรมชาติโดยอาศัยหลักฐาน การตรวจสอบ และการใช้เหตุผล ความรู้ทางวิทยาศาสตร์ไม่ได้เกิดจากการเดา แต่เกิดจากการตั้งคำถามที่ตรวจสอบได้และการหาข้อมูลมาสนับสนุนคำอธิบาย","example":"เห็นต้นถั่วโตต่างกันจึงตั้งคำถามว่าแสงมีผลต่อการเจริญหรือไม่","mis":"วิทยาศาสตร์ไม่ใช่เพียงชุดข้อเท็จจริงที่ต้องจำ","formula":"","code":"G1U1L1S1"},{"title":"คำถามทางวิทยาศาสตร์","body":"คำถามที่ดีต้องสามารถหาหลักฐานมาตอบได้ เช่น วัด สังเกต หรือทดลองได้ คำถามควรระบุสิ่งที่สนใจชัดเจนและไม่กว้างจนเกินไป","example":"“ปริมาณแสงมีผลต่อความสูงของต้นถั่วหรือไม่” ตรวจสอบได้ดีกว่า “ต้นไม้ชอบอะไร”","mis":"คำถามที่ตอบด้วยความเชื่อหรือความคิดเห็นอย่างเดียวไม่ใช่คำถามทดลอง","formula":"","code":"G1U1L1S2"},{"title":"การสังเกตและการลงความเห็น","body":"การสังเกตคือข้อมูลที่ได้รับโดยตรงจากประสาทสัมผัสหรือเครื่องมือ ส่วนการลงความเห็นเป็นการตีความข้อมูลนั้น ต้องแยกสองอย่างออกจากกัน","example":"สังเกต: ใบมีสีเหลือง 6 ใบ / ลงความเห็น: พืชอาจขาดธาตุอาหาร","mis":"อย่าเขียนการตีความเป็นข้อมูลสังเกต","formula":"","code":"G1U1L1S3"},{"title":"สมมติฐาน","body":"สมมติฐานเป็นคำอธิบายหรือคำคาดคะเนที่สามารถทดสอบได้ มักเชื่อมตัวแปรต้นกับตัวแปรตามและควรมีเหตุผลรองรับ","example":"ถ้าปริมาณแสงเพิ่ม ต้นถั่วอาจสูงขึ้นเพราะมีพลังงานสำหรับสังเคราะห์ด้วยแสงมากขึ้น","mis":"สมมติฐานไม่จำเป็นต้องถูกเสมอ","formula":"","code":"G1U1L1S4"},{"title":"ตัวแปรในการทดลอง","body":"ตัวแปรต้นคือสิ่งที่ผู้ทดลองเปลี่ยน ตัวแปรตามคือผลที่วัด และตัวแปรควบคุมคือสิ่งที่ทำให้เหมือนกันเพื่อให้เปรียบเทียบได้อย่างยุติธรรม","example":"ทดสอบแสง: ตัวแปรต้น=ชั่วโมงรับแสง ตัวแปรตาม=ความสูง ตัวแปรควบคุม=ชนิดพืช น้ำ ดิน","mis":"อย่าเปลี่ยนหลายตัวแปรพร้อมกันถ้าต้องการหาสาเหตุ","formula":"","code":"G1U1L1S5"},{"title":"การวัดและการทำซ้ำ","body":"การวัดควรใช้หน่วยและเครื่องมือเหมาะสม การทำซ้ำช่วยเห็นความแปรปรวน ลดผลจากความผิดพลาดแบบสุ่ม และทำให้ข้อสรุปน่าเชื่อถือขึ้น","example":"วัดความสูงต้นถั่ว 3 ต้นต่อชุดแล้วหาค่าเฉลี่ย","mis":"การทำซ้ำไม่ได้ทำให้ผลต้องเหมือนกันทุกครั้ง","formula":"","code":"G1U1L1S6"},{"title":"การจัดข้อมูลและกราฟ","body":"ตารางช่วยจัดข้อมูลอย่างเป็นระบบ ส่วนกราฟช่วยมองแนวโน้ม ความสัมพันธ์ หรือความแตกต่าง ต้องเลือกแกนและหน่วยให้ถูก","example":"กราฟเส้นเหมาะกับการเปลี่ยนแปลงตามเวลา","mis":"กราฟสวยไม่ได้แปลว่าข้อมูลน่าเชื่อถือถ้าวิธีเก็บข้อมูลไม่ดี","formula":"","code":"G1U1L1S7"},{"title":"การสรุปจากหลักฐาน","body":"ข้อสรุปต้องตอบคำถามเดิมและอ้างอิงข้อมูลจริง หากข้อมูลไม่พอควรระบุข้อจำกัด ไม่ควรกล่าวเกินสิ่งที่ทดลองได้","example":"ถ้าชุดรับแสงมากโตเฉลี่ยสูงกว่าอย่างสม่ำเสมอ จึงกล่าวได้ว่าในเงื่อนไขนี้แสงสัมพันธ์กับการเจริญ","mis":"อย่าใช้คำว่า “พิสูจน์แน่นอน” จากการทดลองเล็กครั้งเดียว","formula":"","code":"G1U1L1S8"}],"G1U2L1":[{"title":"สารบริสุทธิ์และสารผสม","body":"สารบริสุทธิ์มีองค์ประกอบคงที่และสมบัติเฉพาะค่อนข้างแน่นอน ส่วนสารผสมประกอบด้วยสารมากกว่าหนึ่งชนิดและสัดส่วนเปลี่ยนได้","example":"น้ำกลั่นเป็นสารบริสุทธิ์ ส่วนน้ำเกลือเป็นสารผสม","mis":"ความใสไม่ได้บอกว่าสารเป็นสารบริสุทธิ์","formula":"","code":"G1U2L1S1"},{"title":"จุดเดือด","body":"จุดเดือดคืออุณหภูมิที่ของเหลวเดือดภายใต้ความดันที่กำหนด สารบริสุทธิ์ชนิดหนึ่งมีจุดเดือดจำเพาะและขณะเดือดอุณหภูมิค่อนข้างคงที่","example":"น้ำบริสุทธิ์ที่ความดันปกติเดือดใกล้ 100°C","mis":"จุดเดือดขึ้นกับความดัน จึงต้องระบุเงื่อนไข","formula":"","code":"G1U2L1S2"},{"title":"สารผสมขณะเดือด","body":"สารผสมมักมีองค์ประกอบเปลี่ยนระหว่างเดือด ทำให้อุณหภูมิเดือดเปลี่ยนเป็นช่วง การอ่านกราฟอุณหภูมิ-เวลาช่วยเปรียบเทียบสารได้","example":"น้ำเกลือมีพฤติกรรมเดือดต่างจากน้ำบริสุทธิ์","mis":"อย่าสรุปว่าสารที่เดือดสูงกว่าบริสุทธิ์กว่า","formula":"","code":"G1U2L1S3"},{"title":"จุดหลอมเหลว","body":"สารบริสุทธิ์มีจุดหลอมเหลวค่อนข้างแน่นอน ส่วนสารผสมมักหลอมเหลวเป็นช่วง การวัดต้องให้ความร้อนและอ่านอุณหภูมิอย่างสม่ำเสมอ","example":"น้ำแข็งบริสุทธิ์ละลายใกล้ 0°C ที่ความดันปกติ","mis":"อุณหภูมิหลอมเหลวสูงหรือต่ำไม่ได้บอกความบริสุทธิ์เพียงอย่างเดียว","formula":"","code":"G1U2L1S4"},{"title":"มวลและปริมาตร","body":"มวลบอกปริมาณสสาร ส่วนปริมาตรบอกพื้นที่สามมิติที่วัตถุครอบครอง ปริมาตรวัตถุรูปร่างไม่แน่นอนหาได้จากการแทนที่น้ำ","example":"ก้อนหินจุ่มในกระบอกตวงทำให้ระดับน้ำเพิ่มขึ้นเท่ากับปริมาตรก้อนหิน","mis":"อย่าสับสนมวลกับน้ำหนัก","formula":"","code":"G1U2L1S5"},{"title":"ความหนาแน่น","body":"ความหนาแน่นคือมวลต่อหนึ่งหน่วยปริมาตร ใช้เปรียบเทียบชนิดสารได้เมื่ออุณหภูมิและเงื่อนไขเหมาะสม","example":"มวล 54 g ปริมาตร 20 cm³ มีความหนาแน่น 2.7 g/cm³","mis":"วัตถุที่มวลมากกว่าอาจมีความหนาแน่นน้อยกว่าได้ถ้าปริมาตรมากกว่า","formula":"ρ = m/V","code":"G1U2L1S6"},{"title":"ใช้ข้อมูลจำแนกสาร","body":"การจำแนกสารควรใช้ข้อมูลหลายสมบัติร่วมกัน เช่น จุดเดือด จุดหลอมเหลว และความหนาแน่น พร้อมพิจารณาความคลาดเคลื่อนของการวัด","example":"ตัวอย่างที่มีความหนาแน่นใกล้ค่ามาตรฐานแต่จุดเดือดผิดมากอาจไม่ใช่สารเดียวกัน","mis":"ข้อมูลหนึ่งค่าไม่ควรใช้สรุปทันที","formula":"","code":"G1U2L1S7"}],"G1U2L2":[{"title":"ธาตุและสารประกอบ","body":"ธาตุเป็นสารบริสุทธิ์ที่ประกอบด้วยอะตอมชนิดเดียว ส่วนสารประกอบประกอบด้วยอะตอมของธาตุตั้งแต่สองชนิดขึ้นไปรวมกันทางเคมีในอัตราส่วนคงที่","example":"น้ำ H₂O เป็นสารประกอบของไฮโดรเจนและออกซิเจน","mis":"สารประกอบไม่ใช่การนำธาตุมาคลุกกันเฉย ๆ","formula":"","code":"G1U2L2S1"},{"title":"อะตอม","body":"อะตอมเป็นหน่วยพื้นฐานของธาตุ มีนิวเคลียสอยู่กลางและอิเล็กตรอนอยู่บริเวณรอบนิวเคลียส แบบจำลองอะตอมใช้ช่วยอธิบายสิ่งที่มองไม่เห็นโดยตรง","example":"อะตอมคาร์บอนทุกอะตอมมีจำนวนโปรตอนเท่ากัน","mis":"แบบจำลองไม่ใช่ภาพถ่ายจริงของอะตอม","formula":"","code":"G1U2L2S2"},{"title":"โปรตอน นิวตรอน อิเล็กตรอน","body":"โปรตอนมีประจุบวก นิวตรอนไม่มีประจุ และอิเล็กตรอนมีประจุลบ โปรตอนกับนิวตรอนอยู่ในนิวเคลียส อิเล็กตรอนอยู่รอบนิวเคลียส","example":"อะตอมเป็นกลางมีจำนวนโปรตอนเท่ากับจำนวนอิเล็กตรอน","mis":"อย่าสลับตำแหน่งอิเล็กตรอนกับนิวตรอน","formula":"","code":"G1U2L2S3"},{"title":"โมเลกุลและการรวมตัว","body":"อะตอมสามารถรวมกันเป็นโมเลกุลหรือโครงสร้างของสาร สารประกอบมีองค์ประกอบคงที่จึงมีสมบัติเฉพาะต่างจากธาตุเดิม","example":"โซเดียมกับคลอรีนมีสมบัติต่างจากโซเดียมคลอไรด์","mis":"สมบัติของสารประกอบไม่จำเป็นต้องเป็นค่าเฉลี่ยของธาตุ","formula":"","code":"G1U2L2S4"},{"title":"โลหะ","body":"โลหะส่วนใหญ่นำไฟฟ้าและความร้อนได้ดี มีผิวมันวาว ตีแผ่หรือดึงเป็นเส้นได้หลายชนิด จึงใช้ทำสายไฟ ภาชนะ และโครงสร้าง","example":"ทองแดงเหมาะกับสายไฟเพราะนำไฟฟ้าดี","mis":"โลหะทุกชนิดไม่ได้แข็งหรือมีสมบัติเหมือนกัน","formula":"","code":"G1U2L2S5"},{"title":"อโลหะและกึ่งโลหะ","body":"อโลหะมีสมบัติหลากหลายและโดยทั่วไปนำไฟฟ้าไม่ดี ส่วนกึ่งโลหะมีสมบัติบางอย่างก้ำกึ่งและบางชนิดเป็นสารกึ่งตัวนำ","example":"ซิลิคอนใช้ในอุปกรณ์อิเล็กทรอนิกส์","mis":"อย่าจำแนกจากสถานะของสารอย่างเดียว","formula":"","code":"G1U2L2S6"},{"title":"เลือกใช้ธาตุจากสมบัติ","body":"การเลือกวัสดุหรือธาตุต้องเชื่อมสมบัติกับงาน เช่น การนำไฟฟ้า ความแข็ง ความทนต่อการกัดกร่อน และผลกระทบต่อสิ่งแวดล้อม","example":"อะลูมิเนียมเบาและทนการกัดกร่อนจึงใช้ทำชิ้นส่วนหลายชนิด","mis":"วัสดุที่ดีที่สุดไม่มีชนิดเดียวสำหรับทุกงาน","formula":"","code":"G1U2L2S7"}],"G1U3L1":[{"title":"กล้องจุลทรรศน์","body":"กล้องจุลทรรศน์ใช้เลนส์ขยายวัตถุขนาดเล็ก ควรเริ่มจากเลนส์ใกล้วัตถุกำลังต่ำ ปรับภาพให้ชัดแล้วจึงเพิ่มกำลังขยาย","example":"เริ่มกำลังต่ำก่อนเมื่อหาตัวอย่าง","mis":"เริ่มกำลังสูงอาจหาตัวอย่างยากและเสี่ยงชนสไลด์","formula":"","code":"G1U3L1S1"},{"title":"การเตรียมและสังเกตสไลด์","body":"ตัวอย่างควรบางและมีแสงผ่านได้พอเหมาะ วางแผ่นปิดสไลด์อย่างระมัดระวังเพื่อลดฟองอากาศและป้องกันเลนส์","example":"เยื่อหอมบาง ๆ เหมาะสำหรับดูเซลล์พืช","mis":"ฟองอากาศอาจถูกเข้าใจผิดว่าเป็นเซลล์","formula":"","code":"G1U3L1S2"},{"title":"เยื่อหุ้มเซลล์","body":"เยื่อหุ้มเซลล์ห่อหุ้มเซลล์และควบคุมการผ่านเข้าออกของสารบางชนิด ช่วยรักษาสภาพภายในเซลล์","example":"การลำเลียงสารผ่านเยื่อสัมพันธ์กับการแพร่และออสโมซิส","mis":"เยื่อหุ้มเซลล์ไม่ได้เป็นกำแพงปิดสนิท","formula":"","code":"G1U3L1S3"},{"title":"ไซโทพลาซึมและนิวเคลียส","body":"ไซโทพลาซึมเป็นบริเวณที่มีโครงสร้างและปฏิกิริยาหลายอย่างเกิดขึ้น นิวเคลียสมีสารพันธุกรรมและเกี่ยวข้องกับการควบคุมการทำงานของเซลล์","example":"เซลล์หลายชนิดมีนิวเคลียสเด่นเมื่อย้อมสี","mis":"ไม่ควรบอกว่านิวเคลียสทำทุกหน้าที่ของเซลล์","formula":"","code":"G1U3L1S4"},{"title":"ผนังเซลล์ แวคิวโอล คลอโรพลาสต์","body":"เซลล์พืชมีผนังเซลล์ช่วยค้ำจุน แวคิวโอลเก็บสารและช่วยรักษาความเต่ง และคลอโรพลาสต์เกี่ยวข้องกับการสังเคราะห์ด้วยแสง","example":"เซลล์ใบพืชสีเขียวมักมีคลอโรพลาสต์มาก","mis":"เซลล์พืชทุกชนิดไม่ได้มีคลอโรพลาสต์จำนวนมาก เช่น เซลล์ราก","formula":"","code":"G1U3L1S5"},{"title":"เปรียบเทียบเซลล์พืชและสัตว์","body":"ทั้งสองมีเยื่อหุ้มเซลล์ ไซโทพลาซึม และนิวเคลียสเป็นองค์ประกอบสำคัญ แต่เซลล์พืชมีผนังเซลล์และโครงสร้างเฉพาะบางอย่าง","example":"ใช้ตารางเปรียบเทียบส่วนที่เหมือนและต่าง","mis":"อย่าสรุปว่าเซลล์สัตว์ไม่มีแวคิวโอลเลยในทุกกรณี","formula":"","code":"G1U3L1S6"},{"title":"จากเซลล์สู่สิ่งมีชีวิต","body":"เซลล์ที่ทำหน้าที่คล้ายกันรวมเป็นเนื้อเยื่อ เนื้อเยื่อรวมเป็นอวัยวะ อวัยวะหลายชนิดทำงานร่วมเป็นระบบอวัยวะ","example":"เซลล์กล้ามเนื้อ → เนื้อเยื่อกล้ามเนื้อ → หัวใจ → ระบบหมุนเวียนเลือด","mis":"ลำดับการจัดระบบไม่ใช่เพียงขนาด แต่เกี่ยวกับการร่วมทำหน้าที่","formula":"","code":"G1U3L1S7"}],"G1U3L2":[{"title":"การแพร่คืออะไร","body":"การแพร่เกิดจากการเคลื่อนที่แบบสุ่มของอนุภาค ทำให้เกิดการเคลื่อนที่สุทธิจากบริเวณที่มีความเข้มข้นสูงไปต่ำจนกระจายสม่ำเสมอมากขึ้น","example":"หยดสีในน้ำค่อย ๆ กระจายโดยไม่คน","mis":"อนุภาคไม่ได้หยุดเคลื่อนที่เมื่อสมดุล แต่ไม่มีการเคลื่อนที่สุทธิ","formula":"","code":"G1U3L2S1"},{"title":"ปัจจัยที่มีผลต่อการแพร่","body":"อุณหภูมิ ความแตกต่างของความเข้มข้น ระยะทาง และขนาดอนุภาคมีผลต่ออัตราการแพร่ในหลายระบบ","example":"สีแพร่เร็วขึ้นในน้ำอุ่นกว่าน้ำเย็น","mis":"อย่าสรุปว่าปัจจัยทุกชนิดมีผลเท่ากัน","formula":"","code":"G1U3L2S2"},{"title":"การแพร่กับเซลล์","body":"แก๊สและสารขนาดเล็กบางชนิดแลกเปลี่ยนระหว่างเซลล์กับสิ่งแวดล้อมด้วยการแพร่เมื่อมีความแตกต่างของความเข้มข้น","example":"ออกซิเจนแพร่จากถุงลมเข้าสู่เลือด","mis":"การแพร่ไม่จำเป็นต้องใช้พลังงานจากเซลล์โดยตรง","formula":"","code":"G1U3L2S3"},{"title":"ออสโมซิส","body":"ออสโมซิสเป็นการเคลื่อนที่สุทธิของน้ำผ่านเยื่อเลือกผ่านจากบริเวณที่มีน้ำมากกว่าไปบริเวณที่มีน้ำน้อยกว่าเมื่อเปรียบเทียบสารละลาย","example":"เซลล์พืชในน้ำสะอาดรับน้ำและเต่ง","mis":"ออสโมซิสกล่าวถึงน้ำ ไม่ใช่ตัวละลาย","formula":"","code":"G1U3L2S4"},{"title":"เยื่อเลือกผ่าน","body":"เยื่อเลือกผ่านยอมให้สารบางชนิดผ่านได้ง่ายกว่าสารอื่น จึงทำให้การกระจายของน้ำและตัวละลายไม่เหมือนระบบที่ไม่มีเยื่อ","example":"ถุงเซลโลเฟนจำลองเยื่อเลือกผ่านได้บางการทดลอง","mis":"แบบจำลองเยื่อไม่เหมือนเยื่อเซลล์จริงทุกประการ","formula":"","code":"G1U3L2S5"},{"title":"ผลต่อเซลล์พืชและสัตว์","body":"เซลล์พืชมีผนังเซลล์จึงทนต่อการรับน้ำได้มากกว่าเซลล์สัตว์ เซลล์สัตว์ในสารละลายที่เจือจางมากอาจบวมและเสียหาย","example":"ผักแช่น้ำอาจกรอบขึ้น","mis":"อย่าใช้ผลของเซลล์พืชอธิบายเซลล์สัตว์เหมือนกันทั้งหมด","formula":"","code":"G1U3L2S6"}],"G1U4L1":[{"title":"ส่วนประกอบของดอก","body":"กลีบเลี้ยง กลีบดอก เกสรเพศผู้ และเกสรเพศเมียมีบทบาทต่างกัน เกสรเพศผู้สร้างละอองเรณู ส่วนรังไข่มีออวุล","example":"สังเกตดอกจริงแล้วระบุตำแหน่งอับเรณู ยอดเกสร และรังไข่","mis":"ดอกทุกชนิดไม่ได้มีส่วนประกอบครบหรือรูปร่างเหมือนกัน","formula":"","code":"G1U4L1S1"},{"title":"การถ่ายเรณู","body":"การถ่ายเรณูคือการเคลื่อนละอองเรณูจากอับเรณูไปยังยอดเกสรเพศเมีย อาศัยลม น้ำ หรือสัตว์ช่วยได้","example":"ผึ้งพาละอองเรณูระหว่างดอก","mis":"การถ่ายเรณูยังไม่ใช่การปฏิสนธิ","formula":"","code":"G1U4L1S2"},{"title":"การปฏิสนธิ","body":"หลังละอองเรณูงอก หลอดเรณูนำเซลล์สืบพันธุ์เพศผู้ไปยังออวุลเพื่อเกิดการปฏิสนธิ","example":"การปฏิสนธิเกิดภายในออวุล","mis":"อย่าสลับขั้นถ่ายเรณูกับปฏิสนธิ","formula":"","code":"G1U4L1S3"},{"title":"การเกิดเมล็ดและผล","body":"หลังปฏิสนธิ ออวุลพัฒนาเป็นเมล็ด ส่วนรังไข่มักพัฒนาเป็นผล เมล็ดมีเอ็มบริโอและอาหารสะสมตามชนิด","example":"เมล็ดถั่วมีใบเลี้ยงสะสมอาหาร","mis":"ผลไม่ได้เกิดจากกลีบดอกทุกกรณี","formula":"","code":"G1U4L1S4"},{"title":"การงอกของเมล็ด","body":"การงอกส่วนใหญ่ต้องใช้น้ำ ออกซิเจน และอุณหภูมิที่เหมาะสม น้ำกระตุ้นกระบวนการเมแทบอลิซึมและเอ็มบริโอใช้พลังงานสะสม","example":"ทดลองเมล็ดในสภาพชื้น/แห้ง","mis":"แสงไม่ใช่ปัจจัยจำเป็นสำหรับเมล็ดทุกชนิด","formula":"","code":"G1U4L1S5"},{"title":"ขยายพันธุ์โดยอาศัยเพศ","body":"การใช้เมล็ดเกิดจากการสืบพันธุ์แบบอาศัยเพศ ทำให้ลูกมีความหลากหลายทางพันธุกรรมมากขึ้น","example":"ปลูกพืชจากเมล็ดเพื่อคัดพันธุ์ใหม่","mis":"ลักษณะลูกไม่จำเป็นเหมือนต้นแม่ทุกประการ","formula":"","code":"G1U4L1S6"},{"title":"ขยายพันธุ์ไม่อาศัยเพศ","body":"ปักชำ ตอนกิ่ง ติดตา เสียบยอด และเพาะเลี้ยงเนื้อเยื่อใช้ส่วนของพืชและมักรักษาลักษณะพันธุกรรมของต้นแม่","example":"ปักชำกิ่งชบา","mis":"แต่ละวิธีเหมาะกับพืชต่างกัน","formula":"","code":"G1U4L1S7"}],"G1U4L2":[{"title":"ความหมายของการสังเคราะห์ด้วยแสง","body":"พืชสีเขียวใช้พลังงานแสงเปลี่ยนน้ำและคาร์บอนไดออกไซด์ให้เป็นน้ำตาล และมีออกซิเจนเป็นผลผลิตสำคัญ","example":"ใบพืชที่ได้รับแสงสร้างแป้งสะสมได้","mis":"พืชไม่ได้รับอาหารสำเร็จรูปจากดิน","formula":"","code":"G1U4L2S1"},{"title":"บทบาทของคลอโรฟิลล์","body":"คลอโรฟิลล์ในคลอโรพลาสต์ดูดกลืนพลังงานแสงบางช่วงและช่วยให้กระบวนการสังเคราะห์ด้วยแสงเกิดขึ้น","example":"ใบด่างใช้ทดสอบว่าบริเวณสีเขียวสร้างแป้งได้ดีกว่า","mis":"คลอโรฟิลล์ไม่ได้เป็นอาหารของพืช","formula":"","code":"G1U4L2S2"},{"title":"น้ำและคาร์บอนไดออกไซด์","body":"น้ำเข้าสู่พืชทางรากและลำเลียงสู่ใบ ส่วนคาร์บอนไดออกไซด์เข้าสู่ใบผ่านปากใบ ทั้งสองเป็นสารตั้งต้นสำคัญ","example":"ปิดปากใบมากเกินไปลดการรับ CO₂","mis":"น้ำอย่างเดียวไม่พอให้สังเคราะห์ด้วยแสง","formula":"","code":"G1U4L2S3"},{"title":"แสงเป็นแหล่งพลังงาน","body":"เมื่อแสงไม่เพียงพอ อัตราการสังเคราะห์ด้วยแสงลดลง แม้มีน้ำและคาร์บอนไดออกไซด์เพียงพอ","example":"เปรียบเทียบพืชที่วางในแสงกับความมืด","mis":"แสงมากขึ้นไม่ได้ทำให้อัตราเพิ่มไม่จำกัด","formula":"","code":"G1U4L2S4"},{"title":"ผลผลิตของกระบวนการ","body":"น้ำตาลที่สร้างอาจถูกใช้หายใจ สร้างสารอื่น หรือลำเลียง/สะสม ส่วนออกซิเจนจำนวนหนึ่งออกสู่บรรยากาศ","example":"แป้งในใบเป็นรูปสะสมจากน้ำตาล","mis":"ออกซิเจนไม่ใช่อาหารที่พืชผลิตเพื่อกิน","formula":"","code":"G1U4L2S5"},{"title":"ความสำคัญต่อระบบนิเวศ","body":"การสังเคราะห์ด้วยแสงเป็นทางเข้าพลังงานสำคัญของระบบนิเวศ สร้างสารอินทรีย์ให้ห่วงโซ่อาหารและช่วยรักษาสมดุล CO₂/O₂","example":"ผู้ผลิตเป็นฐานของสายใยอาหาร","mis":"อย่ามองเฉพาะประโยชน์ต่อพืชต้นเดียว","formula":"","code":"G1U4L2S6"},{"title":"ออกแบบการทดลอง","body":"หากทดสอบปัจจัยหนึ่งต้องควบคุมปัจจัยอื่นให้ใกล้เคียงกัน ใช้ชุดควบคุม ทำซ้ำ และกำหนดตัวชี้วัด เช่น จำนวนฟองแก๊สหรือการตรวจแป้ง","example":"ทดสอบแสงโดยคุมชนิดพืช น้ำ และเวลา","mis":"การเปลี่ยนแสงและอุณหภูมิพร้อมกันทำให้สรุปสาเหตุยาก","formula":"","code":"G1U4L2S7"}],"G1U4L3":[{"title":"รากดูดน้ำและธาตุอาหาร","body":"ขนรากเพิ่มพื้นที่ผิวในการดูดน้ำและแร่ธาตุจากดิน น้ำเข้าสู่รากตามความต่างของศักย์น้ำและสารละลายเคลื่อนตามกลไกต่าง ๆ","example":"พืชที่รากเสียหายดูดน้ำได้น้อยลง","mis":"รากไม่ได้ดูดอาหารสำเร็จรูปจากดินเป็นหลัก","formula":"","code":"G1U4L3S1"},{"title":"ไซเล็ม","body":"ไซเล็มเป็นเนื้อเยื่อลำเลียงน้ำและธาตุอาหารจากรากขึ้นสู่ลำต้นและใบ มีโครงสร้างท่อที่เหมาะต่อการลำเลียง","example":"ย้อมสีน้ำแล้วสังเกตสีตามท่อลำเลียง","mis":"ไซเล็มไม่ได้ลำเลียงน้ำตาลเป็นหน้าที่หลัก","formula":"","code":"G1U4L3S2"},{"title":"การคายน้ำ","body":"น้ำระเหยออกจากใบผ่านปากใบ ทำให้เกิดแรงดึงต่อเนื่องในคอลัมน์น้ำ ช่วยลำเลียงน้ำขึ้นด้านบน","example":"ลมและอากาศแห้งอาจเพิ่มการคายน้ำ","mis":"การคายน้ำมากเกินไปทำให้พืชสูญเสียน้ำ","formula":"","code":"G1U4L3S3"},{"title":"โฟลเอ็ม","body":"โฟลเอ็มลำเลียงน้ำตาลและสารอินทรีย์จากบริเวณแหล่งสร้าง เช่น ใบ ไปยังแหล่งใช้หรือสะสม เช่น ราก ผล ยอด","example":"ผลไม้กำลังโตเป็นแหล่งใช้สารอาหาร","mis":"โฟลเอ็มไม่จำเป็นต้องลำเลียงลงล่างเท่านั้น","formula":"","code":"G1U4L3S4"},{"title":"ความสัมพันธ์ไซเล็ม–โฟลเอ็ม","body":"พืชต้องใช้ทั้งระบบน้ำ/แร่ธาตุและระบบอาหารร่วมกัน การสังเคราะห์ด้วยแสงที่ใบจึงเชื่อมกับการดูดน้ำจากรากและการลำเลียงอาหาร","example":"รากสะสมแป้งได้รับน้ำตาลจากใบผ่านโฟลเอ็ม","mis":"อย่าศึกษาท่อลำเลียงแยกจากหน้าที่ของทั้งต้น","formula":"","code":"G1U4L3S5"}],"G1U5L1":[{"title":"อนุภาคในของแข็ง","body":"อนุภาคอยู่ใกล้กันและสั่นรอบตำแหน่งสมดุล ทำให้ของแข็งมีรูปร่างและปริมาตรค่อนข้างคงที่","example":"ก้อนน้ำแข็งคงรูป","mis":"อนุภาคในของแข็งไม่ได้หยุดนิ่ง","formula":"","code":"G1U5L1S1"},{"title":"อนุภาคในของเหลว","body":"อนุภาคอยู่ใกล้กันแต่เคลื่อนผ่านกันได้ ของเหลวจึงมีปริมาตรค่อนข้างคงที่แต่เปลี่ยนรูปร่างตามภาชนะ","example":"น้ำเปลี่ยนรูปตามแก้ว","mis":"ของเหลวไม่ได้มีอนุภาคห่างเท่าแก๊ส","formula":"","code":"G1U5L1S2"},{"title":"อนุภาคในแก๊ส","body":"อนุภาคอยู่ห่างและเคลื่อนที่รวดเร็วหลายทิศ จึงขยายเต็มภาชนะและอัดตัวได้มากกว่าของแข็ง/ของเหลว","example":"อากาศในกระบอกฉีดยาถูกอัดได้","mis":"ช่องว่างระหว่างอนุภาคไม่ใช่อากาศอีกชั้นหนึ่ง","formula":"","code":"G1U5L1S3"},{"title":"ความร้อนกับอุณหภูมิ","body":"อุณหภูมิสัมพันธ์กับพลังงานจลน์เฉลี่ยของอนุภาค ส่วนความร้อนคือพลังงานที่ถ่ายโอนเพราะอุณหภูมิต่างกัน","example":"น้ำร้อนถ่ายพลังงานให้ช้อนเย็น","mis":"ความร้อนและอุณหภูมิไม่ใช่คำเดียวกัน","formula":"","code":"G1U5L1S4"},{"title":"ปัจจัยต่อการเปลี่ยนอุณหภูมิ","body":"อุณหภูมิเปลี่ยนมากน้อยขึ้นกับปริมาณความร้อน มวล และชนิดสาร สารต่างชนิดรับพลังงานเท่ากันอาจมีอุณหภูมิเปลี่ยนไม่เท่ากัน","example":"น้ำกับโลหะมวลเท่ากันรับความร้อนเท่ากันอาจร้อนต่างกัน","mis":"มวลมากขึ้นมักต้องใช้พลังงานมากเพื่อเปลี่ยนอุณหภูมิเท่ากัน","formula":"","code":"G1U5L1S5"},{"title":"การขยายตัวและหดตัว","body":"เมื่อร้อน อนุภาคเคลื่อนที่มากขึ้นและระยะห่างเฉลี่ยเพิ่ม ทำให้สสารส่วนใหญ่ขยายตัว เมื่อเย็นลงมักหดตัว","example":"รอยต่อสะพานเผื่อการขยายตัว","mis":"อย่าบอกว่าอนุภาคเองมีขนาดใหญ่ขึ้น","formula":"","code":"G1U5L1S6"},{"title":"การหลอมเหลวและแข็งตัว","body":"หลอมเหลวรับพลังงานเพื่อเปลี่ยนโครงสร้างจากของแข็งเป็นของเหลว ส่วนแข็งตัวคายพลังงาน","example":"น้ำแข็งละลายที่อุณหภูมิคงที่ช่วงหนึ่ง","mis":"การเปลี่ยนสถานะไม่เปลี่ยนชนิดสาร","formula":"","code":"G1U5L1S7"},{"title":"การกลายเป็นไอและควบแน่น","body":"การกลายเป็นไอเกิดที่ผิวได้ทุกอุณหภูมิ ส่วนการเดือดเกิดทั่วของเหลวเมื่อความดันไอเหมาะสม การควบแน่นเป็นกระบวนการย้อนกลับ","example":"เหงื่อระเหยช่วยระบายความร้อน","mis":"การระเหยไม่ใช่การเดือดเสมอ","formula":"","code":"G1U5L1S8"}],"G1U5L2":[{"title":"ทิศทางการถ่ายโอนความร้อน","body":"ความร้อนถ่ายจากบริเวณอุณหภูมิสูงไปต่ำจนไม่มีการถ่ายโอนสุทธิ","example":"แก้วน้ำร้อนถ่ายพลังงานสู่อากาศ","mis":"ความเย็นไม่ได้ไหลเข้าสู่วัตถุในความหมายเดียวกัน","formula":"","code":"G1U5L2S1"},{"title":"การนำความร้อน","body":"พลังงานถ่ายผ่านการสั่นและชนของอนุภาคโดยไม่มีการเคลื่อนย้ายมวลสารโดยรวม โลหะมักนำความร้อนได้ดี","example":"ด้ามกระทะใช้วัสดุนำความร้อนต่ำ","mis":"โลหะทุกชนิดนำความร้อนไม่เท่ากัน","formula":"","code":"G1U5L2S2"},{"title":"ตัวนำและฉนวนความร้อน","body":"วัสดุนำความร้อนสูงเหมาะกับส่วนที่ต้องถ่ายพลังงาน ส่วนฉนวนช่วยลดอัตราการถ่ายโอน","example":"กระติกน้ำใช้ชั้นฉนวน","mis":"ฉนวนไม่ได้หยุดความร้อน 100%","formula":"","code":"G1U5L2S3"},{"title":"การพาความร้อน","body":"ของไหลที่ร้อนมักมีความหนาแน่นลดลงและเคลื่อนที่ขึ้น ขณะที่ส่วนเย็นลงเคลื่อนแทนที่ เกิดกระแสพา","example":"น้ำในหม้อหมุนเวียนเมื่อให้ความร้อน","mis":"การพาเกิดในของแข็งไม่ได้","formula":"","code":"G1U5L2S4"},{"title":"การแผ่รังสี","body":"พลังงานความร้อนถ่ายในรูปคลื่นแม่เหล็กไฟฟ้า ไม่ต้องอาศัยตัวกลาง","example":"ดวงอาทิตย์ส่งพลังงานมายังโลก","mis":"สุญญากาศไม่ขัดขวางการแผ่รังสี","formula":"","code":"G1U5L2S5"},{"title":"สมดุลความร้อน","body":"เมื่อวัตถุสองชิ้นแลกเปลี่ยนพลังงานจนมีอุณหภูมิเท่ากัน การถ่ายโอนสุทธิหยุด เรียกสมดุลความร้อน","example":"เทอร์โมมิเตอร์ต้องรอจนสมดุลกับสิ่งที่วัด","mis":"อนุภาคยังเคลื่อนที่แม้สมดุล","formula":"","code":"G1U5L2S6"},{"title":"การประยุกต์","body":"การเลือกวัสดุและการออกแบบบ้าน ภาชนะ หรือเสื้อผ้าต้องพิจารณาการนำ การพา และการแผ่รังสีร่วมกัน","example":"หลังคาสีอ่อนและฉนวนช่วยลดความร้อนเข้าสู่บ้าน","mis":"อย่าวิเคราะห์กลไกเพียงแบบเดียวหากมีหลายแบบเกิดพร้อมกัน","formula":"","code":"G1U5L2S7"}],"G1U6L1":[{"title":"องค์ประกอบบรรยากาศ","body":"บรรยากาศประกอบด้วยไนโตรเจน ออกซิเจน แก๊สอื่น ไอน้ำ และอนุภาคแขวนลอย สัดส่วนไอน้ำเปลี่ยนได้มากตามเวลาและพื้นที่","example":"อากาศชื้นมีไอน้ำมากกว่าอากาศแห้ง","mis":"ออกซิเจนไม่ใช่แก๊สส่วนใหญ่ของบรรยากาศ","formula":"","code":"G1U6L1S1"},{"title":"อุณหภูมิอากาศ","body":"พื้นผิวโลกดูดกลืนและคายพลังงาน ทำให้อากาศใกล้พื้นเปลี่ยนอุณหภูมิ ปัจจัยได้แก่ เวลา เมฆ ลักษณะพื้นผิว และตำแหน่ง","example":"เมืองร้อนกว่าชนบทบางคืนจากเกาะความร้อน","mis":"วัดอุณหภูมิกลางแดดตรงอาจสูงเกินอุณหภูมิอากาศจริง","formula":"","code":"G1U6L1S2"},{"title":"ความกดอากาศ","body":"อากาศมีมวลจึงสร้างความดัน ความกดอากาศลดลงเมื่อสูงขึ้นและเปลี่ยนตามสภาวะอากาศ","example":"ยอดเขามีความกดอากาศต่ำกว่าพื้นราบ","mis":"อากาศที่ร้อนกว่าไม่ได้แปลว่าความกดอากาศสูงกว่าเสมอ","formula":"","code":"G1U6L1S3"},{"title":"การเกิดลม","body":"ลมเกิดจากความแตกต่างของความกดอากาศ อากาศเคลื่อนจากบริเวณความกดสูงไปต่ำ ความร้อนที่ไม่เท่ากันช่วยสร้างความแตกต่างนี้","example":"กลางวันพื้นดินร้อนเร็วกว่าน้ำจึงเกิดลมทะเล","mis":"ทิศลมจริงอาจได้รับผลจากภูมิประเทศและการหมุนของโลก","formula":"","code":"G1U6L1S4"},{"title":"ความชื้น","body":"ความชื้นบอกปริมาณไอน้ำในอากาศ ความชื้นสัมพัทธ์ขึ้นกับทั้งปริมาณไอน้ำและอุณหภูมิ","example":"อากาศเย็นลงอาจทำให้ความชื้นสัมพัทธ์เพิ่มแม้ปริมาณไอน้ำเดิม","mis":"ความชื้น 100% ไม่ได้แปลว่าอากาศเป็นน้ำทั้งหมด","formula":"","code":"G1U6L1S5"},{"title":"การเกิดเมฆ","body":"อากาศชื้นยกตัวและเย็นลงจนไอน้ำควบแน่นบนอนุภาคเล็ก ๆ เป็นหยดน้ำหรือผลึกน้ำแข็ง","example":"เมฆเกิดใกล้ภูเขาเมื่ออากาศถูกบังคับให้ยกตัว","mis":"ไอน้ำเป็นแก๊สที่มองไม่เห็น ส่วนเมฆคือหยดน้ำ/ผลึก","formula":"","code":"G1U6L1S6"},{"title":"ฝนและหยาดน้ำฟ้า","body":"หยดน้ำหรือผลึกในเมฆต้องรวมตัวจนมีขนาดใหญ่พอจึงตกลงมาเป็นฝนหรือหยาดน้ำฟ้าแบบอื่น","example":"เมฆดำไม่ได้รับประกันว่าฝนจะตกถึงพื้นเสมอ","mis":"ฝนไม่ได้เกิดเพียงเพราะเมฆมีน้ำ","formula":"","code":"G1U6L1S7"},{"title":"เครื่องมืออากาศ","body":"เทอร์โมมิเตอร์วัดอุณหภูมิ บารอมิเตอร์วัดความกด เครื่องวัดความชื้นวัดความชื้น และเครื่องวัดลมช่วยเก็บข้อมูลอย่างเป็นระบบ","example":"สถานีอากาศใช้หลายเครื่องมือร่วมกัน","mis":"อย่าตีความค่าจากเครื่องมือผิดหน่วย","formula":"","code":"G1U6L1S8"},{"title":"พยากรณ์อากาศ","body":"นักพยากรณ์ใช้ข้อมูลสถานี เรดาร์ ดาวเทียม และแบบจำลองร่วมกัน การพยากรณ์เป็นความน่าจะเป็นจึงมีความไม่แน่นอน","example":"โอกาสฝน 70% ไม่ได้หมายถึงฝนตก 70% ของเวลาแน่นอน","mis":"ข้อมูลล่าสุดสำคัญกว่าการยึดพยากรณ์เก่า","formula":"","code":"G1U6L1S9"}],"G1U6L2":[{"title":"พายุฝนฟ้าคะนอง","body":"เกิดจากอากาศอุ่นชื้นยกตัวแรง เกิดเมฆคิวมูโลนิมบัส ฝนหนัก ลมกระโชก ฟ้าแลบฟ้าร้อง และบางครั้งลูกเห็บ","example":"หลีกเลี่ยงที่โล่งและวัตถุสูงเดี่ยวระหว่างฟ้าคะนอง","mis":"อย่าหลบใต้ต้นไม้สูงเดี่ยว","formula":"","code":"G1U6L2S1"},{"title":"พายุหมุนเขตร้อน","body":"ก่อตัวเหนือทะเลอุ่นและมีโครงสร้างการหมุนขนาดใหญ่ อันตรายมาจากลมแรง ฝนหนัก คลื่นพายุซัดฝั่งและน้ำท่วม","example":"ติดตามเส้นทางจากหน่วยงานอุตุนิยมวิทยา","mis":"ความรุนแรงไม่ได้ดูจากฝนอย่างเดียว","formula":"","code":"G1U6L2S2"},{"title":"การประเมินความเสี่ยง","body":"ความเสี่ยงขึ้นกับภัย ความเปราะบาง และการเปิดรับของพื้นที่ การเตรียมตัวต้องใช้ข้อมูลท้องถิ่นและประกาศเตือน","example":"โรงเรียนใกล้ลำน้ำต้องมีแผนอพยพต่างจากพื้นที่สูง","mis":"พายุระดับเดียวกันอาจสร้างผลกระทบต่างกัน","formula":"","code":"G1U6L2S3"},{"title":"อากาศกับภูมิอากาศ","body":"อากาศคือสภาพระยะสั้น ส่วนภูมิอากาศคือแบบแผนระยะยาวหลายสิบปี การเปลี่ยนแปลงภูมิอากาศจึงดูจากแนวโน้ม ไม่ใช่วันใดวันหนึ่ง","example":"วันหนาวผิดปกติหนึ่งวันไม่หักล้างภาวะโลกร้อน","mis":"อย่าสับสนเหตุการณ์อากาศกับแนวโน้มภูมิอากาศ","formula":"","code":"G1U6L2S4"},{"title":"ปรากฏการณ์เรือนกระจก","body":"ก๊าซเรือนกระจกดูดกลืนและแผ่รังสีอินฟราเรด ช่วยให้โลกอุ่นพอเหมาะ แต่การเพิ่มความเข้มข้นทำให้สมดุลพลังงานเปลี่ยนและโลกร้อนขึ้น","example":"CO₂ เพิ่มจากการเผาเชื้อเพลิงซากดึกดำบรรพ์","mis":"ปรากฏการณ์เรือนกระจกตามธรรมชาติไม่ใช่สิ่งเลวทั้งหมด","formula":"","code":"G1U6L2S5"},{"title":"ผลกระทบและการปรับตัว","body":"อุณหภูมิสูงขึ้น ระดับทะเล การเปลี่ยนรูปแบบฝน และเหตุการณ์สุดขั้วส่งผลต่อระบบนิเวศ สุขภาพ และเศรษฐกิจ การลดการปล่อยและการปรับตัวต้องทำควบคู่","example":"เพิ่มพื้นที่สีเขียวและจัดการน้ำเพื่อลดผลกระทบความร้อน/น้ำท่วม","mis":"มาตรการเดียวไม่แก้ปัญหาทุกพื้นที่","formula":"","code":"G1U6L2S6"}],"G2U1L1":[{"title":"ธรรมชาติของความรู้วิทยาศาสตร์","body":"ความรู้วิทยาศาสตร์สร้างจากหลักฐานและการตีความอย่างมีเหตุผล จึงมีความน่าเชื่อถือแต่พร้อมปรับเมื่อมีหลักฐานใหม่","example":"แบบจำลองอะตอมเปลี่ยนเมื่อมีหลักฐานใหม่","mis":"การปรับความรู้ไม่ได้หมายความว่าวิทยาศาสตร์ไม่น่าเชื่อถือ","formula":"","code":"G2U1L1S1"},{"title":"ข้อเท็จจริง กฎ ทฤษฎี และแบบจำลอง","body":"คำเหล่านี้มีบทบาทต่างกัน ทฤษฎีเป็นคำอธิบายกว้างที่มีหลักฐานมาก ไม่ได้เปลี่ยนเป็นกฎเมื่อพิสูจน์แล้ว ส่วนแบบจำลองใช้แทนระบบเพื่ออธิบายหรือพยากรณ์","example":"ทฤษฎีจลน์ของแก๊สอธิบายพฤติกรรมจากอนุภาค","mis":"อย่าเรียกทฤษฎีว่า “การเดา”","formula":"","code":"G2U1L1S2"},{"title":"หลักฐานและข้ออ้าง","body":"ข้ออ้างที่ดีต้องเชื่อมกับหลักฐานด้วยเหตุผลที่ชัดเจน ต้องพิจารณาคุณภาพ ปริมาณ และความเกี่ยวข้องของข้อมูล","example":"ข้อมูลหลายชุดจากวิธีต่างกันสนับสนุนข้ออ้างได้แข็งแรงขึ้น","mis":"จำนวนข้อมูลมากไม่ได้ช่วยถ้าวัดผิดวิธี","formula":"","code":"G2U1L1S3"},{"title":"แบบจำลองทางวิทยาศาสตร์","body":"แบบจำลองอาจเป็นภาพ สมการ วัตถุ หรือคอมพิวเตอร์ ช่วยเน้นส่วนสำคัญและมีข้อจำกัด","example":"แบบจำลองระบบสุริยะไม่สามารถทำสเกลระยะและขนาดพร้อมกันง่าย ๆ","mis":"แบบจำลองไม่ใช่สำเนาความจริง","formula":"","code":"G2U1L1S4"},{"title":"การสืบเสาะ","body":"เริ่มจากคำถาม เลือกวิธีเก็บข้อมูล วิเคราะห์ อธิบาย ตรวจสอบ และสื่อสาร กระบวนการอาจย้อนกลับและปรับเปลี่ยน ไม่จำเป็นต้องเป็นขั้นเส้นตรงตายตัว","example":"พบผลแปลกจึงย้อนตรวจเครื่องมือและออกแบบใหม่","mis":"วิธีการทางวิทยาศาสตร์ไม่ใช่สูตร 5 ขั้นที่ใช้เหมือนกันทุกงาน","formula":"","code":"G2U1L1S5"},{"title":"การสื่อสารและการตรวจสอบ","body":"งานวิทยาศาสตร์ต้องเปิดเผยวิธี หลักฐาน และเหตุผลให้ผู้อื่นประเมินหรือทำซ้ำได้ การวิจารณ์เป็นส่วนหนึ่งของการพัฒนาความรู้","example":"เพื่อนตรวจกราฟและถามเรื่องตัวอย่างทดลอง","mis":"การเห็นต่างทางวิทยาศาสตร์ควรอภิปรายด้วยหลักฐาน","formula":"","code":"G2U1L1S6"}],"G2U2L1":[{"title":"สารละลาย","body":"สารละลายเป็นสารผสมเนื้อเดียว ตัวทำละลายเป็นองค์ประกอบที่ทำหน้าที่ละลายสารอื่น ส่วนตัวละลายกระจายตัวสม่ำเสมอในระดับอนุภาค","example":"น้ำตาลละลายในน้ำเป็นสารละลาย","mis":"สารละลายไม่ได้จำกัดเฉพาะของเหลว","formula":"","code":"G2U2L1S1"},{"title":"ระบุตัวทำละลาย","body":"เมื่อองค์ประกอบมีสถานะต่างกัน มักพิจารณาสถานะของสารละลายเป็นหลัก เมื่อสถานะเหมือนกันมักพิจารณาปริมาณมากกว่าโดยทั่วไป","example":"อากาศมีไนโตรเจนเป็นตัวทำละลายหลักตามสัดส่วน","mis":"อย่าใช้คำว่า “น้ำเป็นตัวทำละลายเสมอ”","formula":"","code":"G2U2L1S2"},{"title":"สารละลายอิ่มตัว","body":"ที่อุณหภูมิหนึ่ง ตัวทำละลายมีขีดจำกัดปริมาณตัวละลายที่ละลายได้ เมื่อถึงขีดจำกัดเรียกสารละลายอิ่มตัว","example":"เติมเกลือต่อแล้วมีเกลือคงเหลือแม้คน","mis":"อิ่มตัวไม่แปลว่าสารละลายเข้มข้นที่สุดเมื่อเทียบทุกอุณหภูมิ","formula":"","code":"G2U2L1S3"},{"title":"สภาพละลายได้","body":"สภาพละลายได้คือปริมาณสูงสุดของตัวละลายที่ละลายในตัวทำละลายปริมาณกำหนด ณ อุณหภูมิที่ระบุ ใช้กราฟสภาพละลายได้ช่วยเปรียบเทียบ","example":"อ่านค่าจากกราฟ g ตัวละลายต่อ 100 g น้ำ","mis":"ต้องอ่านหน่วยและอุณหภูมิให้ถูก","formula":"","code":"G2U2L1S4"},{"title":"อุณหภูมิกับของแข็ง","body":"ของแข็งหลายชนิดละลายได้มากขึ้นเมื่ออุณหภูมิสูง แต่ไม่ใช่ทุกชนิด รูปร่างกราฟของแต่ละสารต่างกัน","example":"KNO₃ มีสภาพละลายได้เพิ่มมากเมื่ออุณหภูมิสูงขึ้น","mis":"อย่าเหมารวมกฎเดียวกับสารทุกชนิด","formula":"","code":"G2U2L1S5"},{"title":"อุณหภูมิกับแก๊ส","body":"แก๊สหลายชนิดละลายในของเหลวได้น้อยลงเมื่ออุณหภูมิสูงขึ้น จึงพบฟองแก๊สออกจากน้ำอุ่นได้ง่ายขึ้น","example":"น้ำอุ่นมีออกซิเจนละลายน้อยลงโดยทั่วไป","mis":"พฤติกรรมแก๊สต่างจากของแข็งหลายชนิด","formula":"","code":"G2U2L1S6"},{"title":"ความดันกับแก๊ส","body":"เมื่ออุณหภูมิคงที่ การเพิ่มความดันของแก๊สเหนือของเหลวโดยทั่วไปช่วยให้แก๊สละลายได้มากขึ้น","example":"น้ำอัดลมบรรจุ CO₂ ภายใต้ความดัน","mis":"เปิดฝาแล้วความดันลดจึงเกิดฟอง","formula":"","code":"G2U2L1S7"},{"title":"เลือกเงื่อนไขการละลาย","body":"การละลายจริงต้องพิจารณาชนิดสาร อุณหภูมิ ความดันสำหรับแก๊ส และปริมาณตัวทำละลายร่วมกัน","example":"การทำผลึกใช้การเปลี่ยนสภาพละลายได้","mis":"คนเร็วขึ้นทำให้ละลายเร็วขึ้นแต่ไม่จำเป็นต้องเปลี่ยนสภาพละลายได้สุดท้าย","formula":"","code":"G2U2L1S8"}],"G2U2L2":[{"title":"ความเข้มข้น","body":"ความเข้มข้นบอกสัดส่วนตัวละลายในสารละลาย ต้องระบุวิธีแสดงความเข้มข้นและหน่วยให้ชัด","example":"น้ำเกลือ 5% ต่างจาก 5 g/L","mis":"ตัวเลขเดียวไม่มีความหมายถ้าไม่รู้ฐาน","formula":"","code":"G2U2L2S1"},{"title":"ร้อยละโดยมวล","body":"คำนวณจากมวลตัวละลายหารด้วยมวลสารละลายแล้วคูณ 100 มวลสารละลาย = มวลตัวละลาย + มวลตัวทำละลาย","example":"เกลือ 10 g ในน้ำ 90 g → สารละลาย 100 g → 10% โดยมวล","mis":"อย่าใช้มวลตัวทำละลายเป็นตัวส่วน","formula":"%w/w = (มวลตัวละลาย/มวลสารละลาย)×100","code":"G2U2L2S2"},{"title":"ร้อยละโดยปริมาตร","body":"ใช้ปริมาตรตัวละลายต่อปริมาตรสารละลาย ×100 เหมาะกับของเหลวผสมของเหลวตามบริบท","example":"เอทานอล 20 mL ในสารละลายสุดท้าย 100 mL = 20% v/v","mis":"ปริมาตรสารละลายสุดท้ายเป็นตัวส่วน","formula":"%v/v = (ปริมาตรตัวละลาย/ปริมาตรสารละลาย)×100","code":"G2U2L2S3"},{"title":"ร้อยละโดยมวลต่อปริมาตร","body":"ใช้มวลตัวละลายเป็นกรัมต่อปริมาตรสารละลายเป็นมิลลิลิตรแล้วคูณ 100","example":"กลูโคส 5 g ในสารละลาย 100 mL = 5% m/v","mis":"อย่าใช้ปริมาตรตัวทำละลายแทนสารละลาย","formula":"%m/v = (g ตัวละลาย/mL สารละลาย)×100","code":"G2U2L2S4"},{"title":"เตรียมสารละลาย","body":"คำนวณปริมาณตัวละลายก่อน ชั่ง/ตวงอย่างแม่นยำ ละลาย แล้วปรับปริมาตรสารละลายถึงค่าที่กำหนด","example":"เตรียม 10% m/v 200 mL ต้องใช้ตัวละลาย 20 g แล้วปรับปริมาตรสุดท้ายเป็น 200 mL","mis":"อย่าเติมน้ำ 200 mL แล้วคิดว่าปริมาตรสุดท้ายเท่ากันเสมอ","formula":"","code":"G2U2L2S5"},{"title":"การเจือจาง","body":"การเติมตัวทำละลายทำให้ปริมาตรสารละลายเพิ่ม ความเข้มข้นลด แต่ปริมาณตัวละลายคงเดิมหากไม่มีการสูญเสีย","example":"น้ำหวานเติมน้ำรสจางลง","mis":"การเจือจางไม่ทำให้ตัวละลายหาย","formula":"","code":"G2U2L2S6"},{"title":"เลือกหน่วยให้ตรงสถานการณ์","body":"ต้องอ่านโจทย์ว่าให้มวลหรือปริมาตร และต้องการความเข้มข้นแบบใด การแปลงหน่วยผิดทำให้คำตอบผิดแม้สูตรถูก","example":"mL กับ L ต้องแปลงก่อนใช้บางสูตร","mis":"ตรวจหน่วยทุกครั้งก่อนแทนค่า","formula":"","code":"G2U2L2S7"}],"G2U3L1":[{"title":"ภาพรวมระบบหมุนเวียนเลือด","body":"ระบบประกอบด้วยหัวใจ หลอดเลือด และเลือด ทำงานร่วมกันลำเลียงออกซิเจน สารอาหาร ของเสีย ฮอร์โมน และช่วยรักษาสภาวะภายใน","example":"เลือดต้องไหลผ่านทั้งปอดและเนื้อเยื่อ","mis":"อย่ามองหัวใจแยกจากหลอดเลือดและเลือด","formula":"","code":"G2U3L1S1"},{"title":"พลาสมา","body":"พลาสมาเป็นของเหลวส่วนใหญ่ของเลือด มีน้ำ โปรตีน เกลือแร่ สารอาหาร ฮอร์โมน และของเสียละลายหรือแขวนลอย","example":"ยูเรียเดินทางในพลาสมาไปยังไต","mis":"พลาสมาไม่ใช่น้ำล้วน","formula":"","code":"G2U3L1S2"},{"title":"เม็ดเลือดแดง","body":"เม็ดเลือดแดงมีฮีโมโกลบินช่วยจับออกซิเจน รูปร่างเหมาะต่อการแลกเปลี่ยนแก๊สและผ่านหลอดเลือดฝอย","example":"เม็ดเลือดแดงต่ำทำให้ความสามารถลำเลียงออกซิเจนลด","mis":"อย่าสรุปว่าจำนวนเม็ดเลือดแดงมากที่สุดยิ่งดีเสมอ","formula":"","code":"G2U3L1S3"},{"title":"เม็ดเลือดขาว","body":"เม็ดเลือดขาวมีหลายชนิด ทำหน้าที่เกี่ยวกับภูมิคุ้มกัน ป้องกันและกำจัดเชื้อโรคหรือสิ่งแปลกปลอม","example":"เพิ่มขึ้นบางกรณีเมื่อร่างกายตอบสนองต่อการติดเชื้อ","mis":"เม็ดเลือดขาวไม่ได้ขนส่งออกซิเจน","formula":"","code":"G2U3L1S4"},{"title":"เกล็ดเลือด","body":"เกล็ดเลือดและโปรตีนการแข็งตัวช่วยสร้างลิ่มเลือดลดการเสียเลือดเมื่อหลอดเลือดบาดเจ็บ","example":"บาดแผลเล็กหยุดเลือดได้จากกระบวนการห้ามเลือด","mis":"เกล็ดเลือดไม่ใช่เม็ดเลือดแดงขนาดเล็ก","formula":"","code":"G2U3L1S5"},{"title":"หลอดเลือดแดง","body":"นำเลือดออกจากหัวใจ ผนังหนา ยืดหยุ่น และรับความดันสูง","example":"เอออร์ตาเป็นหลอดเลือดแดงใหญ่","mis":"ชื่อ artery บอกทิศทาง ไม่ได้บอกออกซิเจน","formula":"","code":"G2U3L1S6"},{"title":"หลอดเลือดดำ","body":"นำเลือดกลับเข้าสู่หัวใจ ความดันต่ำกว่า หลายบริเวณโดยเฉพาะแขนขามีลิ้นช่วยลดการไหลย้อน","example":"การหดตัวของกล้ามเนื้อช่วยดันเลือดดำกลับหัวใจ","mis":"ไม่ใช่หลอดเลือดดำทุกเส้นมีลิ้น","formula":"","code":"G2U3L1S7"},{"title":"หลอดเลือดฝอย","body":"ผนังบางประมาณชั้นเซลล์เดียว พื้นที่รวมมากและเลือดไหลช้าลง เหมาะต่อการแลกเปลี่ยนสาร","example":"ออกซิเจนแพร่จากเลือดสู่เซลล์บริเวณเนื้อเยื่อ","mis":"ผนังบางไม่ได้หมายความว่าไม่มีความแข็งแรง","formula":"","code":"G2U3L1S8"},{"title":"หัวใจสี่ห้อง","body":"ห้องบนขวารับเลือดจากร่างกาย ห้องล่างขวาส่งไปปอด ห้องบนซ้ายรับจากปอด ห้องล่างซ้ายส่งทั่วร่างกาย","example":"จำเป็นต้องเชื่อม “รับจากไหน–ส่งไปไหน”","mis":"อย่าจำขวา/ซ้ายจากภาพโดยไม่ดูทิศเลือด","formula":"","code":"G2U3L1S9"},{"title":"ลิ้นหัวใจและความหนาผนัง","body":"ลิ้นหัวใจช่วยให้เลือดไหลทิศเดียว ห้องล่างซ้ายผนังหนาที่สุดเพราะต้องสร้างความดันส่งเลือดทั่วร่างกาย","example":"ลิ้นผิดปกติอาจทำให้เลือดไหลย้อน","mis":"ผนังหนาไม่ใช่เพราะมีเลือดมากกว่า","formula":"","code":"G2U3L1S10"},{"title":"วงจรหัวใจ–ปอด","body":"ห้องล่างขวา → pulmonary artery → ปอด → pulmonary vein → ห้องบนซ้าย เป็นวงจรแลกเปลี่ยนแก๊ส","example":"pulmonary artery มีเลือดออกซิเจนน้อยกว่า pulmonary vein","mis":"artery/vein เรียกตามทิศเทียบหัวใจ","formula":"","code":"G2U3L1S11"},{"title":"วงจรหัวใจ–ร่างกาย","body":"ห้องล่างซ้าย → aorta → เนื้อเยื่อ → vena cava → ห้องบนขวา ลำเลียงออกซิเจน/สารอาหารและรับของเสีย","example":"เอออร์ตารับแรงดันสูงจากห้องล่างซ้าย","mis":"วงจรสองส่วนต่อกันเป็นระบบเดียว","formula":"","code":"G2U3L1S12"},{"title":"วงจรเต็ม","body":"ร่างกาย → เวนาคาวา → บนขวา → ล่างขวา → pulmonary artery → ปอด → pulmonary vein → บนซ้าย → ล่างซ้าย → aorta → ร่างกาย","example":"เริ่มเขียนจากจุดไหนก็ได้ถ้าทิศทางต่อเนื่องถูก","mis":"วงจรไม่มีจุดเริ่มตามธรรมชาติ","formula":"","code":"G2U3L1S13"},{"title":"ชีพจร","body":"ชีพจรเกิดจากคลื่นความดันในหลอดเลือดแดงสัมพันธ์กับการบีบตัวของหัวใจ อัตราชีพจรเปลี่ยนตามกิจกรรม อารมณ์ สุขภาพ และบุคคล","example":"หลังวิ่งชีพจรมักเพิ่ม","mis":"ชีพจรไม่เท่ากับความดันโลหิต","formula":"","code":"G2U3L1S14"},{"title":"การทดลองชีพจร","body":"วัดขณะพักหลายครั้ง ทำกิจกรรมที่กำหนดเวลา/ความหนักเหมือนกัน แล้ววัดหลังทำกิจกรรมด้วยวิธีเดียวกัน ใช้ค่าเฉลี่ยและเปรียบเทียบ","example":"พัก 5 นาที วัด 3 ครั้ง → วิ่งอยู่กับที่ 1 นาที → วัด 3 ครั้ง","mis":"อย่าเปลี่ยนทั้งชนิดกิจกรรมและเวลาพร้อมกันถ้าทดสอบผลของกิจกรรม","formula":"","code":"G2U3L1S15"},{"title":"การดูแลระบบ","body":"ออกกำลังกายเหมาะสม กินอาหารสมดุล พักผ่อน ไม่สูบบุหรี่ และควบคุมปัจจัยเสี่ยงช่วยรักษาสุขภาพหัวใจและหลอดเลือด","example":"กิจกรรมแอโรบิกช่วยฝึกระบบหัวใจและหลอดเลือด","mis":"ไม่ควรใช้ค่าชีพจรครั้งเดียววินิจฉัยโรค","formula":"","code":"G2U3L1S16"}],"G2U3L2":[{"title":"เส้นทางอากาศ","body":"อากาศเข้าสู่จมูก ผ่านคอหอย กล่องเสียง หลอดลมคอ หลอดลมใหญ่ หลอดลมฝอย และไปยังถุงลมปอด","example":"ขนและเมือกในจมูกช่วยกรองอนุภาค","mis":"อากาศไม่ได้เข้าสู่ปอดผ่านหลอดอาหาร","formula":"","code":"G2U3L2S1"},{"title":"ถุงลมปอด","body":"ถุงลมมีผนังบาง ชุ่มชื้น และมีหลอดเลือดฝอยจำนวนมาก พื้นที่ผิวรวมสูงจึงเหมาะต่อการแลกเปลี่ยนแก๊ส","example":"ถุงลมจำนวนมากเพิ่มพื้นที่ผิว","mis":"ผนังหนาจะทำให้การแพร่ช้าลง","formula":"","code":"G2U3L2S2"},{"title":"การแลกเปลี่ยนแก๊ส","body":"ออกซิเจนแพร่จากอากาศในถุงลมเข้าสู่เลือด ส่วนคาร์บอนไดออกไซด์แพร่จากเลือดเข้าสู่ถุงลมตามความแตกต่างของความดันย่อย/ความเข้มข้น","example":"เลือดที่ผ่านปอดมีออกซิเจนเพิ่ม","mis":"การแลกเปลี่ยนไม่ใช่การสูบแก๊สด้วยถุงลม","formula":"","code":"G2U3L2S3"},{"title":"หายใจเข้า","body":"กะบังลมหดตัวเลื่อนต่ำ กล้ามเนื้อระหว่างซี่โครงช่วยยกทรวงอก ปริมาตรช่องอกเพิ่ม ความดันในปอดลด อากาศไหลเข้า","example":"ใช้แบบจำลองขวดกับลูกโป่งแสดงการเปลี่ยนปริมาตร","mis":"ปอดไม่ได้ดูดอากาศด้วยกล้ามเนื้อของปอดเอง","formula":"","code":"G2U3L2S4"},{"title":"หายใจออก","body":"กะบังลมคลายตัวและทรวงอกกลับ ขนาดช่องอกลด ความดันในปอดเพิ่ม อากาศไหลออก ในการหายใจแรงมีกล้ามเนื้ออื่นช่วย","example":"หายใจออกปกติส่วนใหญ่เป็นกระบวนการค่อนข้าง passive","mis":"อย่าสลับทิศการเคลื่อนของกะบังลม","formula":"","code":"G2U3L2S5"},{"title":"อัตราการหายใจและกิจกรรม","body":"เมื่อออกกำลังกาย เซลล์ใช้พลังงานมากขึ้น ต้องการออกซิเจนและสร้าง CO₂ มากขึ้น ระบบหายใจและหมุนเวียนจึงทำงานเพิ่ม","example":"วัดการหายใจก่อน–หลังวิ่ง","mis":"อัตราหายใจสูงไม่บอกสาเหตุเดียว","formula":"","code":"G2U3L2S6"},{"title":"ความจุปอดและการวัด","body":"ปริมาตรอากาศที่หายใจเข้าออกมีหลายชนิด การวัดแบบง่ายใช้เปรียบเทียบได้แต่ต้องควบคุมวิธีและทำซ้ำ","example":"เปรียบเทียบปริมาตรเป่าลูกโป่งไม่ใช่การวัดทางคลินิกที่แม่นยำ","mis":"ขนาดร่างกายมีผล จึงเปรียบเทียบคนต้องระวัง","formula":"","code":"G2U3L2S7"},{"title":"การดูแลระบบหายใจ","body":"หลีกเลี่ยงควันบุหรี่ ฝุ่น PM และสารระคายเคือง ออกกำลังกายและป้องกันการติดเชื้อช่วยรักษาการทำงานของระบบ","example":"หน้ากากที่เหมาะช่วยลดการรับอนุภาค","mis":"สูบบุหรี่กระทบทั้งทางเดินหายใจและหลอดเลือด","formula":"","code":"G2U3L2S8"}],"G2U3L3":[{"title":"ของเสียจากเมแทบอลิซึม","body":"เซลล์สร้างของเสีย เช่น ยูเรียจากการสลายโปรตีนและคาร์บอนไดออกไซด์จากการหายใจระดับเซลล์ ระบบต่าง ๆ ช่วยกำจัดของเสียเหล่านี้","example":"ปอดกำจัด CO₂ ส่วนไตกำจัดยูเรียในปัสสาวะ","mis":"ระบบขับถ่ายไม่ได้หมายถึงอุจจาระอย่างเดียว","formula":"","code":"G2U3L3S1"},{"title":"ไต","body":"ไตรับเลือดจำนวนมากเพื่อกรองและปรับองค์ประกอบของของเหลว ช่วยควบคุมน้ำ เกลือแร่ กรด-เบส และกำจัดของเสีย","example":"เลือดเข้าสู่ไตทางหลอดเลือดแดงไต","mis":"ไตไม่ใช่ถุงเก็บปัสสาวะ","formula":"","code":"G2U3L3S2"},{"title":"หน่วยไต","body":"หน่วยไตเป็นหน่วยโครงสร้างและหน้าที่ มีส่วนกรองและท่อที่เกิดการดูดกลับ/หลั่งสาร ทำให้ของเหลวเปลี่ยนเป็นปัสสาวะ","example":"สารที่ร่างกายต้องการจำนวนมากถูกดูดกลับ","mis":"ของเหลวที่กรองครั้งแรกไม่เท่ากับปัสสาวะสุดท้าย","formula":"","code":"G2U3L3S3"},{"title":"การกรอง","body":"น้ำและสารโมเลกุลเล็กจำนวนหนึ่งถูกกรองจากเลือดเข้าสู่หน่วยไต ขณะที่เม็ดเลือดและโปรตีนขนาดใหญ่ปกติไม่ผ่านมาก","example":"โปรตีนจำนวนมากในปัสสาวะอาจบ่งชี้ความผิดปกติ","mis":"การกรองไม่ใช่การเลือกของเสียอย่างเดียว","formula":"","code":"G2U3L3S4"},{"title":"การดูดกลับ","body":"น้ำ กลูโคส ไอออน และสารจำเป็นถูกดูดกลับเข้าสู่เลือดตามความต้องการ ทำให้ร่างกายไม่สูญเสียสารสำคัญมากเกินไป","example":"กลูโคสปกติถูกดูดกลับเกือบหมด","mis":"อย่าคิดว่าทุกสิ่งที่ถูกกรองต้องถูกขับทิ้ง","formula":"","code":"G2U3L3S5"},{"title":"เส้นทางปัสสาวะ","body":"ปัสสาวะจากไตไหลผ่านท่อไต เก็บที่กระเพาะปัสสาวะ และออกทางท่อปัสสาวะ","example":"ไต → ท่อไต → กระเพาะปัสสาวะ → ท่อปัสสาวะ","mis":"ท่อไตกับท่อปัสสาวะเป็นคนละส่วน","formula":"","code":"G2U3L3S6"},{"title":"สมดุลน้ำ","body":"เมื่อร่างกายขาดน้ำ ไตมีแนวโน้มดูดกลับน้ำมากขึ้น ทำให้ปัสสาวะปริมาตรลดและเข้มขึ้น; เมื่อรับน้ำมากแนวโน้มตรงข้าม","example":"ปัสสาวะตอนเช้ามักเข้มกว่า","mis":"สีปัสสาวะมีหลายสาเหตุ ไม่ใช้วินิจฉัยเดี่ยว","formula":"","code":"G2U3L3S7"},{"title":"การดูแลไต","body":"ดื่มน้ำพอเหมาะ ไม่กลั้นปัสสาวะนาน ใช้ยาอย่างถูกต้อง ควบคุมความดันและน้ำตาลช่วยลดความเสี่ยงต่อไต","example":"ยาบางชนิดใช้เกินขนาดทำลายไตได้","mis":"ดื่มน้ำมากผิดปกติไม่ใช่วิธีรักษาโรคไต","formula":"","code":"G2U3L3S8"}],"G2U3L4":[{"title":"หน้าที่ระบบประสาท","body":"ระบบประสาทรับสิ่งเร้า ประมวลข้อมูล และสั่งการตอบสนองอย่างรวดเร็ว เชื่อมการทำงานของอวัยวะต่าง ๆ","example":"แตะของร้อนแล้วดึงมือ","mis":"ระบบประสาทไม่ได้ทำงานแยกจากระบบฮอร์โมน","formula":"","code":"G2U3L4S1"},{"title":"เซลล์ประสาท","body":"เดนไดรต์รับสัญญาณ ตัวเซลล์ประมวล/ดำรงชีวิต และแอกซอนส่งสัญญาณไปยังเซลล์อื่น","example":"แอกซอนยาวช่วยส่งสัญญาณระยะไกล","mis":"เซลล์ประสาทไม่ได้เป็นสายไฟตรง ๆ","formula":"","code":"G2U3L4S2"},{"title":"ไซแนปส์","body":"ปลายแอกซอนสื่อสารกับเซลล์ถัดไปผ่านไซแนปส์ โดยสารสื่อประสาทถูกปล่อยและจับตัวรับ ทำให้สัญญาณถ่ายทอดต่อ","example":"ยาบางชนิดออกฤทธิ์ต่อสารสื่อประสาท","mis":"สารสื่อประสาทไม่ได้เหมือนกันทุกชนิด","formula":"","code":"G2U3L4S3"},{"title":"สมองส่วนสำคัญ","body":"สมองใหญ่เกี่ยวกับการคิด ความจำ การรับรู้และการเคลื่อนไหวโดยสมัครใจ; สมองน้อยช่วยประสานการเคลื่อนไหว/สมดุล; ก้านสมองควบคุมหน้าที่พื้นฐานหลายอย่าง","example":"สมองหลายส่วนทำงานร่วมกัน","mis":"อย่าจับคู่หน้าที่หนึ่งกับส่วนเดียวอย่างเด็ดขาด","formula":"","code":"G2U3L4S4"},{"title":"ไขสันหลัง","body":"ไขสันหลังเป็นทางผ่านสัญญาณระหว่างสมองกับร่างกายและเป็นศูนย์ของรีเฟล็กซ์บางชนิด","example":"การดึงมือจากของร้อนประมวลวงจรที่ไขสันหลังได้เร็ว","mis":"ไขสันหลังไม่ได้ทำงานโดยไม่ส่งข้อมูลไปสมองเลย","formula":"","code":"G2U3L4S5"},{"title":"ระบบประสาทรอบนอก","body":"เส้นประสาทรับความรู้สึกนำข้อมูลเข้าสู่ระบบส่วนกลาง และเส้นประสาทสั่งการนำคำสั่งออกไปยังกล้ามเนื้อหรือต่อม","example":"ตัวรับที่ผิวหนังส่งสัญญาณเข้าสมอง/ไขสันหลัง","mis":"เส้นประสาทไม่ได้เป็นหลอดเลือด","formula":"","code":"G2U3L4S6"},{"title":"รีเฟล็กซ์อาร์ก","body":"ลำดับพื้นฐานคือ สิ่งเร้า → ตัวรับ → เซลล์รับความรู้สึก → ศูนย์ประมวล → เซลล์สั่งการ → อวัยวะตอบสนอง","example":"เคาะเอ็นใต้สะบ้าทำให้ขากระดก","mis":"รีเฟล็กซ์ไม่แปลว่าไม่มีสมองเกี่ยวข้องกับการรับรู้ภายหลัง","formula":"","code":"G2U3L4S7"},{"title":"เวลาตอบสนอง","body":"เวลาตอบสนองแตกต่างตามความพร้อม ความสนใจ การฝึก และวิธีวัด การทดลองต้องทำซ้ำและควบคุมเงื่อนไข","example":"ทดสอบจับไม้บรรทัดหลายครั้งแล้วหาค่าเฉลี่ย","mis":"อย่าสรุปความสามารถของคนจากครั้งเดียว","formula":"","code":"G2U3L4S8"},{"title":"การดูแลระบบประสาท","body":"พักผ่อน ป้องกันการบาดเจ็บศีรษะ หลีกเลี่ยงสารเสพติด และดูแลสุขภาพจิตช่วยการทำงานของระบบประสาท","example":"สวมหมวกนิรภัยลดความรุนแรงการบาดเจ็บ","mis":"คาเฟอีนหรือสารต่าง ๆ มีผลต่อระบบประสาทไม่เหมือนกัน","formula":"","code":"G2U3L4S9"}],"G2U3L5":[{"title":"ระบบสืบพันธุ์เพศชาย","body":"อัณฑะสร้างอสุจิและฮอร์โมนเพศชาย อสุจิสุกและถูกลำเลียงผ่านท่อต่าง ๆ ต่อมช่วยสร้างของเหลวประกอบน้ำอสุจิ","example":"อสุจิสร้างในอัณฑะ","mis":"น้ำอสุจิไม่ใช่อสุจิล้วน","formula":"","code":"G2U3L5S1"},{"title":"ระบบสืบพันธุ์เพศหญิง","body":"รังไข่สร้างเซลล์ไข่และฮอร์โมน ท่อนำไข่รับเซลล์ไข่ มดลูกเป็นบริเวณฝังตัวและพัฒนาของเอ็มบริโอ","example":"การปฏิสนธิมักเกิดในท่อนำไข่","mis":"รังไข่ไม่ใช่บริเวณที่เอ็มบริโอฝังตัว","formula":"","code":"G2U3L5S2"},{"title":"ฮอร์โมนเพศ","body":"ฮอร์โมนจากสมองและอวัยวะสืบพันธุ์ทำงานร่วมกัน ควบคุมการเปลี่ยนแปลงวัยรุ่น การสร้างเซลล์สืบพันธุ์ และวงจรประจำเดือน","example":"เอสโตรเจนและโปรเจสเตอโรนมีบทบาทในวงจรเยื่อบุมดลูก","mis":"ฮอร์โมนหนึ่งชนิดไม่ได้ทำหน้าที่เดียวอย่างโดดเดี่ยว","formula":"","code":"G2U3L5S3"},{"title":"การตกไข่","body":"โดยทั่วไปมีเซลล์ไข่สุกและถูกปล่อยจากรังไข่ในช่วงหนึ่งของวงจร แต่เวลาแตกต่างระหว่างคนและรอบเดือน","example":"ไม่ควรใช้วันที่ตายตัวกับทุกคน","mis":"วันตกไข่ไม่เท่ากับวันเริ่มประจำเดือน","formula":"","code":"G2U3L5S4"},{"title":"ประจำเดือน","body":"เมื่อไม่มีการฝังตัว ระดับฮอร์โมนเปลี่ยนทำให้เยื่อบุมดลูกบางส่วนหลุดออกเป็นประจำเดือน","example":"วงจรนับจากวันแรกของประจำเดือน","mis":"ความยาววงจรแตกต่างกันได้","formula":"","code":"G2U3L5S5"},{"title":"การปฏิสนธิ","body":"อสุจิหนึ่งตัวรวมสารพันธุกรรมกับเซลล์ไข่เกิดไซโกต ซึ่งเริ่มแบ่งเซลล์ขณะเคลื่อนสู่มดลูก","example":"ปฏิสนธิมักเกิดในท่อนำไข่","mis":"ปฏิสนธิไม่ใช่การฝังตัว","formula":"","code":"G2U3L5S6"},{"title":"ไซโกต–เอ็มบริโอ–ทารกในครรภ์","body":"ไซโกตแบ่งเซลล์และพัฒนาเป็นเอ็มบริโอ ฝังตัวในเยื่อบุมดลูก แล้วพัฒนาระบบอวัยวะและเติบโต","example":"รกช่วยแลกเปลี่ยนสารระหว่างแม่กับทารกโดยเลือดไม่ผสมกันโดยตรงตามปกติ","mis":"อย่าสับสนรกกับถุงน้ำคร่ำ","formula":"","code":"G2U3L5S7"},{"title":"การคุมกำเนิดแบบกั้น","body":"ถุงยางขัดขวางอสุจิเข้าสู่ระบบสืบพันธุ์หญิงและช่วยลดความเสี่ยงโรคติดต่อทางเพศสัมพันธ์เมื่อใช้ถูกต้อง","example":"ใช้ทุกครั้งตั้งแต่เริ่มจนจบกิจกรรมทางเพศ","mis":"วิธีฮอร์โมนไม่ป้องกันโรคติดต่อ","formula":"","code":"G2U3L5S8"},{"title":"การคุมกำเนิดแบบฮอร์โมน/อุปกรณ์","body":"ยาคุม ฮอร์โมนฝัง/ฉีด และห่วงอนามัยทำงานต่างกลไกและประสิทธิภาพต่างกัน ควรใช้ข้อมูลสุขภาพและคำแนะนำทางการแพทย์","example":"วิธีที่เหมาะแต่ละคนต่างกัน","mis":"ไม่มีวิธีในชีวิตจริงที่ควรกล่าวว่าป้องกัน 100%","formula":"","code":"G2U3L5S9"},{"title":"การตัดสินใจอย่างรับผิดชอบ","body":"ความรู้เรื่องการยินยอม การป้องกันโรค การคุมกำเนิด และการเข้าถึงบริการสุขภาพเป็นส่วนสำคัญของสุขภาวะ","example":"ข้อมูลจากแหล่งสุขภาพที่เชื่อถือได้สำคัญ","mis":"หลีกเลี่ยงข้อมูลผิดจากการบอกต่อ","formula":"","code":"G2U3L5S10"}],"G2U4L1":[{"title":"ตำแหน่งและจุดอ้างอิง","body":"การบอกตำแหน่งต้องระบุจุดอ้างอิงหรือระบบพิกัด ตำแหน่งเดียวกันอาจมีค่าต่างเมื่อเปลี่ยนจุดอ้างอิง","example":"บอกว่าอยู่ห่างเสาธง 10 m ไปทางตะวันออก","mis":"คำว่า “ไกล” อย่างเดียวไม่พอ","formula":"","code":"G2U4L1S1"},{"title":"ระยะทาง","body":"ระยะทางคือความยาวทั้งหมดของเส้นทางที่วัตถุเคลื่อนที่ เป็นปริมาณสเกลาร์และไม่ติดทิศ","example":"เดิน 3 m ตะวันออกแล้ว 4 m เหนือ ระยะทาง 7 m","mis":"ระยะทางไม่อาจเป็นลบ","formula":"","code":"G2U4L1S2"},{"title":"การกระจัด","body":"การกระจัดคือเวกเตอร์จากตำแหน่งเริ่มต้นถึงตำแหน่งสุดท้าย มีขนาดและทิศทาง ไม่ขึ้นกับเส้นทาง","example":"เดินรอบสนามกลับจุดเดิม การกระจัด 0","mis":"การกระจัดไม่เท่าระยะทางเสมอ","formula":"","code":"G2U4L1S3"},{"title":"อัตราเร็ว","body":"อัตราเร็วเฉลี่ย = ระยะทางรวม/เวลารวม บอกว่าครอบคลุมระยะทางเร็วเพียงใด","example":"วิ่ง 100 m ใน 20 s → 5 m/s","mis":"อย่าใช้การกระจัดแทนระยะทางเมื่อถามอัตราเร็ว","formula":"อัตราเร็วเฉลี่ย = ระยะทางรวม/เวลารวม","code":"G2U4L1S4"},{"title":"ความเร็ว","body":"ความเร็วเฉลี่ย = การกระจัด/เวลารวม จึงมีทิศทาง วัตถุที่กลับจุดเดิมมีความเร็วเฉลี่ยเป็นศูนย์ได้","example":"วิ่งรอบสนาม 400 m กลับจุดเดิม ความเร็วเฉลี่ย 0","mis":"อัตราเร็วเฉลี่ยอาจไม่เป็นศูนย์แม้ความเร็วเฉลี่ยเป็นศูนย์","formula":"","code":"G2U4L1S5"},{"title":"กราฟการเคลื่อนที่","body":"กราฟตำแหน่ง-เวลาใช้ความชันบอกอัตราการเปลี่ยนตำแหน่ง เส้นราบหมายถึงตำแหน่งคงที่","example":"เส้นชันกว่าแปลว่าเคลื่อนที่เร็วกว่าในทิศตามเครื่องหมาย","mis":"อย่าดูความสูงของกราฟเป็นอัตราเร็วโดยตรง","formula":"","code":"G2U4L1S6"}],"G2U4L2":[{"title":"แรงเป็นเวกเตอร์","body":"แรงมีขนาดและทิศ หน่วยนิวตัน การรวมแรงต้องพิจารณาทิศทาง","example":"10 N ขวา + 6 N ซ้าย = 4 N ขวา","mis":"อย่าบวกขนาดโดยไม่ดูทิศ","formula":"","code":"G2U4L2S1"},{"title":"แผนภาพแรง","body":"เลือกวัตถุเป้าหมายแล้ววาดเฉพาะแรงที่กระทำต่อวัตถุนั้น เช่น น้ำหนัก แรงปกติ แรงดึง แรงเสียดทาน","example":"กล่องบนพื้นมีน้ำหนักลงและแรงปกติขึ้น","mis":"อย่าวาดความเร็วเป็นแรง","formula":"","code":"G2U4L2S2"},{"title":"แรงลัพธ์และการเคลื่อนที่","body":"แรงลัพธ์ศูนย์หมายถึงไม่มีการเปลี่ยนความเร็ว วัตถุอาจหยุดหรือเคลื่อนที่ด้วยความเร็วคงตัว","example":"รถวิ่งตรงคงที่มีแรงขับสมดุลแรงต้านโดยรวม","mis":"แรงลัพธ์ศูนย์ไม่ได้แปลว่าความเร็วศูนย์","formula":"","code":"G2U4L2S3"},{"title":"แรงเสียดทาน","body":"แรงเสียดทานต้านการเลื่อนหรือแนวโน้มการเลื่อน ขึ้นกับชนิดผิวและแรงกดระหว่างผิวในแบบจำลองพื้นฐาน","example":"ดอกยางเพิ่มแรงเสียดทานกับถนน","mis":"พื้นลื่นมีแรงเสียดทานน้อยแต่ไม่เป็นศูนย์เสมอ","formula":"","code":"G2U4L2S4"},{"title":"ความดันของของเหลว","body":"ความดันเพิ่มเมื่อความลึกเพิ่มและขึ้นกับความหนาแน่นของของเหลว ที่ระดับเดียวกันในของเหลวเดียวกันความดันเท่ากันโดยหลัก","example":"เขื่อนทำฐานหนาเพราะความดันน้ำลึกสูงกว่า","mis":"รูปทรงภาชนะไม่ใช่ปัจจัยตรงของความดันที่ความลึกเดียวกัน","formula":"","code":"G2U4L2S5"},{"title":"แรงพยุง","body":"ความดันด้านล่างมากกว่าด้านบนทำให้เกิดแรงพยุงขึ้น ขนาดสัมพันธ์กับน้ำหนักของของเหลวที่ถูกแทนที่","example":"เรือเหล็กลอยได้เพราะรูปทรงทำให้แทนที่น้ำมาก","mis":"วัตถุหนักไม่ได้จมเสมอ","formula":"","code":"G2U4L2S6"},{"title":"โมเมนต์ของแรง","body":"โมเมนต์ = แรง × ระยะตั้งฉากจากจุดหมุน การสมดุลการหมุนต้องพิจารณาโมเมนต์ตาม/ทวนเข็ม","example":"ผลักประตูไกลบานพับเปิดง่าย","mis":"ระยะที่ใช้ต้องเป็นระยะตั้งฉาก","formula":"โมเมนต์ = แรง × ระยะตั้งฉาก","code":"G2U4L2S7"},{"title":"สนามโน้มถ่วง","body":"มวลทุกก้อนดึงดูดกัน สนามโน้มถ่วงอธิบายบริเวณที่มวลอื่นได้รับแรง น้ำหนักคือแรงโน้มถ่วงที่กระทำต่อวัตถุ","example":"บนดวงจันทร์มวลเท่าเดิมแต่น้ำหนักลด","mis":"มวลกับน้ำหนักไม่ใช่สิ่งเดียวกัน","formula":"","code":"G2U4L2S8"},{"title":"สนามไฟฟ้า","body":"ประจุสร้างสนามไฟฟ้า ประจุทดสอบได้รับแรงตามชนิดและตำแหน่ง สนามแสดงได้ด้วยเส้นสนาม","example":"ประจุต่างชนิดดึงดูดกัน","mis":"เส้นสนามเป็นแบบจำลอง ไม่ใช่เส้นจริง","formula":"","code":"G2U4L2S9"},{"title":"สนามแม่เหล็ก","body":"แม่เหล็กและกระแสไฟฟ้าสร้างสนามแม่เหล็ก เข็มทิศเรียงตามสนามบริเวณนั้น","example":"โรยผงเหล็กช่วยเห็นรูปแบบสนาม","mis":"ผงเหล็กไม่ได้เป็นเส้นสนามจริง","formula":"","code":"G2U4L2S10"}],"G2U5L1":[{"title":"งานทางฟิสิกส์","body":"งานเกิดเมื่อมีแรงและวัตถุเกิดการกระจัดโดยแรงมีองค์ประกอบตามการกระจัด กรณีทิศเดียวกัน W=Fs หน่วยจูล","example":"ดันกล่อง 20 N ไป 5 m → 100 J","mis":"ถือของค้างอยู่ไม่มีการกระจัดจึงงานเชิงกลต่อวัตถุเป็นศูนย์","formula":"W = Fs","code":"G2U5L1S1"},{"title":"ทิศของแรงกับงาน","body":"ถ้าแรงตั้งฉากกับการกระจัด องค์ประกอบตามการกระจัดเป็นศูนย์จึงงานจากแรงนั้นเป็นศูนย์ในแบบจำลอง","example":"แรงสู่ศูนย์กลางในวงกลมสม่ำเสมอตั้งฉากความเร็ว","mis":"แรงมีอยู่ไม่ได้แปลว่าทำงานเสมอ","formula":"","code":"G2U5L1S2"},{"title":"กำลัง","body":"กำลังคืออัตราการทำงาน P=W/t หน่วยวัตต์ คนสองคนทำงานเท่ากันแต่ใช้เวลาต่างกันมีกำลังต่างกัน","example":"ขึ้นบันไดเท่ากันคนที่ใช้เวลาน้อยมีกำลังสูงกว่า","mis":"กำลังไม่ใช่พลังงานรวม","formula":"P = W/t","code":"G2U5L1S3"},{"title":"หลักเครื่องกลอย่างง่าย","body":"เครื่องกลช่วยเปลี่ยนขนาดหรือทิศของแรง โดยแลกกับระยะทางและมีการสูญเสียจริง ไม่สามารถสร้างพลังงานฟรี","example":"ใช้พื้นเอียงยาวขึ้นเพื่อลดแรงยก","mis":"ผ่อนแรงไม่ได้แปลว่างานลดเป็นศูนย์","formula":"","code":"G2U5L1S4"},{"title":"คาน","body":"คานหมุนรอบจุดหมุน ตำแหน่งแรงพยายาม แรงต้าน และจุดหมุนกำหนดชนิดและความได้เปรียบเชิงกล","example":"ชะแลงใช้แขนแรงยาว","mis":"ตำแหน่งองค์ประกอบสำคัญกว่าชื่ออุปกรณ์","formula":"","code":"G2U5L1S5"},{"title":"รอก","body":"รอกตายตัวช่วยเปลี่ยนทิศแรง ส่วนระบบรอกหลายเส้นช่วยแบ่งแรงตามจำนวนเส้นเชือกที่พยุงโหลดในอุดมคติ","example":"รอกยกของก่อสร้าง","mis":"แรงเสียดทานทำให้แรงจริงสูงกว่าอุดมคติ","formula":"","code":"G2U5L1S6"},{"title":"พื้นเอียงและเครื่องกลอื่น","body":"พื้นเอียง สกรู ลิ่ม ล้อและเพลาใช้หลักแลกแรงกับระยะทาง/การหมุนและช่วยให้งานสะดวกขึ้น","example":"ทางลาดรถเข็นใช้แรงน้อยลงแต่เคลื่อนระยะยาวขึ้น","mis":"อย่าตัดสินประสิทธิภาพจากแรงอย่างเดียว","formula":"","code":"G2U5L1S7"}],"G2U5L2":[{"title":"พลังงานและการเปลี่ยนรูป","body":"พลังงานคือความสามารถในการทำให้เกิดการเปลี่ยนแปลง สามารถถ่ายโอนและเปลี่ยนรูปได้","example":"ลูกบอลตกเปลี่ยนพลังงานศักย์เป็นจลน์","mis":"พลังงานไม่ใช่วัตถุที่เก็บเป็นก้อน","formula":"","code":"G2U5L2S1"},{"title":"พลังงานศักย์โน้มถ่วง","body":"ใกล้ผิวโลก Ep=mgh ขึ้นกับมวล ความเร่งโน้มถ่วง และความสูงจากระดับอ้างอิง","example":"มวล 2 kg สูง 5 m มี Ep มากกว่าที่สูง 2 m","mis":"ต้องระบุจุดอ้างอิงความสูง","formula":"Ep = mgh","code":"G2U5L2S2"},{"title":"พลังงานจลน์","body":"พลังงานจลน์ Ek=½mv² ขึ้นกับมวลและกำลังสองของความเร็ว จึงเพิ่มมากเมื่อความเร็วเพิ่ม","example":"ความเร็วเพิ่ม 2 เท่า → Ek เพิ่ม 4 เท่าเมื่อมวลเดิม","mis":"อย่าคิดว่าเพิ่มความเร็ว 2 เท่าแล้ว Ek เพิ่ม 2 เท่า","formula":"Ek = ½mv²","code":"G2U5L2S3"},{"title":"พลังงานกล","body":"พลังงานกลคือผลรวมพลังงานจลน์และพลังงานศักย์ในระบบที่พิจารณา หากไม่มีแรงไม่อนุรักษ์ทำงาน พลังงานกลคงที่","example":"รถไฟเหาะอุดมคติบนยอดมี Ep สูง ที่ต่ำมี Ek สูง","mis":"ระบบจริงมีแรงเสียดทาน","formula":"","code":"G2U5L2S4"},{"title":"กฎอนุรักษ์พลังงาน","body":"พลังงานรวมของระบบปิดไม่ถูกสร้างหรือทำลาย แต่เปลี่ยนรูปและถ่ายโอน เช่น พลังงานกลเป็นความร้อน/เสียง","example":"ลูกบอลเด้งต่ำลงเพราะพลังงานบางส่วนไปเป็นเสียง/ความร้อน","mis":"อย่าใช้คำว่าพลังงานหาย","formula":"","code":"G2U5L2S5"},{"title":"วิเคราะห์ระบบจริง","body":"ต้องกำหนดขอบเขตระบบ ระบุพลังงานเข้า ออก และสะสม แล้วติดตามเส้นทางพลังงานทั้งหมด","example":"จักรยาน: พลังงานเคมี → กล → ความร้อน/เสียง","mis":"ประสิทธิภาพ 100% พบยากในระบบจริง","formula":"","code":"G2U5L2S6"}],"G2U6L1":[{"title":"หลักการเลือกวิธีแยกสาร","body":"การแยกสารอาศัยความแตกต่างของสมบัติ เช่น ขนาดอนุภาค การละลาย จุดเดือด การยึดติดกับตัวกลาง และความหนาแน่น","example":"สารผสมหนึ่งชนิดอาจต้องใช้หลายขั้น","mis":"เลือกวิธีจากสมบัติ ไม่ใช่จากชื่อสารผสม","formula":"","code":"G2U6L1S1"},{"title":"การระเหยแห้ง","body":"ทำให้ตัวทำละลายระเหยเพื่อเหลือตัวละลายของแข็ง เหมาะเมื่อไม่ต้องการเก็บตัวทำละลายและตัวละลายทนความร้อนพอ","example":"ได้เกลือจากน้ำเกลือ","mis":"ถ้าต้องการเก็บน้ำด้วยควรใช้การกลั่น","formula":"","code":"G2U6L1S2"},{"title":"การตกผลึก","body":"สร้างสารละลายอิ่มตัวแล้วลดอุณหภูมิหรือระเหยบางส่วนให้ตัวละลายตกผลึก ความบริสุทธิ์เพิ่มได้เพราะสิ่งเจือปนบางส่วนยังอยู่ในสารละลาย","example":"ผลึกสารส้มจากสารละลายอิ่มตัว","mis":"ผลึกที่เกิดเร็วเกินอาจกักสิ่งเจือปน","formula":"","code":"G2U6L1S3"},{"title":"การกลั่นอย่างง่าย","body":"ให้ความร้อนจนส่วนที่ระเหยง่ายกลายเป็นไอ แล้ว
