ดีที่สุดทุกพื้นที่","formula":"","code":"G2U8L1S7"}],"G3U1L1":[{"title":"ปัญหากับคำถาม","body":"เริ่มจากนิยามปัญหาให้ชัดว่าเกิดกับใคร ที่ไหน เมื่อใด และผลกระทบอะไร จากนั้นเปลี่ยนเป็นคำถามที่เก็บข้อมูลได้","example":"ปัญหาขยะโรงเรียน → ขยะประเภทใดมากที่สุดและเกิดช่วงใด","mis":"ปัญหากว้างเกินไปทำให้หาแนวทางยาก","formula":"","code":"G3U1L1S1"},{"title":"รวบรวมหลักฐาน","body":"ใช้ข้อมูลปฐมภูมิ เช่น สำรวจ/วัด และข้อมูลทุติยภูมิจากแหล่งเชื่อถือ ตรวจที่มา วิธีเก็บ และความทันสมัย","example":"ชั่งขยะจริง 5 วันและอ่านข้อมูลเทศบาล","mis":"ข้อมูลบนอินเทอร์เน็ตไม่ได้มีคุณภาพเท่ากัน","formula":"","code":"G3U1L1S2"},{"title":"สร้างทางเลือก","body":"ใช้ความรู้หลายสาขาสร้างวิธีแก้มากกว่าหนึ่งแบบ คำนึงถึงเทคนิค งบ เวลา ผู้ใช้ และผลกระทบ","example":"ลดใช้ แยกขยะ ปรับระบบจัดซื้อ และให้แรงจูงใจ","mis":"อย่าตัดสินวิธีแรกก่อนเปรียบเทียบ","formula":"","code":"G3U1L1S3"},{"title":"เกณฑ์และข้อจำกัด","body":"กำหนดเกณฑ์ เช่น ประสิทธิภาพ ความปลอดภัย ต้นทุน สิ่งแวดล้อม และความเป็นธรรม พร้อมข้อจำกัดจริง","example":"งบ 20,000 บาทและต้องดำเนินใน 1 ภาคเรียน","mis":"เกณฑ์ต้องวัดหรือเปรียบเทียบได้","formula":"","code":"G3U1L1S4"},{"title":"ประเมินทางเลือก","body":"สร้างตารางตัดสินหรือวิเคราะห์ข้อดีข้อเสีย ใช้หลักฐานให้คะแนนและอธิบายเหตุผล","example":"ทางเลือก A ลดขยะได้มากแต่ต้นทุนสูง","mis":"การให้คะแนนต้องอธิบายฐานของคะแนน","formula":"","code":"G3U1L1S5"},{"title":"ทดสอบและปรับปรุง","body":"ทดลองขนาดเล็ก เก็บข้อมูลผลจริง เปรียบเทียบกับเกณฑ์ แล้วปรับแบบก่อนใช้เต็มรูปแบบ","example":"ทดลองถังแยกขยะหนึ่งอาคาร 2 สัปดาห์","mis":"ความล้มเหลวของต้นแบบเป็นข้อมูลเพื่อปรับปรุง","formula":"","code":"G3U1L1S6"},{"title":"ผลกระทบและจริยธรรม","body":"การแก้ปัญหาหนึ่งอาจสร้างผลกระทบใหม่ ต้องพิจารณาผู้ได้/เสียประโยชน์ ความเป็นส่วนตัว ความปลอดภัย และความยั่งยืน","example":"ระบบกล้องตรวจขยะมีประเด็นข้อมูลส่วนบุคคล","mis":"เทคโนโลยีที่ทำงานได้ไม่จำเป็นต้องเหมาะสมทางจริยธรรม","formula":"","code":"G3U1L1S7"}],"G3U2L1":[{"title":"โครโมโซม DNA และยีน","body":"DNA เป็นสารพันธุกรรม ยีนเป็นช่วงของ DNA ที่มีข้อมูลเกี่ยวข้องกับการสร้างผลิตภัณฑ์หรือควบคุมลักษณะ และ DNA จัดรวมกับโปรตีนเป็นโครโมโซม","example":"หนึ่งโครโมโซมมี DNA ยาวมากและมียีนจำนวนมาก","mis":"ยีนไม่ได้เป็นเม็ดเล็กที่เรียงอยู่นอก DNA","formula":"","code":"G3U2L1S1"},{"title":"แอลลีล","body":"ยีนตำแหน่งหนึ่งอาจมีรูปแบบต่างกันเรียกแอลลีล สิ่งมีชีวิตดิพลอยด์มีแอลลีลจากพ่อและแม่อย่างละหนึ่งสำหรับหลายยีน","example":"T และ t เป็นสัญลักษณ์แทนแอลลีลในแบบจำลอง","mis":"ตัวอักษรใหญ่ไม่ได้แปลว่าแอลลีลพบมากกว่า","formula":"","code":"G3U2L1S2"},{"title":"การทดลองเมนเดล","body":"เมนเดลเลือกถั่วที่ลักษณะต่างชัด ควบคุมการผสม และนับลูกจำนวนมาก พบอัตราส่วนที่อธิบายด้วยการแยกของปัจจัยพันธุกรรม","example":"รุ่น F2 ของลักษณะเด่นสมบูรณ์มักใกล้ 3:1","mis":"อัตราส่วนจริงไม่จำเป็นตรงเป๊ะเมื่อจำนวนตัวอย่างน้อย","formula":"","code":"G3U2L1S3"},{"title":"เด่นและด้อย","body":"ในแบบจำลองเด่นสมบูรณ์ แอลลีลเด่นแสดงฟีโนไทป์ในเฮเทอโรไซกัส ส่วนแอลลีลด้อยแสดงเมื่อไม่มีแอลลีลเด่น","example":"Tt แสดงลักษณะเด่น","mis":"เด่นไม่ได้แปลว่าดี แข็งแรง หรือพบมาก","formula":"","code":"G3U2L1S4"},{"title":"จีโนไทป์และฟีโนไทป์","body":"จีโนไทป์คือชุดแอลลีล เช่น TT Tt tt ส่วนฟีโนไทป์คือสิ่งที่สังเกตได้และอาจได้รับอิทธิพลจากสิ่งแวดล้อม","example":"TT กับ Tt อาจมีฟีโนไทป์เหมือนกัน","mis":"ฟีโนไทป์ไม่เปิดเผยจีโนไทป์ได้เสมอ","formula":"","code":"G3U2L1S5"},{"title":"ตารางพุนเนตต์","body":"เขียนแกมีตของพ่อแม่บนขอบตารางแล้วรวมแอลลีลในช่อง ใช้ทำนายความน่าจะเป็นของลูกแต่ละจีโนไทป์ ไม่ใช่ลำดับลูกจริง","example":"Tt×Tt → 1 TT : 2 Tt : 1 tt","mis":"ลูก 4 คนไม่ได้จำเป็นต้องได้ครบ 1:2:1","formula":"","code":"G3U2L1S6"},{"title":"ไมโทซิส","body":"เซลล์ร่างกายแบ่งเพื่อการเจริญ ซ่อมแซม และทดแทน ได้เซลล์ลูกที่มีจำนวนโครโมโซมเท่าเดิมโดยทั่วไป","example":"แผลหายจากการแบ่งเซลล์","mis":"ไมโทซิสไม่สร้างแกมีตเป็นหน้าที่หลัก","formula":"","code":"G3U2L1S7"},{"title":"ไมโอซิส","body":"สร้างเซลล์สืบพันธุ์ ลดจำนวนโครโมโซมครึ่งหนึ่งและสร้างความหลากหลายจากการจัดเรียง/แลกเปลี่ยนสารพันธุกรรม","example":"แกมีตมนุษย์มีโครโมโซมครึ่งเซลล์ร่างกาย","mis":"ไมโอซิสไม่ได้ให้เซลล์ลูกเหมือนกันทั้งหมด","formula":"","code":"G3U2L1S8"},{"title":"โรคทางพันธุกรรม","body":"เกิดจากการเปลี่ยนแปลงยีนหรือโครโมโซม รูปแบบถ่ายทอดแตกต่างกัน การวิเคราะห์ผังเครือญาติช่วยติดตามบางลักษณะ","example":"ธาลัสซีเมียเกี่ยวกับยีนการสร้างฮีโมโกลบิน","mis":"โรคทางพันธุกรรมไม่เท่ากับโรคที่พ่อแม่ต้องแสดงอาการเสมอ","formula":"","code":"G3U2L1S9"},{"title":"GMO","body":"สิ่งมีชีวิตดัดแปรพันธุกรรมถูกเปลี่ยน DNA ด้วยเทคโนโลยีเพื่อให้ได้ลักษณะเฉพาะ เช่น ต้านแมลงหรือสร้างสารบางชนิด การประเมินต้องดูประโยชน์ ความเสี่ยง และข้อมูลความปลอดภัยรายกรณี","example":"พืช Bt สร้างโปรตีนที่กระทบแมลงเป้าหมาย","mis":"คำว่า GMO ไม่บอกว่า “ดี” หรือ “อันตราย” โดยอัตโนมัติ","formula":"","code":"G3U2L1S10"}],"G3U3L1":[{"title":"คลื่นคืออะไร","body":"คลื่นถ่ายโอนพลังงานและข้อมูลจากที่หนึ่งไปอีกที่หนึ่ง โดยสสารของตัวกลางไม่จำเป็นต้องเคลื่อนตามคลื่นทั้งหมด","example":"คลื่นบนเชือกเคลื่อน แต่จุดบนเชือกสั่นรอบตำแหน่ง","mis":"อย่าสับสนการเคลื่อนของรูปคลื่นกับอนุภาค","formula":"","code":"G3U3L1S1"},{"title":"คลื่นตามขวางและตามยาว","body":"คลื่นตามขวางมีการสั่นตั้งฉากทิศเคลื่อนคลื่น ส่วนตามยาวสั่นขนานทิศคลื่น","example":"คลื่นเชือกตามขวาง เสียงในอากาศตามยาว","mis":"การจัดประเภทพิจารณาทิศการสั่นเทียบกับทิศคลื่น","formula":"","code":"G3U3L1S2"},{"title":"แอมพลิจูด","body":"แอมพลิจูดคือการกระจัดสูงสุดจากตำแหน่งสมดุลและสัมพันธ์กับพลังงานของคลื่นในหลายระบบ","example":"สั่นเชือกแรงขึ้นทำให้แอมพลิจูดมากขึ้น","mis":"แอมพลิจูดไม่ใช่ความยาวคลื่น","formula":"","code":"G3U3L1S3"},{"title":"ความยาวคลื่น","body":"ระยะระหว่างจุดที่มีเฟสเดียวกันติดกัน เช่น ยอดถึงยอด สัญลักษณ์ λ","example":"วัดยอดหนึ่งถึงยอดถัดไป","mis":"อย่าวัดยอดถึงท้องเป็นหนึ่งความยาวคลื่น","formula":"","code":"G3U3L1S4"},{"title":"ความถี่และคาบ","body":"ความถี่ f คือจำนวนรอบต่อวินาที หน่วย Hz คาบ T คือเวลาต่อหนึ่งรอบ และ T=1/f","example":"5 Hz → T=0.2 s","mis":"ความถี่สูงหมายถึงคาบสั้น","formula":"T = 1/f","code":"G3U3L1S5"},{"title":"อัตราเร็วคลื่น","body":"v=fλ เชื่อมอัตราเร็ว ความถี่ และความยาวคลื่น เมื่อคลื่นเปลี่ยนตัวกลางความถี่จากแหล่งกำเนิดมักคงเดิมแต่อัตราเร็วและ λ เปลี่ยน","example":"f=5 Hz, λ=2 m → v=10 m/s","mis":"อย่าเปลี่ยน f โดยไม่มีเหตุเมื่อผ่านตัวกลาง","formula":"v = fλ","code":"G3U3L1S6"},{"title":"คลื่นแม่เหล็กไฟฟ้า","body":"เกิดจากสนามไฟฟ้าและแม่เหล็กเปลี่ยนแปลง เดินทางในสุญญากาศได้และในสุญญากาศมีอัตราเร็วเท่ากันทุกช่วงสเปกตรัม","example":"แสงจากดวงอาทิตย์เดินทางผ่านอวกาศ","mis":"สีต่างกันไม่ได้เดินทางเร็วต่างกันในสุญญากาศ","formula":"","code":"G3U3L1S7"},{"title":"สเปกตรัมแม่เหล็กไฟฟ้า","body":"เรียงจากความถี่ต่ำไปสูง: วิทยุ ไมโครเวฟ อินฟราเรด แสงเห็นได้ อัลตราไวโอเลต เอกซ์ แกมมา พลังงานโฟตอนเพิ่มตามความถี่","example":"X-ray ใช้ภาพทางการแพทย์แต่ต้องจำกัดปริมาณรับ","mis":"คำว่า radiation ไม่ได้หมายถึงรังสีไอออไนซ์ทั้งหมด","formula":"","code":"G3U3L1S8"}],"G3U3L2":[{"title":"การเดินทางของแสง","body":"แสงเดินทางเป็นเส้นตรงในตัวกลางสม่ำเสมอและใช้รังสีแทนทิศการเดินทางในแบบจำลอง","example":"เงาเกิดเพราะแสงไม่อ้อมวัตถุใหญ่ชัดเจนในแบบเรขาคณิต","mis":"รังสีเป็นเส้นแบบจำลองไม่ใช่เส้นที่จับได้","formula":"","code":"G3U3L2S1"},{"title":"กฎการสะท้อน","body":"มุมตกกระทบเท่ากับมุมสะท้อนเมื่อวัดจากเส้นปกติ รังสีตกกระทบ รังสีสะท้อน และเส้นปกติอยู่ในระนาบเดียวกัน","example":"มุมตก 35° → มุมสะท้อน 35°","mis":"อย่าวัดจากผิวกระจก","formula":"","code":"G3U3L2S2"},{"title":"กระจกเงาราบ","body":"ให้ภาพเสมือน หัวตั้ง ขนาดเท่าวัตถุ ระยะภาพหลังกระจกเท่าระยะวัตถุหน้ากระจก และกลับซ้ายขวาเชิงการรับรู้","example":"ยืน 2 m หน้ากระจก ภาพอยู่ 2 m หลังกระจก","mis":"ภาพเสมือนไม่รวมแสงจริงบนฉาก","formula":"","code":"G3U3L2S3"},{"title":"กระจกเว้า","body":"รวมรังสีขนานสู่โฟกัส ให้ภาพจริงหรือเสมือนตามตำแหน่งวัตถุ ใช้รังสีหลักช่วยวาดภาพ","example":"วัตถุนอกจุดโฟกัสบางตำแหน่งได้ภาพจริงกลับหัว","mis":"อย่าจำชนิดภาพโดยไม่ดูตำแหน่งวัตถุ","formula":"","code":"G3U3L2S4"},{"title":"กระจกนูน","body":"กระจายรังสีเสมือนออกจากโฟกัสหลังกระจก ให้ภาพเสมือน หัวตั้ง และเล็กลงสำหรับวัตถุจริงทั่วไป จึงเห็นมุมกว้าง","example":"กระจกมองข้างรถ","mis":"ภาพเล็กทำให้กะระยะผิดได้","formula":"","code":"G3U3L2S5"},{"title":"การหักเห","body":"เมื่อแสงผ่านตัวกลางที่อัตราเร็วต่างกัน ทิศเปลี่ยนยกเว้นตกตั้งฉาก เข้าตัวกลางดัชนีสูงกว่าจะเบนเข้าใกล้เส้นปกติ","example":"หลอดในน้ำดูหัก","mis":"แสงไม่ได้หักเพราะชนผิวแล้วเด้งแบบสะท้อน","formula":"","code":"G3U3L2S6"},{"title":"ดัชนีหักเห","body":"n=c/v บอกว่าแสงช้าลงกว่าสุญญากาศเท่าใด ตัวกลางดัชนีสูงมีอัตราเร็วแสงต่ำกว่า","example":"แก้วมี n มากกว่าอากาศ","mis":"ดัชนีไม่ใช่ความหนาแน่นมวลโดยตรง","formula":"n = c/v","code":"G3U3L2S7"},{"title":"การสะท้อนกลับหมด","body":"เกิดเมื่อแสงเดินจากตัวกลางดัชนีสูงไปต่ำและมุมตกกระทบมากกว่ามุมวิกฤต แสงสะท้อนกลับทั้งหมด","example":"ใยแก้วนำแสงใช้หลักนี้","mis":"ไม่เกิดเมื่อเดินจากดัชนีต่ำไปสูง","formula":"","code":"G3U3L2S8"},{"title":"เลนส์นูน","body":"เลนส์นูนรวมแสง รังสีขนานผ่านโฟกัสหลังเลนส์ ให้ภาพจริงหรือเสมือนตามระยะวัตถุ","example":"แว่นขยายวางวัตถุภายในโฟกัสให้ภาพเสมือนขยาย","mis":"เลนส์นูนไม่ได้ให้ภาพขยายทุกตำแหน่ง","formula":"","code":"G3U3L2S9"},{"title":"เลนส์เว้า","body":"เลนส์เว้ากระจายแสง รังสีขนานดูเสมือนออกจากโฟกัสหน้าเลนส์ ให้ภาพเสมือน หัวตั้ง เล็กลงสำหรับวัตถุจริง","example":"แว่นแก้สายตาสั้นใช้เลนส์กระจายตามหลักพื้นฐาน","mis":"อย่าสลับโฟกัสจริง/เสมือน","formula":"","code":"G3U3L2S10"},{"title":"การมองเห็นและความสว่าง","body":"มองเห็นเมื่อแสงจากแหล่งกำเนิดหรือสะท้อนจากวัตถุเข้าสู่ตา แสงจ้าหรือมืดเกินทำให้ตาล้า ควรจัดแสงเหมาะและลดแสงสะท้อน","example":"หน้าจอในห้องมืดมากอาจทำให้ไม่สบายตา","mis":"ตาไม่ได้ปล่อยแสงออกไปเห็นวัตถุ","formula":"","code":"G3U3L2S11"}],"G3U4L1":[{"title":"แรงโน้มถ่วงในระบบสุริยะ","body":"ดวงอาทิตย์มีมวลมากจึงสร้างแรงโน้มถ่วงดึงดาวเคราะห์ ดาวเคราะห์และดวงจันทร์ก็ดึงดูดกัน แรงลดลงเมื่อระยะเพิ่ม","example":"แรงโน้มถ่วงยึดโลกในวงโคจร","mis":"อวกาศไม่ได้ไม่มีแรงโน้มถ่วง","formula":"","code":"G3U4L1S1"},{"title":"วงโคจร","body":"วัตถุโคจรเพราะมีความเร็วด้านข้างขณะถูกแรงโน้มถ่วงดึงเข้าศูนย์กลาง จึงเกิดการตกอย่างต่อเนื่องรอบวัตถุแม่","example":"ดาวเทียมตกไปรอบโลกโดยไม่ชนพื้น","mis":"ไม่มีแรงขับตลอดเวลาไม่ได้แปลว่าจะตกลงตรง ๆ","formula":"","code":"G3U4L1S2"},{"title":"แกนโลกเอียง","body":"แกนหมุนโลกเอียงประมาณ 23.5° เทียบระนาบโคจร ทำให้ซีกโลกได้รับมุมแสงและช่วงกลางวันต่างกันตลอดปี","example":"มิถุนายนซีกเหนือเอียงเข้าหาดวงอาทิตย์มากกว่า","mis":"ฤดูไม่เกิดจากระยะโลก-ดวงอาทิตย์เป็นหลัก","formula":"","code":"G3U4L1S3"},{"title":"ฤดู","body":"เมื่อซีกโลกเอียงเข้าหาดวงอาทิตย์ แสงตกตรงขึ้นและกลางวันนานขึ้น จึงรับพลังงานต่อพื้นที่มากขึ้น เกิดฤดูตรงข้ามกันระหว่างซีกโลก","example":"ธันวาคมซีกโลกใต้เป็นฤดูร้อน","mis":"ทั้งโลกไม่ได้มีฤดูเดียวกันพร้อมกัน","formula":"","code":"G3U4L1S4"},{"title":"เส้นทางปรากฏดวงอาทิตย์","body":"จุดขึ้น-ตกและความสูงเที่ยงวันเปลี่ยนตามฤดูกาลและละติจูด เป็นผลจากการหมุนโลก แกนเอียง และการโคจร","example":"เงาเที่ยงวันยาวต่างกันตามฤดู","mis":"การเคลื่อนปรากฏรายวันไม่ได้แปลว่าดวงอาทิตย์หมุนรอบโลก","formula":"","code":"G3U4L1S5"},{"title":"ข้างขึ้นข้างแรม","body":"ดวงจันทร์ครึ่งหนึ่งได้รับแสงเสมอ แต่เรามองเห็นส่วนสว่างต่างสัดส่วนเมื่อดวงจันทร์เปลี่ยนตำแหน่งรอบโลก","example":"เดือนดับอยู่ใกล้แนวโลก-ดวงอาทิตย์ด้านเดียวกัน","mis":"ไม่ใช่เงาโลกบัง ยกเว้นจันทรุปราคา","formula":"","code":"G3U4L1S6"},{"title":"น้ำขึ้นน้ำลง","body":"แรงโน้มถ่วงของดวงจันทร์ทำให้เกิดป่องน้ำสองด้านร่วมกับการเคลื่อนของระบบโลก-ดวงจันทร์ ดวงอาทิตย์เสริม/หักล้างบางส่วน","example":"วันเดือนดับ/วันเพ็ญเกิดน้ำเกิดช่วงต่างระดับมาก","mis":"เวลาน้ำขึ้นจริงขึ้นกับชายฝั่งและภูมิประเทศด้วย","formula":"","code":"G3U4L1S7"},{"title":"ดาวเทียม","body":"ดาวเทียมวงโคจรต่างระดับเหมาะกับงานต่างกัน เช่น สื่อสาร อุตุนิยมวิทยา สำรวจโลก นำทาง","example":"ดาวเทียมค้างฟ้าดูเหมือนอยู่ตำแหน่งเดิมเหนือเส้นศูนย์สูตร","mis":"ดาวเทียมทุกดวงไม่ได้ค้างฟ้า","formula":"","code":"G3U4L1S8"},{"title":"เทคโนโลยีอวกาศและข้อมูล","body":"กล้องโทรทรรศน์ ยานสำรวจ และดาวเทียมเก็บคลื่นแม่เหล็กไฟฟ้า/ข้อมูลจากระยะไกล ช่วยทดสอบแบบจำลองทางดาราศาสตร์และติดตามโลก","example":"ภาพดาวเทียมใช้ติดตามพายุ","mis":"ภาพสีดาวเทียมบางชนิดเป็นสีผสมเพื่อเน้นข้อมูล","formula":"","code":"G3U4L1S9"},{"title":"ขยะอวกาศและข้อจำกัด","body":"การใช้วงโคจรเพิ่มความเสี่ยงการชนและขยะอวกาศ ต้องออกแบบภารกิจ การลดเศษซาก และการจัดการเมื่อหมดอายุ","example":"ดาวเทียมบางดวงลดวงโคจรให้เผาไหม้ในบรรยากาศ","mis":"เทคโนโลยีอวกาศมีทั้งประโยชน์และต้นทุน","formula":"","code":"G3U4L1S10"}],"G3U5L1":[{"title":"การเปลี่ยนแปลงทางเคมี","body":"ปฏิกิริยาเคมีทำให้สารตั้งต้นเปลี่ยนเป็นผลิตภัณฑ์ที่มีองค์ประกอบหรือโครงสร้างใหม่ แตกต่างจากการเปลี่ยนสถานะทางกายภาพ","example":"เผาแมกนีเซียมเกิดสารใหม่","mis":"น้ำแข็งละลายไม่ใช่ปฏิกิริยาเคมี","formula":"","code":"G3U5L1S1"},{"title":"หลักฐานการเกิดปฏิกิริยา","body":"การเกิดแก๊ส ตะกอน สี กลิ่น แสง หรืออุณหภูมิเปลี่ยนอาจเป็นหลักฐาน แต่ควรพิจารณาร่วมกับบริบทเพราะบางการเปลี่ยนแปลงทางกายภาพก็ให้สัญญาณคล้ายกัน","example":"ฟองจากกรดกับโลหะเป็นแก๊สผลิตภัณฑ์","mis":"เดือดจากให้ความร้อนไม่ใช่หลักฐานเคมีเสมอ","formula":"","code":"G3U5L1S2"},{"title":"สมการข้อความ","body":"เขียนสารตั้งต้น → ผลิตภัณฑ์ช่วยสื่อสารว่าอะไรเปลี่ยนเป็นอะไร และเป็นฐานก่อนเรียนสมการเคมีเชิงสัญลักษณ์","example":"กรด + เบส → เกลือ + น้ำ","mis":"ลูกศรไม่ได้แปลว่าเท่ากับ","formula":"","code":"G3U5L1S3"},{"title":"กฎอนุรักษ์มวล","body":"ในระบบปิด มวลรวมก่อนและหลังปฏิกิริยาเท่ากันเพราะอะตอมไม่ได้หายหรือเกิดใหม่ เพียงจัดเรียงตัวใหม่","example":"ปฏิกิริยาในถุงปิดชั่งมวลเท่าเดิม","mis":"ระบบเปิดอาจมวลชั่งเปลี่ยนเพราะแก๊สเข้า/ออก","formula":"","code":"G3U5L1S4"},{"title":"คายและดูดความร้อน","body":"ปฏิกิริยาคายความร้อนถ่ายพลังงานสู่สิ่งแวดล้อม อุณหภูมิรอบระบบมักเพิ่ม; ดูดความร้อนรับพลังงาน อุณหภูมิมักลด","example":"ถุงประคบร้อน/เย็นบางชนิดใช้ปฏิกิริยา","mis":"อุณหภูมิเปลี่ยนต้องดูทิศพลังงานให้ถูก","formula":"","code":"G3U5L1S5"},{"title":"กรดและเบส","body":"สารละลายกรดและเบสมีสมบัติต่างกัน วัดด้วยตัวบ่งชี้หรือ pH ปฏิกิริยาการเป็นกลางระหว่างกรดกับเบสให้เกลือและน้ำตามกรณี","example":"HCl + NaOH → เกลือ + น้ำ","mis":"สารเป็นกลางไม่ได้แปลว่าไม่มีไอออน","formula":"","code":"G3U5L1S6"},{"title":"กรดกับโลหะ","body":"กรดหลายชนิดทำปฏิกิริยากับโลหะบางชนิดเกิดเกลือและแก๊สไฮโดรเจน อัตราขึ้นกับชนิดโลหะ ความเข้มข้น และพื้นที่ผิว","example":"สังกะสีกับกรดเกิดฟอง H₂","mis":"โลหะทุกชนิดไม่ได้ทำปฏิกิริยาเท่ากัน","formula":"","code":"G3U5L1S7"},{"title":"เบสกับโลหะบางชนิด","body":"เบสเข้มข้นบางชนิดทำปฏิกิริยากับโลหะบางประเภท เช่น อะลูมิเนียม ต้องทดลองด้วยความระมัดระวัง","example":"อะลูมิเนียมกับ NaOH ในเงื่อนไขเหมาะเกิดแก๊ส","mis":"อย่าเหมารวมเบสทุกชนิดกับโลหะทุกชนิด","formula":"","code":"G3U5L1S8"},{"title":"สนิมเหล็ก","body":"เหล็กเกิดออกซิเดชันเมื่อมีออกซิเจนและน้ำ/ความชื้น การเคลือบ ทาสี ชุบน้ำมัน หรือใช้โลหะป้องกันช่วยลดการสัมผัสหรือเปลี่ยนปฏิกิริยา","example":"ตะปูแห้งและไร้ออกซิเจนเกิดสนิมช้ากว่า","mis":"สนิมไม่ใช่เพียงเหล็กเปลี่ยนสี","formula":"","code":"G3U5L1S9"},{"title":"ประโยชน์และผลกระทบ","body":"ปฏิกิริยาใช้ผลิตอาหาร วัสดุ ยา และพลังงาน แต่ก็สร้างมลพิษ การกัดกร่อน หรือของเสีย การออกแบบกระบวนการต้องลดความเสี่ยง","example":"ตัวเร่งช่วยลดพลังงาน/เวลาบางกระบวนการ","mis":"ประโยชน์ทางเศรษฐกิจไม่ใช่เกณฑ์เดียว","formula":"","code":"G3U5L1S10"}],"G3U5L2":[{"title":"แนวคิดการเลือกวัสดุ","body":"เลือกวัสดุจากสมบัติที่เกี่ยวกับงาน เช่น ความแข็ง ความเหนียว การนำไฟฟ้า ความหนาแน่น ทนร้อน ทนสารเคมี ราคา และผลกระทบ","example":"ขวดน้ำต้องเบา ทนแตก และปลอดภัย","mis":"วัสดุแข็งที่สุดไม่ได้ดีที่สุดทุกงาน","formula":"","code":"G3U5L2S1"},{"title":"พอลิเมอร์","body":"โมเลกุลสายยาวเกิดจากหน่วยย่อยซ้ำ ทำให้ปรับสมบัติได้กว้าง เช่น ยืดหยุ่น ใส แข็ง หรือทนสารเคมี","example":"PE ใช้ถุง/ภาชนะหลายชนิด","mis":"พลาสติกทุกชนิดรีไซเคิลเหมือนกันไม่ได้","formula":"","code":"G3U5L2S2"},{"title":"เทอร์โมพลาสติกและเทอร์โมเซต","body":"เทอร์โมพลาสติกอ่อนตัวเมื่อร้อนและขึ้นรูปซ้ำได้หลายชนิด ส่วนเทอร์โมเซตมีโครงข่ายถาวรและไม่หลอมขึ้นรูปซ้ำง่าย","example":"ฝาขวดกับด้ามหม้ออาจใช้พอลิเมอร์ต่างกลุ่ม","mis":"ความร้อนสูงอาจทำให้สลายไม่ใช่หลอม","formula":"","code":"G3U5L2S3"},{"title":"เซรามิก","body":"วัสดุอนินทรีย์ที่ผ่านความร้อน มักแข็ง ทนสึก ทนร้อน และเป็นฉนวน แต่เปราะและแตกเมื่อกระแทก","example":"กระเบื้องและฉนวนไฟฟ้า","mis":"แข็งกับเหนียวเป็นคนละสมบัติ","formula":"","code":"G3U5L2S4"},{"title":"โลหะ","body":"พันธะโลหะทำให้โลหะหลายชนิดนำไฟฟ้า/ความร้อนดี เหนียวและขึ้นรูปได้ แต่ความหนาแน่นและการกัดกร่อนต่างกัน","example":"อะลูมิเนียมเบา เหล็กแข็งแรง ทองแดงนำไฟดี","mis":"โลหะทุกชนิดเป็นแม่เหล็กไม่ได้","formula":"","code":"G3U5L2S5"},{"title":"โลหะผสม","body":"ผสมโลหะหรือธาตุอื่นเพื่อปรับสมบัติ เช่น เพิ่มความแข็ง ทนกัดกร่อน หรือเปลี่ยนจุดหลอมเหลว","example":"สเตนเลสทนสนิมกว่าเหล็กกล้าบางชนิด","mis":"โลหะผสมไม่ใช่สารบริสุทธิ์","formula":"","code":"G3U5L2S6"},{"title":"วัสดุผสม","body":"รวมวัสดุสองชนิดขึ้นไปโดยยังมีเฟสต่างกัน เพื่อให้สมบัติรวมดีขึ้น เช่น เส้นใยรับแรงในเมทริกซ์","example":"คอนกรีตเสริมเหล็กและไฟเบอร์กลาส","mis":"สมบัติไม่ได้เป็นค่าเฉลี่ยง่าย ๆ","formula":"","code":"G3U5L2S7"},{"title":"ผลกระทบตลอดวงจรชีวิต","body":"ประเมินตั้งแต่การได้วัตถุดิบ การผลิต การขนส่ง การใช้งาน ไปจนถึงการซ่อม ใช้ซ้ำ รีไซเคิล หรือกำจัด","example":"วัสดุเบาอาจลดพลังงานขนส่ง","mis":"วัสดุรีไซเคิลได้แต่ไม่มีระบบเก็บก็อาจไม่ถูกรีไซเคิล","formula":"","code":"G3U5L2S8"}],"G3U6L1":[{"title":"วงจรไฟฟ้า","body":"กระแสไหลได้เมื่อมีเส้นทางปิดและแหล่งกำเนิดสร้างความต่างศักย์ วงจรประกอบด้วยแหล่งจ่าย สาย และอุปกรณ์ใช้พลังงาน","example":"สวิตช์เปิดทำให้วงจรขาดกระแสหยุด","mis":"คำว่า “ไฟไหลจากแบตเตอรี่หมด” ไม่ใช่แบบจำลองที่ดี","formula":"","code":"G3U6L1S1"},{"title":"กระแสไฟฟ้า","body":"กระแส I คืออัตราการไหลของประจุ I=Q/t หน่วยแอมแปร์ แอมมิเตอร์ต้องต่ออนุกรมและมีความต้านทานต่ำ","example":"ประจุ 10 C ผ่าน 2 s → 5 A","mis":"อย่าต่อแอมมิเตอร์คร่อมแหล่งจ่ายโดยตรง","formula":"I = Q/t","code":"G3U6L1S2"},{"title":"ทิศกระแสและอิเล็กตรอน","body":"ทิศกระแสแบบดั้งเดิมภายนอกแหล่งจ่ายกำหนดจากขั้วบวกไปลบ ขณะที่อิเล็กตรอนในโลหะเคลื่อนโดยเฉลี่ยจากลบไปบวก","example":"ใช้ทิศกระแสมาตรฐานในการวิเคราะห์วงจร","mis":"อย่าสลับทิศจนคำนวณเครื่องหมายหรือทิศทางในวงจรผิด","formula":"","code":"G3U6L1S3"},{"title":"ความต่างศักย์","body":"V คือพลังงานต่อประจุระหว่างสองจุด วัดด้วยโวลต์มิเตอร์ต่อขนานคร่อมอุปกรณ์","example":"แบตเตอรี่ 1.5 V ให้พลังงาน 1.5 J ต่อ 1 C โดยอุดมคติ","mis":"โวลต์มิเตอร์ไม่ได้วัดกระแส","formula":"","code":"G3U6L1S4"},{"title":"ความต้านทาน","body":"R บอกการขัดขวางกระแส ขึ้นกับวัสดุ รูปร่าง และอุณหภูมิ ตัวต้านทานใช้ควบคุมกระแสในวงจร","example":"ลวดยาว/บางมักต้านทานมากขึ้น","mis":"R ไม่ใช่การสูญเสียประจุ","formula":"","code":"G3U6L1S5"},{"title":"กฎของโอห์ม","body":"สำหรับตัวนำโอห์มิกที่อุณหภูมิคงที่ V=IR กราฟ V-I เป็นเส้นตรงผ่านจุดกำเนิดและความชันสัมพันธ์กับ R ตามแกนที่เลือก","example":"12 V กับ 6 Ω → 2 A","mis":"ต้องดูว่าแกนกราฟเป็น V เทียบ I หรือ I เทียบ V","formula":"V = IR","code":"G3U6L1S6"},{"title":"วงจรอนุกรม","body":"อุปกรณ์ต่อเส้นทางเดียว กระแสเท่ากันทุกจุด ความต่างศักย์รวมเท่าผลรวมคร่อมอุปกรณ์ และความต้านทานรวมเพิ่ม","example":"R 2Ω + 3Ω อนุกรม → 5Ω","mis":"แรงดันไม่ได้เท่ากันทุกตัวถ้า R ต่างกัน","formula":"","code":"G3U6L1S7"},{"title":"วงจรขนาน","body":"อุปกรณ์ต่อคร่อมจุดคู่เดียวกัน ความต่างศักย์แต่ละแขนงเท่ากับแหล่งจ่าย กระแสรวมเป็นผลรวมแขนง ความต้านทานรวมลดลง","example":"เครื่องใช้ในบ้านต่อขนาน","mis":"กระแสแขนงไม่จำเป็นเท่ากัน","formula":"","code":"G3U6L1S8"},{"title":"การต่อมิเตอร์","body":"แอมมิเตอร์อนุกรมกับส่วนที่วัดกระแส โวลต์มิเตอร์ขนานคร่อมส่วนที่วัดความต่างศักย์ ต้องเลือกช่วงวัดและขั้วให้เหมาะ","example":"วงจรทดลอง V-I ต้องวัดพร้อมกันหลายค่า","mis":"ต่อผิดอาจทำให้เครื่องมือเสียหาย","formula":"","code":"G3U6L1S9"},{"title":"ความปลอดภัย","body":"กระแสสูงทำให้ร้อนและอันตราย ฟิวส์/เบรกเกอร์ช่วยตัดเมื่อกระแสเกิน ฉนวนและสายดินช่วยลดความเสี่ยง","example":"ไม่จับอุปกรณ์ไฟฟ้าด้วยมือเปียก","mis":"แรงดันและกระแสทั้งคู่เกี่ยวข้องกับอันตราย","formula":"","code":"G3U6L1S10"}],"G3U6L2":[{"title":"กำลังไฟฟ้า","body":"กำลังคืออัตราการเปลี่ยน/ใช้พลังงาน P=VI หน่วยวัตต์ เครื่องกำลังสูงใช้พลังงานต่อเวลามากกว่าเมื่อทำงานที่ค่ากำหนด","example":"เครื่อง 1000 W ใช้พลังงาน 1000 J ต่อวินาที","mis":"กำลังไม่ใช่พลังงานรวม","formula":"P = VI","code":"G3U6L2S1"},{"title":"พลังงานไฟฟ้า","body":"E=Pt ถ้า P เป็น kW และ t เป็นชั่วโมง จะได้ kWh ซึ่งเป็นหน่วยที่ใช้คิดค่าไฟ","example":"1 kW เปิด 2 h = 2 kWh","mis":"kWh เป็นหน่วยพลังงาน ไม่ใช่กำลัง","formula":"E = Pt","code":"G3U6L2S2"},{"title":"ค่าไฟและการประหยัด","body":"พลังงานรวมขึ้นกับกำลังและเวลา จึงลดการใช้ได้ทั้งเลือกอุปกรณ์ประสิทธิภาพดีและลดเวลาทำงานที่ไม่จำเป็น","example":"แอร์ 1000 W เปิด 8 h ใช้มากกว่า 2000 W เปิด 1 h","mis":"อย่าดูแต่เลขวัตต์","formula":"","code":"G3U6L2S3"},{"title":"ตัวต้านทาน","body":"ใช้จำกัดกระแส แบ่งแรงดัน และกำหนดสภาวะวงจร เลือกค่าความต้านทานและกำลังวัตต์ให้เหมาะ","example":"ต่อ R กับ LED เพื่อจำกัดกระแส","mis":"ตัวต้านทานไม่สร้างพลังงาน","formula":"","code":"G3U6L2S4"},{"title":"ไดโอด","body":"รอยต่อสารกึ่งตัวนำยอมให้กระแสไหลดีในทิศ forward มากกว่า reverse ใช้เรียงกระแสและป้องกันกลับขั้ว","example":"LED เป็นไดโอดที่ปล่อยแสง","mis":"ไดโอดไม่ใช่สวิตช์สมบูรณ์แบบทุกเงื่อนไข","formula":"","code":"G3U6L2S5"},{"title":"LED","body":"LED ต้องต่อขั้วถูกและจำกัดกระแส สีต่างชนิดมีแรงดันตกคร่อมต่างกัน","example":"ต่อ LED กับตัวต้านทานอนุกรม","mis":"ต่อแบตเตอรี่ตรงโดยไม่มีการจำกัดกระแสอาจเสีย","formula":"","code":"G3U6L2S6"},{"title":"ตัวเก็บประจุ","body":"เก็บประจุและพลังงานในสนามไฟฟ้าระหว่างแผ่น ใช้กรอง หน่วงเวลา หรือเก็บพลังงานช่วงสั้น","example":"แฟลชกล้องใช้ตัวเก็บประจุ","mis":"ตัวเก็บประจุไม่เหมือนแบตเตอรี่","formula":"","code":"G3U6L2S7"},{"title":"ทรานซิสเตอร์","body":"อุปกรณ์สารกึ่งตัวนำใช้ควบคุมกระแส/แรงดัน เป็นสวิตช์หรือขยายสัญญาณ ทำให้วงจรดิจิทัลและอิเล็กทรอนิกส์สมัยใหม่เป็นไปได้","example":"สัญญาณเล็กควบคุมโหลดใหญ่ผ่านทรานซิสเตอร์","mis":"ไม่ควรเข้าใจเป็นสวิตช์กลธรรมดา","formula":"","code":"G3U6L2S8"},{"title":"วงจรประยุกต์","body":"การออกแบบวงจรต้องเชื่อมแหล่งจ่าย อุปกรณ์ควบคุม ตัวป้องกัน และโหลด พร้อมคำนวณค่าที่ไม่เกินพิกัด","example":"วงจร LED มีแหล่งจ่าย สวิตช์ R และ LED","mis":"ค่าพิกัดของอุปกรณ์สำคัญต่อความปลอดภัย","formula":"","code":"G3U6L2S9"}],"G3U7L1":[{"title":"องค์ประกอบชีวภาพและกายภาพ","body":"ระบบนิเวศมีสิ่งมีชีวิต เช่น ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย และปัจจัยกายภาพ เช่น แสง น้ำ อุณหภูมิ ดิน ทั้งสองส่วนมีปฏิสัมพันธ์กัน","example":"ปริมาณแสงมีผลต่อพืชน้ำและต่อผู้บริโภคต่อเนื่อง","mis":"อย่ามองสิ่งมีชีวิตแยกจากสิ่งแวดล้อม","formula":"","code":"G3U7L1S1"},{"title":"ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย","body":"ผู้ผลิตสร้างสารอินทรีย์จากพลังงานภายนอก ผู้บริโภครับพลังงานจากอาหาร ผู้ย่อยสลายย่อยซากคืนสารอาหารสู่ระบบ","example":"เห็ดราเป็นผู้ย่อยสลายหลายชนิด","mis":"ผู้ย่อยสลายไม่ได้ทำให้พลังงานหมุนเวียนกลับทั้งหมด","formula":"","code":"G3U7L1S2"},{"title":"โซ่อาหาร","body":"โซ่อาหารแสดงเส้นทางการถ่ายทอดพลังงานแบบเส้นเดียว ลูกศรชี้จากสิ่งที่ถูกกินไปยังผู้กิน","example":"หญ้า → ตั๊กแตน → กบ → งู","mis":"ลูกศรไม่ได้ชี้ว่าใครล่าใครจากผู้ล่าไปเหยื่อ","formula":"","code":"G3U7L1S3"},{"title":"สายใยอาหาร","body":"ในธรรมชาติสิ่งมีชีวิตกินอาหารหลายชนิด โซ่หลายเส้นเชื่อมเป็นสายใย การเปลี่ยนประชากรหนึ่งชนิดจึงกระทบหลายเส้นทาง","example":"กบลดอาจทำให้แมลงเพิ่มและผู้ล่ากบลด","mis":"อย่าทำนายผลจากเส้นทางเดียว","formula":"","code":"G3U7L1S4"},{"title":"การถ่ายทอดพลังงาน","body":"พลังงานลดลงในแต่ละลำดับการกินเพราะสิ่งมีชีวิตใช้หายใจ เคลื่อนไหว และสูญเป็นความร้อน จึงมีชีวมวล/จำนวนรองรับผู้บริโภคระดับสูงน้อยลง","example":"ผู้ผลิตต้องมีพลังงานมากเพื่อรองรับผู้บริโภค","mis":"พลังงานไม่หมุนเวียนเหมือนสาร","formula":"","code":"G3U7L1S5"},{"title":"การหมุนเวียนสาร","body":"ธาตุอาหารและสสารหมุนเวียนผ่านสิ่งมีชีวิตและสิ่งแวดล้อม ผู้ย่อยสลายมีบทบาทคืนสารอนินทรีย์","example":"คาร์บอนจากซากกลับสู่ระบบ","mis":"อย่าสับสนการหมุนเวียนสารกับการไหลพลังงาน","formula":"","code":"G3U7L1S6"},{"title":"การสะสมสารพิษ","body":"สารสลายยากบางชนิดสะสมในร่างกายและมีความเข้มข้นสูงขึ้นตามลำดับการกินเมื่อผู้ล่ากินเหยื่อจำนวนมาก","example":"ปรอทในห่วงโซ่อาหารน้ำ","mis":"สารทุกชนิดไม่ได้เกิด biomagnification","formula":"","code":"G3U7L1S7"},{"title":"ผู้ล่า–เหยื่อและการแข่งขัน","body":"ผู้ล่ากินเหยื่อ ส่วนการแข่งขันเกิดเมื่อทรัพยากรจำกัดและสิ่งมีชีวิตใช้ทรัพยากรเดียวกัน","example":"ต้นไม้แข่งขันแสงและน้ำ","mis":"การแข่งขันไม่ได้แปลว่าต้องต่อสู้โดยตรง","formula":"","code":"G3U7L1S8"},{"title":"พึ่งพา อิงอาศัย ปรสิต","body":"ภาวะพึ่งพาได้ประโยชน์ทั้งคู่ อิงอาศัยฝ่ายหนึ่งได้ประโยชน์อีกฝ่ายไม่ค่อยได้รับผล ปรสิตฝ่ายหนึ่งได้ประโยชน์อีกฝ่ายเสียประโยชน์","example":"เห็บกับสุนัขเป็นปรสิต","mis":"ต้องดูผลต่อทั้งสองฝ่าย","formula":"","code":"G3U7L1S9"}],"G3U7L2":[{"title":"ความหลากหลายทางพันธุกรรม","body":"ความแตกต่างของยีน/แอลลีลภายในชนิดทำให้บุคคลมีลักษณะแตกต่างและเพิ่มโอกาสที่ประชากรบางส่วนจะทนการเปลี่ยนแปลง","example":"พันธุ์ข้าวหลายพันธุ์ในชนิดเดียวกัน","mis":"จำนวนพันธุ์ชื่อการค้าอย่างเดียวไม่ได้บอกความหลากหลายทั้งหมด","formula":"","code":"G3U7L2S1"},{"title":"ความหลากหลายของชนิดพันธุ์","body":"พิจารณาทั้งจำนวนชนิดและความสม่ำเสมอของจำนวนแต่ละชนิด พื้นที่ที่มี 10 ชนิดแต่ชนิดหนึ่งครองเกือบทั้งหมดอาจต่างจากพื้นที่ที่กระจายสมดุล","example":"สำรวจจำนวนชนิดในแปลงตัวอย่าง","mis":"จำนวนตัวทั้งหมดไม่เท่าความหลากหลายชนิด","formula":"","code":"G3U7L2S2"},{"title":"ความหลากหลายของระบบนิเวศ","body":"หมายถึงความหลากหลายของถิ่นอาศัยและระบบนิเวศ เช่น ป่าดิบ ทุ่งหญ้า ชายเลน แนวปะการัง แต่ละระบบมีเงื่อนไขและชุมชนต่างกัน","example":"จังหวัดหนึ่งมีทั้งป่าและพื้นที่ชุ่มน้ำ","mis":"ไม่ใช่การนับชนิดอย่างเดียว","formula":"","code":"G3U7L2S3"},{"title":"ความสำคัญ","body":"ความหลากหลายช่วยการทำงานของระบบนิเวศ แหล่งอาหาร ยา พันธุกรรม การผสมเกสร การควบคุมศัตรู และความยืดหยุ่นต่อการรบกวน","example":"ความหลากหลายแมลงผสมเกสรช่วยพืชหลายชนิด","mis":"ระบบที่หลากหลายไม่ได้คงที่ไม่เปลี่ยนเลย","formula":"","code":"G3U7L2S4"},{"title":"สาเหตุการสูญเสีย","body":"การทำลายถิ่นอาศัย ใช้ทรัพยากรเกิน ชนิดต่างถิ่นรุกราน มลพิษ และการเปลี่ยนแปลงภูมิอากาศเป็นแรงกดดันสำคัญ","example":"ถนนแบ่งป่าเป็นหย่อมเล็ก ๆ","mis":"ปัจจัยหลายอย่างอาจเสริมกัน","formula":"","code":"G3U7L2S5"},{"title":"การอนุรักษ์ในถิ่นและนอกถิ่น","body":"อนุรักษ์ในถิ่นรักษาชนิดพร้อมระบบนิเวศ เช่น เขตคุ้มครอง ส่วนนอกถิ่น เช่น สวนพฤกษศาสตร์ ธนาคารเมล็ด ใช้เสริมเมื่อจำเป็น","example":"ธนาคารเมล็ดเก็บความหลากหลายพันธุกรรม","mis":"การเลี้ยงในสวนสัตว์อย่างเดียวไม่รักษาระบบนิเวศ","formula":"","code":"G3U7L2S6"},{"title":"ใช้ทรัพยากรอย่างยั่งยืน","body":"กำหนดอัตราใช้ไม่เกินการฟื้นตัว ลดของเสีย และให้ชุมชนมีส่วนร่วม ใช้ข้อมูลติดตามผลปรับการจัดการ","example":"กำหนดฤดูปิดจับสัตว์น้ำ","mis":"คำว่าอนุรักษ์ไม่ได้หมายถึงห้ามใช้ทุกอย่าง","formula":"","code":"G3U7L2S7"},{"title":"ตัดสินใจจากหลักฐาน","body":"เปรียบเทียบผลทางนิเวศ เศรษฐกิจ และสังคมของทางเลือก พร้อมระบุความไม่แน่นอนและติดตามผลหลังดำเนินการ","example":"โครงการท่องเที่ยวเชิงนิเวศต้องวัดผลต่อชนิดพันธุ์และรายได้ชุมชน","mis":"อย่าตัดสินด้วยความชอบชนิดสัตว์เพียงอย่างเดียว","formula":"","code":"G3U7L2S8"}]},"activities":{"G1U1L1":{"goal":"ออกแบบการตรวจสอบว่าปริมาณแสงสัมพันธ์กับการเจริญของต้นถั่วอย่างไร","evidence":"ความสูงของต้นถั่วจากหลายซ้ำภายใต้ชั่วโมงรับแสงที่กำหนด","conclusion":"สรุปได้เฉพาะว่าภายใต้เงื่อนไขทดลอง ปริมาณแสงที่ต่างกันสัมพันธ์กับการเจริญที่วัดได้อย่างไร","variable":"ตัวแปรต้น = ชั่วโมงรับแสง; ตัวแปรตาม = ความสูง; ควบคุมชนิดพืช น้ำ ดิน และช่วงเวลาวัด","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U2L1":{"goal":"ใช้จุดเดือด จุดหลอมเหลว และความหนาแน่นจำแนกตัวอย่างสาร","evidence":"ตารางอุณหภูมิระหว่างให้ความร้อนและค่ามวล-ปริมาตรของแต่ละตัวอย่าง","conclusion":"ตัวอย่างที่มีชุดสมบัติสอดคล้องกันมากกว่าจึงมีหลักฐานรองรับการจำแนกมากกว่า","variable":"คำนวณความหนาแน่นจากมวล/ปริมาตรและอ่านอุณหภูมิภายใต้เงื่อนไขเดียวกัน","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U2L2":{"goal":"สร้างแบบจำลองอะตอมและใช้สมบัติเลือกวัสดุให้เหมาะกับงาน","evidence":"องค์ประกอบของแบบจำลองและตารางสมบัติการนำไฟฟ้า ความแข็ง และการขึ้นรูป","conclusion":"เลือกวัสดุจากสมบัติที่ตรงความต้องการของงาน ไม่เลือกจากชื่อวัสดุเพียงอย่างเดียว","variable":"แยกธาตุ สารประกอบ โลหะ อโลหะ และกึ่งโลหะตามเกณฑ์ที่เรียน","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U3L1":{"goal":"ใช้กล้องจุลทรรศน์เสมือนระบุโครงสร้างเซลล์และเชื่อมโครงสร้างกับหน้าที่","evidence":"ภาพที่กำลังขยายเหมาะสมและตำแหน่งโครงสร้างที่สังเกตได้","conclusion":"โครงสร้างที่พบต้องสอดคล้องกับชนิดเซลล์และใช้หน้าที่อธิบายความแตกต่าง","variable":"เริ่มกำลังขยายต่ำ ปรับภาพชัด แล้วจึงเพิ่มกำลังขยาย","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U3L2":{"goal":"ทำนายการแพร่และออสโมซิสเมื่อความเข้มข้นสองด้านต่างกัน","evidence":"ทิศการเคลื่อนสุทธิของอนุภาคหรือน้ำในแบบจำลอง","conclusion":"ทิศการเคลื่อนสุทธิต้องอธิบายจากความต่างความเข้มข้นและชนิดของสาร/เยื่อ","variable":"ออสโมซิสติดตามน้ำผ่านเยื่อเลือกผ่าน; การแพร่ติดตามอนุภาคตามความต่างความเข้มข้น","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U4L1":{"goal":"เรียงกระบวนการสืบพันธุ์พืชดอกและเลือกวิธีขยายพันธุ์ตามเป้าหมาย","evidence":"ลำดับถ่ายเรณู-ปฏิสนธิ-เมล็ด/ผล-งอก และผลของวิธีขยายพันธุ์","conclusion":"ลำดับที่ถูกต้องต้องรักษาความสัมพันธ์ก่อน-หลัง และวิธีขยายพันธุ์ต้องตรงกับเป้าหมายเรื่องความหลากหลายหรือการคงลักษณะ","variable":"การถ่ายเรณูเกิดก่อนการปฏิสนธิ","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U4L2":{"goal":"ทดสอบผลของปัจจัยหนึ่งต่อการสังเคราะห์ด้วยแสงโดยควบคุมปัจจัยอื่น","evidence":"ตัวชี้วัด เช่น การตรวจแป้งหรืออัตราการเกิดแก๊สจากชุดทดลองและชุดควบคุม","conclusion":"สรุปผลของปัจจัยที่เปลี่ยนได้เมื่อชุดอื่นแตกต่างกันเฉพาะปัจจัยนั้นและมีข้อมูลทำซ้ำ","variable":"เปลี่ยนตัวแปรต้นเพียงหนึ่งปัจจัย และคุมชนิดพืช น้ำ เวลา และวิธีวัด","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U4L3":{"goal":"ติดตามเส้นทางน้ำ ธาตุอาหาร และอาหารในพืช","evidence":"ลูกศรจากดิน-ราก-ไซเล็ม-ใบ และจากใบ-โฟลเอ็ม-แหล่งใช้/สะสม","conclusion":"ไซเล็มอธิบายเส้นทางน้ำ/ธาตุอาหาร ส่วนโฟลเอ็มอธิบายเส้นทางอาหารจากแหล่งสร้างไปแหล่งใช้หรือสะสม","variable":"อย่าสลับหน้าที่หลักของไซเล็มกับโฟลเอ็ม","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U5L1":{"goal":"ใช้แบบจ function renderGrades(){ let daily=[['เข้าเรียนอย่างน้อย 1 บทเรียน',L?true:false],['ทำแบบฝึกหัดหรือเกมวิทยาศาสตร์',L?(getProgress(L.id).trace||[]).length>0:false],['พิชิต O-NET Challenge',L?getProgress(L.id).e3:false]]; $('#grades').innerHTML=`<div class="dashboardHero"><div class="hero worldHero"><div class="tag">🌍 SCIENCE ADVENTURE</div><h1 style="margin:10px 0">สวัสดีครับ!</h1><p class="mut">วันนี้พร้อมออกสำรวจ ทดลอง และพิชิตภารกิจวิทยาศาสตร์แล้วหรือยัง</p><div class="woodSign">เลือกเส้นทางการเรียนรู้ของคุณ</div></div><div class="dailyBox"><h3>⛏️ ภารกิจวันนี้ <span class="tag" style="float:right">${daily.filter(x=>x[1]).length}/3</span></h3>${daily.map(x=>`<div class="dailyItem"><span class="dailyCheck">${x[1]?'✓':''}</span><span>${x[0]}</span></div>`).join('')}</div></div><div style="text-align:center;margin:18px 0"><div class="woodSign" style="font-size:24px">เลือกระดับชั้น</div><div class="mut" style="margin-top:13px;font-weight:800">ออกแบบตามหลักสูตร สสวท. + แนวข้อสอบ O-NET</div></div><div class="grid grades">${[1,2,3].map(g=>{let pct=gradeCompletion(g),rel=g<USER?.grade?'review':g===USER?.grade?'current':'advance',lab=USER?.teacher?'เลือกเรียน':rel==='review'?'ทบทวน':rel==='current'?'ระดับปัจจุบัน':'เรียนล่วงหน้า',img=`grade${g}.png`;return `<div class="blockCard grade${g} click" data-g="${g}"><div class="art" style="background-image:url('${img}')"></div><div class="body"><h2>มัธยมศึกษาปีที่ ${g}</h2><p class="mut" style="margin:5px 0 10px">${g===1?'พื้นฐานวิทยาศาสตร์ สิ่งมีชีวิต สาร พลังงาน และโลก':g===2?'การดำรงชีวิตของสิ่งมีชีวิต สาร พลังงานและการเคลื่อนที่':'วิทยาศาสตร์กับการพัฒนาชีวิต โลกและอวกาศ เทคโนโลยี'}</p><div class="progressBig"><span style="width:${pct}%"></span></div><div class="small" style="text-align:right;margin-top:4px">${pct}%</div><div class="statusBox ${USER?.teacher?'current':rel}"><span>${lab}</span><span>›</span></div></div></div>`}).join('')}</div>`; $$('#grades .blockCard').forEach(c=>c.onclick=()=>{G=+c.dataset.g; renderUnits(); s div style="width:100%;max-width:540px"><svg viewBox="0 0 520 220" style="width:100%;height:220px"><line x1="40" y1="110" x2="480" y2="110" stroke="#90a8ff" stroke-width="2"/><line x1="260" y1="30" x2="260" y2="190" stroke="#4fb3ff" stroke-width="4"/><line x1="160" y1="30" x2="160" y2="190" stroke="#425484"/><line x1="360" y1="30" x2="360" y2="190" stroke="#425484"/><line id="obj" x1="120" y1="110" x2="120" y2="55" stroke="#39d7d3" stroke-width="5"/><line id="ray1" x1="120" y1="55" x2="260" y2="55" stroke="#ffc857" stroke-width="3"/><line id="ray2" x1="260" y1="55" x2="380" y2="150" stroke="#ffc857" stroke-width="3"/><line id="ray3" x1="120" y1="55" x2="260" y2="110" stroke="#ffc857" stroke-width="3"/></svg><div class="mut" id="optMsg">ปรับระยะวัตถุเพื่อดูแนวโน้มชนิดภาพ</div></div></div><div class="simControls"><label>ระยะวัตถุจากเลนส์ <b id="objDistVal">140</b></label><input type="range" id="objDist" min="60" max="220" value="140"></div></div>`; if(type==='circuit') return `<div class="simcard"><h3>Simulation: วงจรไฟฟ้า</h3><div class="simstage"><div style="width:100%;max-width:480px"><svg viewBox="0 0 480 220" style="width:100%;height:220px"><rect x="50" y="40" width="380" height="140" rx="18" fill="rgba(255,255,255,.03)" stroke="#6b85d8"/><path d="M100,150 L100,80 L180,80 L180,110 L300,110 L300,80 L380,80 L380,150 L100,150" stroke="#4fb3ff" stroke-width="5" fill="none"/><rect x="180" y="95" width="70" height="30" rx="8" fill="#ffc857" stroke="#cda137"/><circle id="bulb" cx="300" cy="110" r="18" fill="#fff8df" stroke="#f0d483" stroke-width="5"/><rect x="70" y="108" width="30" height="44" rx="6" fill="#39d7d3"/></svg><div class="mut" id="circuText">ปรับ V และ R เพื่อดูค่า I</div></div></div><div class="simControls"><label>V <b id="VVal">6</b> V</label><input type="range" id="volt" min="1" max="12" value="6"><label>R <b id="RVal">3</b> Ω</label><input type="range" id="res" min="1" max="12" value="3"><div class="small" id="circuMsg">I = 2 A</div></div></div>`; if(type==='motion') return `<div class="simcard"><h3>Simulation: ระยะทางและการกระจัด</h3><div class="simstage"><div style="width:100%;max-width:500px"><svg viewBox="0 0 500 220" style="width:100%;height:220px"><rect x="40" y="25" width="420" height="170" rx="16" fill="rgba(255,255,255,.03)" stroke="#6b85d8"/><circle id="point" cx="250" cy="110" r="9" fill="#8b5dff"/></svg><div class="mut" id="motionMsg">เริ่มจากจุดศูนย์กลาง</div></div></div><div class="simControls"><label>ไปทางตะวันออก <b id="eastVal">0</b> m</label><input type="range" id="east" min="0" max="8" value="0"><label>ไปทางเหนือ <b id="northVal">0</b> m</label><input type="range" id="north" min="0" max="8" value="0"></div></div>`; if(type==='osmosis') return `<div class="simcard"><h3>Simulation: Osmosis</h3><div class="simstage"><div style="width:100%;max-width:520px;text-align:center"><div class="flow" style="justify-content:center"><span class="chip">ในเซลล์</span><span class="arrow">⇄</span><span class="chip">นอกเซลล์</span></div><div class="mut" id="osmoMsg" style="margin-top:18px">ลองปรับความเข้มข้นทั้งสองด้าน</div></div></div><div class="simControls"><label>ความเข้มข้นในเซลล์ <b id="inVal">5</b></label><input type="range" id="inC" min="1" max="10" value="5"><label>ความเข้มข้นนอกเซลล์ <b id="outVal">5</b></label><input type="range" id="outC" min="1" max="10" value="5"></div></div>`; if(type==='genetics') return `<div class="simcard"><h3>Simulation: Punnett Square</h3><div class="simstage"><div style="width:100%;max-width:420px"><table style="width:100%;border-collapse:collapse"><tr><th style="padding:8px;border:1px solid rgba(255,255,255,.16)"></th><th id="h1" style="padding:8px;border:1px solid rgba(255,255,255,.16)">T</th><th id="h2" style="padding:8px;border:1px solid rgba(255,255,255,.16)">t</th></tr><tr><th id="v1" style="padding:8px;border:1px solid rgba(255,255,255,.16)">T</th><td id="c11" style="padding:8px;border:1px solid rgba(255,255,255,.16);text-align:center">TT</td><td id="c12" style="padding:8px;border:1px solid rgba(255,255,255,.16);text-align:center">Tt</td></tr><tr><th id="v2" style="padding:8px;border:1px solid rgba(255,255,255,.16)">t</th><td id="c21" style="padding:8px;border:1px solid rgba(255,255,255,.16);text-align:center">Tt</td><td id="c22" style="padding:8px;border:1px solid rgba(255,255,255,.16);text-align:center">tt</td></tr></table><div class="mut" id="genMsg" style="margin-top:12px">เริ่มจาก Tt × Tt</div></div></div><div class="simControls"><label>พ่อ</label><select id="dad"><option>Tt</option><option>TT</option><option>tt</option></select><label>แม่</label><select id="mom"><option>Tt</option><option>TT</option><option>tt</option></select></div></div>`; return '' }
function mountInlineSim(type){ if(type==='circulation'){ $('#actRange').oninput=e=>{let v=+e.target.value,p=72+Math.round(v*.9); $('#actVal').textContent=v; $('#pulseText').textContent=(v<25?'พัก/เบา':v<60?'ปานกลาง':'หนัก')+`: ชีพจรประมาณ ${p} ครั้ง/นาที`; $('#actMsg').textContent=v<25?'กิจกรรมต่ำ ชีพจรใกล้ค่าพัก':'กิจกรรมมากขึ้น หัวใจสูบฉีดเร็วขึ้น'} } else if(type==='resp'){ $('#breath').oninput=e=>{let v=+e.target.value; $('#breathVal').textContent=v; $('#lungL').setAttribute('ry',58+v*.18); $('#lungR').setAttribute('ry',58+v*.18); $('#dia').setAttribute('d',`M120,165 Q215,${165+v*.25} 310,165`); $('#respText').textContent=v<35?'หายใจเข้าเล็กน้อย':v<70?'หายใจเข้าชัดเจน ปริมาตรช่องอกเพิ่ม':'หายใจเข้าเต็มที่ กะบังลมเลื่อนต่ำ'} } else if(type==='optics'){ $('#objDist').oninput=e=>{let d=+e.target.value; $('#objDistVal').textContent=d; let x=260-d; $('#obj').setAttribute('x1',x); $('#obj').setAttribute('x2',x); $('#ray1').setAttribute('x1',x); $('#ray3').setAttribute('x1',x); $('#optMsg').textContent=d>100?'วัตถุอยู่นอกโฟกัส ภาพมีแนวโน้มเป็นภาพจริง':'วัตถุอยู่ใกล้เลนส์มากขึ้น ภาพอาจเป็นภาพเสมือน'} } else if(type==='circuit'){ const upd=()=>{let V=+$('#volt').value,R=+$('#res').value,I=(V/R).toFixed(2); $('#VVal').textContent=V; $('#RVal').textContent=R; $('#circuMsg').textContent=`I = V/R = ${I} A`; $('#bulb').setAttribute('fill',V/R>2?'#ffe36d':V/R>1?'#fff3ac':'#fff8df'); $('#circuText').textContent='V มากขึ้นหรือ R ลดลง → I เพิ่มขึ้น'}; $('#volt').oninput=upd; $('#res').oninput=upd; upd()} else if(type==='motion'){ const upd=()=>{let e=+$('#east').value,n=+$('#north').value; $('#eastVal').textContent=e; $('#northVal').textContent=n; $('#point').setAttribute('cx',250+e*24); $('#point').setAttribute('cy',110-n*18); let dist=e+n, disp=Math.sqrt(e*e+n*n).toFixed(2); $('#motionMsg').textContent=`ระยะทาง = ${dist} m | การกระจัด = ${disp} m`}; $('#east').oninput=upd; $('#north').oninput=upd } else if(type==='osmosis'){ const upd=()=>{let a=+$('#inC').value,b=+$('#outC').value; $('#inVal').textContent=a; $('#outVal').textContent=b; $('#osmoMsg').textContent=a===b?'สมดุลใกล้เคียงกัน':(a>b?'ในเซลล์เข้มข้นกว่า น้ำมีแนวโน้มไหลเข้าสู่เซลล์':'นอกเซลล์เข้มข้นกว่า น้ำมีแนวโน้มไหลออกจากเซลล์')}; $('#inC').oninput=upd; $('#outC').oninput=upd } else if(type==='genetics'){ const upd=()=>{let d=$('#dad').value.split(''),m=$('#mom').value.split(''); $('#h1').textContent=d[0]; $('#h2').textContent=d[1]; $('#v1').textContent=m[0]; $('#v2').textContent=m[1]; let cells=[[m[0]+d[0],m[0]+d[1]],[m[1]+d[0],m[1]+d[1]]].flat().map(x=>x.split('').sort((a,b)=>a===a.toUpperCase()?-1:1).join('')); ['c11','c12','c21','c22'].forEach((id,i)=>$('#'+id).textContent=cells[i]); $('#genMsg').textContent=`ผังนี้ช่วยคาดคะเนจีโนไทป์จาก ${$('#dad').value} × ${$('#mom').value}`}; $('#dad').onchange=upd; $('#mom').onchange=upd }}
function renderContent(){ let p=getProgress(L.id); let secs=pack(); if(p.contentIndex>=secs.length) p.contentIndex=secs.length-1; let i=p.contentIndex, s=secs[i]; let info=(i===0?specialInfo(L.id):'') || (i===1?specialInfo(L.id):'') || ''; let simType=simTypeFor(L.id,i); let body=`<div class="panel reader"><div class="stageLabel"><span class="tag">ตอนที่ ${i+1}/${secs.length}</span></div><h2>${esc(s.title)}</h2><div class="box"><h3>เนื้อหา</h3><p>${esc(s.body)}</p></div><div class="box"><h3>อธิบายเพิ่มเติม</h3><p>${esc(s.example||s.title)}</p></div>${info || genericInfo(s)}${simType?simHtml(simType):''}<div class="navArea" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn soft" id="prevContent" ${i===0?'disabled':''}>← ตอนก่อนหน้า</button><div><button class="btn soft" id="toLessons">กลับไปเลือกบท</button> <button class="btn main" id="nextContent">${i===secs.length-1?'ไปยังกิจกรรม':'ตอนถัดไป →'}</button></div></div></div>`; missionShell(L.title,'content',body); if(simType) mountInlineSim(simType); $('#prevContent').onclick=()=>{let p=getProgress(L.id); p.contentIndex=Math.max(0,p.contentIndex-1); p.resume={stage:'content'}; saveProgress(L.id,p); renderContent()}; $('#toLessons').onclick=()=>{renderLessons(U); show('lessons')}; $('#nextContent').onclick=()=>{let p=getProgress(L.id); if(p.contentIndex<secs.length-1){p.contentIndex++; p.resume={stage:'content'}; saveProgress(L.id,p); renderContent()} else {p.contentDone=true; p.resume={stage:'activity'}; saveProgress(L.id,p); renderActivity(); toast('✨ ปลดล็อกกิจกรรมแล้ว')}} }
function renderActivity(){ let p=getProgress(L.id), a=ACT[L.id]||{}; let steps=(a.steps||['สำรวจข้อมูลที่เกี่ยวข้อง','บันทึกสิ่งที่สังเกตได้','สรุปจากหลักฐาน']).map(x=>`<li>${esc(x)}</li>`).join(''); let body=`<div class="panel reader"><h2>กิจกรรม / การทดลองของบทนี้</h2><div class="trip"><div class="ibox"><h4>เป้าหมาย</h4><div class="mut">${esc(a.goal||'เชื่อมแนวคิดของบทกับการสังเกตหลักฐาน')}</div></div><div class="ibox"><h4>หลักฐานที่ต้องดู</h4><div class="mut">${esc(a.evidence||'ผลการสังเกต ข้อมูล หรือค่าที่วัดได้')}</div></div><div class="ibox"><h4>ตัวแปร / เงื่อนไข</h4><div class="mut">${esc(a.variable||'กำหนดตัวแปรต้น ตัวแปรตาม และสิ่งที่ต้องควบคุมให้ชัด')}</div></div></div><div class="box"><h3>ลำดับการทำงาน</h3><ol>${steps}</ol></div><div class="box"><h3>สรุปจากกิจกรรม</h3><p>${esc(a.conclusion||'สรุปเฉพาะสิ่งที่หลักฐานรองรับ ไม่สรุปเกินข้อมูลที่มี')}</p></div><div class="feedback">ช่วงกิจกรรมยังไม่เก็บร่องรอยผิด–ถูก เมื่อพร้อมแล้วให้เริ่มเกม 1 ต่อได้เลย</div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn soft" id="backToContent">← กลับเนื้อหา</button><button class="btn green" id="goGame1">เริ่มเกม 1</button></div></div>`; missionShell('ภารกิจทดลอง','activity',body); $('#backToContent').onclick=()=>{let p=getProgress(L.id); p.resume={stage:'content'}; saveProgress(L.id,p); renderContent()}; $('#goGame1').onclick=()=>{let p=getProgress(L.id); p.activityDone=true; p.resume={stage:'g1'}; saveProgress(L.id,p); renderGame1(); toast('🎮 เข้าสู่ช่วงเกมแล้ว')}}
function addTrace(stage,code,question,selected,correct,ok,extra=''){ let p=getProgress(L.id); p.trace.push({time:new Date().toLocaleString('th-TH'),stage,code,question,selected,correct,ok,extra}); saveProgress(L.id,p)}
function ensureGame1State(){ let p=getProgress(L.id); if(!p.gameState.g1){ let secs=pack().slice(0,4); p.gameState.g1={pairs:secs.map(s=>({left:s.title,right:s.body,code:s.code})),rightOrder:sh(secs.map((s,i)=>i)),matched:[],selectedLeft:null}; saveProgress(L.id,p)} return p.gameState.g1 }
function renderGame1(){ let p=getProgress(L.id), st=ensureGame1State(); let pairs=st.pairs; let leftHtml=pairs.map((x,i)=>`<button class="mcard left ${st.matched.includes(i)?'done':''} ${st.selectedLeft===i?'sel':''}" data-i="${i}" ${st.matched.includes(i)?'disabled':''}>${esc(x.left)}</button>`).join(''); let rightHtml=st.rightOrder.map(i=>`<button class="mcard right ${st.matched.includes(i)?'done':''}" data-i="${i}" ${st.matched.includes(i)?'disabled':''}>${esc(pairs[i].right)}</button>`).join(''); let done=st.matched.length===pairs.length; let body=`<div class="panel reader"><h2>เกม 1: จับคู่การ์ดความรู้</h2><p class="mut">เลือกการ์ดทางซ้าย แล้วจับคู่กับคำอธิบายที่ตรงกันทางขวา</p><div class="matchWrap"><div class="matchCol">${leftHtml}</div><div class="matchCol">${rightHtml}</div></div><div id="g1fb"></div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn soft" id="g1reset">เริ่มใหม่</button><button class="btn green" id="g1next" ${done?'':'disabled'}>ไปเกม 2</button></div></div>`; missionShell('Challenge 1','g1',body); $$('.left').forEach(b=>b.onclick=()=>{let p=getProgress(L.id); p.gameState.g1.selectedLeft=+b.dataset.i; p.resume={stage:'g1'}; saveProgress(L.id,p); renderGame1()}); $$('.right').forEach(b=>b.onclick=()=>{let p=getProgress(L.id), gs=p.gameState.g1; if(gs.selectedLeft==null){$('#g1fb').innerHTML='<div class="feedback">เลือกการ์ดทางซ้ายก่อน</div>'; return} let li=gs.selectedLeft, ri=+b.dataset.i, ok=li===ri; addTrace('g1',pairs[li].code,'จับคู่การ์ด',pairs[li].left+' ↔ '+pairs[ri].right,pairs[li].left+' ↔ '+pairs[li].right,ok); if(ok){if(!gs.matched.includes(li)) gs.matched.push(li); gs.selectedLeft=null; if(gs.matched.length===pairs.length) p.g1=true; saveProgress(L.id,p); renderGame1(); $('#g1fb') && ($('#g1fb').innerHTML='<div class="feedback">✅ จับคู่ถูกต้อง</div>'); if(p.g1) toast('🏆 ผ่านเกม 1 แล้ว')} else {saveProgress(L.id,p); $('#g1fb').innerHTML='<div class="feedback">❌ ยังไม่ function makeOptions(correct,pool){ let wrong=uniq(pool).filter(x=>x!==correct); let fills=['สรุปเกินหลักฐานที่มี','เป็นคำอธิบายที่ไม่สอดคล้องกับข้อมูล','ยังไม่ใช่แนวคิดสำคัญของเรื่องนี้']; while(wrong.length<3 && fills.length){let f=fills.shift(); if(f!==correct && !wrong.includes(f)) wrong.push(f)} return sh([correct,...wrong.slice(0,3)]) }

function masteryRows(p){ let map={}; (p.trace||[]).forEach(t=>{ if(!t.code) return; if(!map[t.code]) map[t.code]={ok:0,total:0,title:(pack().find(x=>x.code===t.code)||{}).title||t.code}; map[t.code].total++; if(t.ok) map[t.code].ok++ }); return pack().map(s=>{let m=map[s.code]||{ok:0,total:0}; let pct=m.total?Math.round(m.ok/m.total*100):0; let label=pct>=85?'เชี่ยวชาญ':pct>=70?'ชำนาญ':pct>=50?'พอใช้':'กำลังพัฒนา'; return {title:s.title,pct,label,code:s.code}}) }
function renderResult(){ let p=getProgress(L.id), mastery=masteryRows(p), recent=(p.trace||[]).slice(-18).reverse(); let strong=[...mastery].sort((a,b)=>b.pct-a.pct)[0]||{title:'- ',pct:0}; let weak=[...mastery].sort((a,b)=>a.pct-b.pct)[0]||{title:'- ',pct:0}; let body=`<div class="panel reader"><div class="trophyHero"><div class="cup">🏆</div><h2>ยอดเยี่ยม! Mission Complete</h2><div class="mut">สรุปผลการเรียนรู้และความเชี่ยวชาญของบทนี้</div></div><h2 style="margin-top:18px">สรุปผลการเรียนรู้</h2><div class="resultGrid"><div class="metric"><b>${p.testScore??0}</b>คะแนนจาก 20</div><div class="metric"><b>${p.trace.filter(x=>!x.ok).length}</b>ร่องรอยที่ตอบผิด</div><div class="metric"><b>${strong.pct}%</b>เด่น: ${esc(strong.title)}</div><div class="metric"><b>${weak.pct}%</b>พัฒนา: ${esc(weak.title)}</div></div><div class="box"><h3>Mastery รายหัวข้อ</h3><div class="mastery">${mastery.map(m=>`<div class="mrow"><div><b>${esc(m.title)}</b><br><span class="small">${m.label}</span></div><div class="track"><span style="width:${m.pct}%"></span></div><b>${m.pct}%</b></div>`).join('')}</div></div>${p.testReview&&p.testReview.length?`<div class="box"><h3>ข้อที่ควรทบทวน</h3>${p.testReview.map(r=>`<div class="feedback"><b>ข้อ ${r.n}</b> • ${esc(r.q)}<br>ตอบ: ${esc(r.y)}<br>คำตอบที่ถูก: <b>${esc(r.a)}</b><br>${esc(r.why)}</div>`).join('')}</div>`:''}<div class="box"><h3>ร่องรอยล่าสุด</h3><div class="traceList">${recent.length?recent.map(t=>`<div class="traceItem"><b>${esc(STAGE_TITLES[t.stage]||t.stage)}</b> • ${esc(t.code||'-')} • ${esc(t.time)}<br>${esc(t.question)}<br><span style="color:${t.ok?'#aef5c9':'#ffb0b0'}">${t.ok?'ถูก':'ผิด'}</span> — ตอบ: ${esc(t.selected||'-')} | เฉลย: ${esc(t.correct||'-')}</div>`).join(''):'<div class="traceItem">ยังไม่มีร่องรอย</div>'}</div></div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn soft" id="backLessons">กลับไปเลือกบท</button><div><button class="btn orange" id="reviewLesson">ทบทวนบทนี้</button> <button class="btn pink" id="retryTest">ทำข้อสอบใหม่</button></div></div></div>`; missionShell(p.testPassed?'Mission Complete!':'ยังไม่ผ่านด่านสุดท้าย','result',body); $('#backLessons').onclick=()=>{renderLessons(U); show('lessons')}; $('#reviewLesson').onclick=()=>{let p=getProgress(L.id); p.resume={stage:'content'}; saveProgress(L.id,p); renderContent()}; $('#retryTest').onclick=()=>{let p=getProgress(L.id); p.testPassed=false; p.testScore=null; p.testReview=[]; p.testState=null; p.resume={stage:'test'}; saveProgress(L.id,p); ensureTestState(true); renderTest()} }
function renderMission(stage){ if(stage==='content') renderContent(); else if(stage==='activity') renderActivity(); else if(stage==='g1') renderGame1(); else if(stage==='g2') renderGame2(); else if(stage==='g3') renderGame3(); else if(stage==='e1'||stage==='e2'||stage==='e3') renderExercise(stage); else if(stage==='test') renderTest(); else renderResult() }
$('#backBtn').onclick=()=>{let prev=HISTORY.pop(); if(!prev){renderGrades(); show('grades',false); return} if(prev==='grades') renderGrades(); if(prev==='units') renderUnits(); if(prev==='lessons') renderLessons(U); show(prev,false)};
$('#homeBtn').onclick=()=>{renderGrades(); show('grades',false)};
$('#logoutBtn').onclick=()=>{USER=null; HISTORY=[]; showLogin()};

function pixelBurstAt(x,y){const colors=['#5cbdf5','#78d757','#ffd24d','#8d68ee','#ff8d62'];for(let i=0;i<9;i++){let d=document.createElement('i');d.className='pixel';d.style.left=(x-4)+'px';d.style.top=(y-4)+'px';d.style.background=colors[i%colors.length];let a=Math.PI*2*i/9,r=20+Math.random()*18;d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),500)}}
document.addEventListener('click',e=>{let t=e.target.closest('button,.click,.mcard,.choice,.zoneBtn,.seqbtn');if(!t)return;pixelBurstAt(e.clientX,e.clientY);setTimeout(updateGameStats,80)});

$$('.navBtn').forEach(b=>b.onclick=()=>{let n=b.dataset.nav;if(n==='grades'){renderGrades();show('grades',false)}else if(n==='units'){if(!G)G=USER?.grade||1;renderUnits();show('units',false)}else if(n==='result'){if(L&&getProgress(L.id).testPassed){renderResult();show('mission',false)}else toast('📊 เมื่อเรียนจบบท ระบบจะแสดงผลการเรียนที่นี่')}else if(n==='mission'){if(L){renderMission(currentStage(getProgress(L.id)));show('mission',false)}else toast('⭐ เลือกบทเรียนเพื่อเริ่มภารกิจก่อน')}else toast('ℹ️ Science Learning Hub • โรงเรียนห้องสอนศึกษา ในพระอุปถัมภ์ฯ')});

showLogin();
</script>
</body>
</html>
