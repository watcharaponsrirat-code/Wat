,"example":"ใช้สารละลายดินและตัวชี้วัด/เครื่องวัด","mis":"pH ไม่ได้บอกความอุดมสมบูรณ์ทุกด้าน","formula":"","code":"G2U7L2S5"},{"title":"น้ำผิวดิน","body":"แม่น้ำ ลำธาร หนอง บึง และอ่างเก็บน้ำเป็นส่วนของวัฏจักรน้ำ รับน้ำจากฝน น้ำไหลบ่า และน้ำใต้ดิน","example":"คุณภาพน้ำขึ้นกับกิจกรรมในลุ่มน้ำ","mis":"น้ำใสไม่ได้แปลว่าสะอาดปลอดภัย","formula":"","code":"G2U7L2S6"},{"title":"น้ำใต้ดิน","body":"น้ำซึมผ่านช่องว่างลงสู่ชั้นอิ่มน้ำและสะสมในชั้นหินอุ้มน้ำ ระดับน้ำใต้ดินเปลี่ยนตามการเติมและการสูบ","example":"บ่อเจาะใช้น้ำจากชั้นหินอุ้มน้ำ","mis":"น้ำใต้ดินไม่ได้เป็นแม่น้ำใต้ดินเสมอ","formula":"","code":"G2U7L2S7"},{"title":"การใช้ดินและน้ำอย่างยั่งยืน","body":"การใช้ต้องพิจารณาอัตราการเกิด/เติมใหม่ การปนเปื้อน และความเสี่ยงต่อการพังทลายหรือแผ่นดินทรุด","example":"ลดการสูบน้ำเกินและป้องกันสารเคมีลงดิน","mis":"ทรัพยากรที่มีมากวันนี้อาจลดลงในระยะยาว","formula":"","code":"G2U7L2S8"}],"G2U7L3":[{"title":"น้ำท่วม","body":"เกิดเมื่อปริมาณน้ำไหลเข้าเกินความสามารถของพื้นที่หรือทางน้ำในการระบาย ปัจจัยได้แก่ฝนหนัก น้ำป่า เมืองมีพื้นผิวทึบน้ำ และการกีดขวางทางน้ำ","example":"พื้นที่ลุ่มใกล้ลำน้ำเสี่ยงสูง","mis":"น้ำท่วมทุกครั้งไม่ได้มีสาเหตุเดียว","formula":"","code":"G2U7L3S1"},{"title":"แผ่นดินถล่ม","body":"มวลดินหรือหินเคลื่อนลงตามลาดเมื่อแรงต้านน้อยกว่าแรงขับ ฝนทำให้ดินอิ่มน้ำเพิ่มน้ำหนักและลดความมั่นคง","example":"ลาดชันที่ถูกตัดไหล่เขาและฝนหนักเสี่ยงมาก","mis":"ต้นไม้ช่วยแต่ไม่ป้องกันได้ทุกกรณี","formula":"","code":"G2U7L3S2"},{"title":"กัดเซาะชายฝั่ง","body":"คลื่น กระแสน้ำ ลม และสมดุลตะกอนเปลี่ยนแนวชายฝั่ง โครงสร้างป้องกันจุดหนึ่งอาจเปลี่ยนการพัดพาตะกอนไปอีกพื้นที่","example":"กำแพงกันคลื่นอาจทำให้ตะกอนด้านข้างลด","mis":"ไม่ควรแก้เฉพาะจุดโดยไม่ดูระบบชายฝั่ง","formula":"","code":"G2U7L3S3"},{"title":"หลุมยุบ","body":"มักเกี่ยวกับโพรงใต้ดินในหินที่ละลายได้ เช่น หินปูน เมื่อหลังคาโพรงรับน้ำหนักไม่ไหวจึงยุบตัว ปัจจัยน้ำใต้ดินมีผล","example":"พื้นที่คาสต์มีความเสี่ยงเฉพาะ","mis":"หลุมยุบไม่เหมือนแผ่นดินทรุดกว้าง ๆ","formula":"","code":"G2U7L3S4"},{"title":"แผ่นดินทรุด","body":"พื้นดินลดระดับอย่างค่อยเป็นค่อยไปจากการอัดตัวของชั้นดิน เช่น สูบน้ำใต้ดินมากจนแรงดันน้ำลด","example":"บางเมืองทรุดจากการสูบน้ำบาดาล","mis":"ไม่ใช่การพังของโพรงจุดเดียว","formula":"","code":"G2U7L3S5"},{"title":"การประเมินความเสี่ยง","body":"ต้องใช้ข้อมูลฝน ความชัน ธรณีวิทยา การใช้ที่ดิน ระดับน้ำ และประวัติภัยร่วมกัน ทำแผนที่เสี่ยงและเตรียมอพยพ","example":"โรงเรียนควรรู้จุดปลอดภัยและเส้นทางอพยพ","mis":"การพยากรณ์ภัยมีความไม่แน่นอน","formula":"","code":"G2U7L3S6"}],"G2U8L1":[{"title":"พลังงานกับทรัพยากร","body":"มนุษย์ต้องเปลี่ยนพลังงานจากแหล่งต่าง ๆ เป็นไฟฟ้า ความร้อน หรือการเคลื่อนที่ การประเมินแหล่งพลังงานต้องมองทั้งวงจรชีวิต","example":"ไฟฟ้าไม่ใช่แหล่งพลังงานปฐมภูมิ แต่เป็นพาหะพลังงาน","mis":"อย่าดูเฉพาะช่วงใช้งาน","formula":"","code":"G2U8L1S1"},{"title":"ถ่านหิน","body":"เกิดจากซากพืชสะสมและเปลี่ยนแปลงภายใต้ความดัน/ความร้อนเป็นเวลานาน เผาให้พลังงานแต่ปล่อย CO₂ และมลพิษหลายชนิด","example":"โรงไฟฟ้าถ่านหินต้องควบคุมฝุ่นและก๊าซ","mis":"เป็นทรัพยากรใช้แล้วลดลง","formula":"","code":"G2U8L1S2"},{"title":"ปิโตรเลียมและแก๊สธรรมชาติ","body":"เกิดจากอินทรียวัตถุฝังในชั้นตะกอนและเปลี่ยนแปลงนาน ใช้ผลิตเชื้อเพลิงและวัตถุดิบเคมี","example":"น้ำมันดิบต้องกลั่นแยกส่วน","mis":"การรั่วไหลกระทบระบบนิเวศ","formula":"","code":"G2U8L1S3"},{"title":"พลังงานแสงอาทิตย์","body":"เซลล์แสงอาทิตย์เปลี่ยนพลังงานแสงเป็นไฟฟ้า มีการปล่อยระหว่างใช้งานต่ำแต่การผลิตแปรตามแสงและต้องใช้พื้นที่/ระบบกักเก็บหรือโครงข่าย","example":"หลังคาโรงเรียนติดโซลาร์","mis":"ไม่มีแสงกลางคืนจึงต้องจัดการพลังงาน","formula":"","code":"G2U8L1S4"},{"title":"พลังงานลมและน้ำ","body":"ลมใช้กังหันหมุนเครื่องกำเนิด ส่วนพลังน้ำใช้พลังงานศักย์/จลน์ของน้ำ ประสิทธิภาพดีบางพื้นที่แต่กระทบภูมิทัศน์/ระบบนิเวศ","example":"เขื่อนผลิตไฟแต่เปลี่ยนการไหลแม่น้ำ","mis":"พลังงานทดแทนไม่ใช่ไม่มีผลกระทบ","formula":"","code":"G2U8L1S5"},{"title":"ชีวมวล","body":"ใช้สารอินทรีย์จากพืช เศษวัสดุ หรือของเสียเป็นพลังงาน หากจัดการดีช่วยใช้ของเหลือ แต่ยังมีการปล่อยมลพิษและต้องพิจารณาการใช้ที่ดิน","example":"ก๊าซชีวภาพจากมูลสัตว์","mis":"คำว่า renewable ไม่เท่ากับ carbon neutral ทุกกรณี","formula":"","code":"G2U8L1S6"},{"title":"เปรียบเทียบและตัดสินใจ","body":"ใช้เกณฑ์ต้นทุน ความมั่นคงพลังงาน ทรัพยากรในพื้นที่ การปล่อยก๊าซ ผลต่อระบบนิเวศ และสังคม เพื่อเลือกชุดพลังงานที่เหมาะ","example":"พื้นที่แดดดีแต่ลมน้อยควรวิเคราะห์สัดส่วนต่างจากชายฝั่ง","mis":"ไม่มีแหล่งเดียวดีที่สุดทุกพื้นที่","formula":"","code":"G2U8L1S7"}],"G3U1L1":[{"title":"ปัญหากับคำถาม","body":"เริ่มจากนิยามปัญหาให้ชัดว่าเกิดกับใคร ที่ไหน เมื่อใด และผลกระทบอะไร จากนั้นเปลี่ยนเป็นคำถามที่เก็บข้อมูลได้","example":"ปัญหาขยะโรงเรียน → ขยะประเภทใดมากที่สุดและเกิดช่วงใด","mis":"ปัญหากว้างเกินไปทำให้หาแนวทางยาก","formula":"","code":"G3U1L1S1"},{"title":"รวบรวมหลักฐาน","body":"ใช้ข้อมูลปฐมภูมิ เช่น สำรวจ/วัด และข้อมูลทุติยภูมิจากแหล่งเชื่อถือ ตรวจที่มา วิธีเก็บ และความทันสมัย","example":"ชั่งขยะจริง 5 วันและอ่านข้อมูลเทศบาล","mis":"ข้อมูลบนอินเทอร์เน็ตไม่ได้มีคุณภาพเท่ากัน","formula":"","code":"G3U1L1S2"},{"title":"สร้างทางเลือก","body":"ใช้ความรู้หลายสาขาสร้างวิธีแก้มากกว่าหนึ่งแบบ คำนึงถึงเทคนิค งบ เวลา ผู้ใช้ และผลกระทบ","example":"ลดใช้ แยกขยะ ปรับระบบจัดซื้อ และให้แรงจูงใจ","mis":"อย่าตัดสินวิธีแรกก่อนเปรียบเทียบ","formula":"","code":"G3U1L1S3"},{"title":"เกณฑ์และข้อจำกัด","body":"กำหนดเกณฑ์ เช่น ประสิทธิภาพ ความปลอดภัย ต้นทุน สิ่งแวดล้อม และความเป็นธรรม พร้อมข้อจำกัดจริง","example":"งบ 20,000 บาทและต้องดำเนินใน 1 ภาคเรียน","mis":"เกณฑ์ต้องวัดหรือเปรียบเทียบได้","formula":"","code":"G3U1L1S4"},{"title":"ประเมินทางเลือก","body":"สร้างตารางตัดสินหรือวิเคราะห์ข้อดีข้อเสีย ใช้หลักฐานให้คะแนนและอธิบายเหตุผล","example":"ทางเลือก A ลดขยะได้มากแต่ต้นทุนสูง","mis":"การให้คะแนนต้องอธิบายฐานของคะแนน","formula":"","code":"G3U1L1S5"},{"title":"ทดสอบและปรับปรุง","body":"ทดลองขนาดเล็ก เก็บข้อมูลผลจริง เปรียบเทียบกับเกณฑ์ แล้วปรับแบบก่อนใช้เต็มรูปแบบ","example":"ทดลองถังแยกขยะหนึ่งอาคาร 2 สัปดาห์","mis":"ความล้มเหลวของต้นแบบเป็นข้อมูลเพื่อปรับปรุง","formula":"","code":"G3U1L1S6"},{"title":"ผลกระทบและจริยธรรม","body":"การแก้ปัญหาหนึ่งอาจสร้างผลกระทบใหม่ ต้องพิจารณาผู้ได้/เสียประโยชน์ ความเป็นส่วนตัว ความปลอดภัย และความยั่งยืน","example":"ระบบกล้องตรวจขยะมีประเด็นข้อมูลส่วนบุคคล","mis":"เทคโนโลยีที่ทำงานได้ไม่จำเป็นต้องเหมาะสมทางจริยธรรม","formula":"","code":"G3U1L1S7"}],"G3U2L1":[{"title":"โครโมโซม DNA และยีน","body":"DNA เป็นสารพันธุกรรม ยีนเป็นช่วงของ DNA ที่มีข้อมูลเกี่ยวข้องกับการสร้างผลิตภัณฑ์หรือควบคุมลักษณะ และ DNA จัดรวมกับโปรตีนเป็นโครโมโซม","example":"หนึ่งโครโมโซมมี DNA ยาวมากและมียีนจำนวนมาก","mis":"ยีนไม่ได้เป็นเม็ดเล็กที่เรียงอยู่นอก DNA","formula":"","code":"G3U2L1S1"},{"title":"แอลลีล","body":"ยีนตำแหน่งหนึ่งอาจมีรูปแบบต่างกันเรียกแอลลีล สิ่งมีชีวิตดิพลอยด์มีแอลลีลจากพ่อและแม่อย่างละหนึ่งสำหรับหลายยีน","example":"T และ t เป็นสัญลักษณ์แทนแอลลีลในแบบจำลอง","mis":"ตัวอักษรใหญ่ไม่ได้แปลว่าแอลลีลพบมากกว่า","formula":"","code":"G3U2L1S2"},{"title":"การทดลองเมนเดล","body":"เมนเดลเลือกถั่วที่ลักษณะต่างชัด ควบคุมการผสม และนับลูกจำนวนมาก พบอัตราส่วนที่อธิบายด้วยการแยกของปัจจัยพันธุกรรม","example":"รุ่น F2 ของลักษณะเด่นสมบูรณ์มักใกล้ 3:1","mis":"อัตราส่วนจริงไม่จำเป็นตรงเป๊ะเมื่อจำนวนตัวอย่างน้อย","formula":"","code":"G3U2L1S3"},{"title":"เด่นและด้อย","body":"ในแบบจำลองเด่นสมบูรณ์ แอลลีลเด่นแสดงฟีโนไทป์ในเฮเทอโรไซกัส ส่วนแอลลีลด้อยแสดงเมื่อไม่มีแอลลีลเด่น","example":"Tt แสดงลักษณะเด่น","mis":"เด่นไม่ได้แปลว่าดี แข็งแรง หรือพบมาก","formula":"","code":"G3U2L1S4"},{"title":"จีโนไทป์และฟีโนไทป์","body":"จีโนไทป์คือชุดแอลลีล เช่น TT Tt tt ส่วนฟีโนไทป์คือสิ่งที่สังเกตได้และอาจได้รับอิทธิพลจากสิ่งแวดล้อม","example":"TT กับ Tt อาจมีฟีโนไทป์เหมือนกัน","mis":"ฟีโนไทป์ไม่เปิดเผยจีโนไทป์ได้เสมอ","formula":"","code":"G3U2L1S5"},{"title":"ตารางพุนเนตต์","body":"เขียนแกมีตของพ่อแม่บนขอบตารางแล้วรวมแอลลีลในช่อง ใช้ทำนายความน่าจะเป็นของลูกแต่ละจีโนไทป์ ไม่ใช่ลำดับลูกจริง","example":"Tt×Tt → 1 TT : 2 Tt : 1 tt","mis":"ลูก 4 คนไม่ได้จำเป็นต้องได้ครบ 1:2:1","formula":"","code":"G3U2L1S6"},{"title":"ไมโทซิส","body":"เซลล์ร่างกายแบ่งเพื่อการเจริญ ซ่อมแซม และทดแทน ได้เซลล์ลูกที่มีจำนวนโครโมโซมเท่าเดิมโดยทั่วไป","example":"แผลหายจากการแบ่งเซลล์","mis":"ไมโทซิสไม่สร้างแกมีตเป็นหน้าที่หลัก","formula":"","code":"G3U2L1S7"},{"title":"ไมโอซิส","body":"สร้างเซลล์สืบพันธุ์ ลดจำนวนโครโมโซมครึ่งหนึ่งและสร้างความหลากหลายจากการจัดเรียง/แลกเปลี่ยนสารพันธุกรรม","example":"แกมีตมนุษย์มีโครโมโซมครึ่งเซลล์ร่างกาย","mis":"ไมโอซิสไม่ได้ให้เซลล์ลูกเหมือนกันทั้งหมด","formula":"","code":"G3U2L1S8"},{"title":"โรคทางพันธุกรรม","body":"เกิดจากการเปลี่ยนแปลงยีนหรือโครโมโซม รูปแบบถ่ายทอดแตกต่างกัน การวิเคราะห์ผังเครือญาติช่วยติดตามบางลักษณะ","example":"ธาลัสซีเมียเกี่ยวกับยีนการสร้างฮีโมโกลบิน","mis":"โรคทางพันธุกรรมไม่เท่ากับโรคที่พ่อแม่ต้องแสดงอาการเสมอ","formula":"","code":"G3U2L1S9"},{"title":"GMO","body":"สิ่งมีชีวิตดัดแปรพันธุกรรมถูกเปลี่ยน DNA ด้วยเทคโนโลยีเพื่อให้ได้ลักษณะเฉพาะ เช่น ต้านแมลงหรือสร้างสารบางชนิด การประเมินต้องดูประโยชน์ ความเสี่ยง และข้อมูลความปลอดภัยรายกรณี","example":"พืช Bt สร้างโปรตีนที่กระทบแมลงเป้าหมาย","mis":"คำว่า GMO ไม่บอกว่า “ดี” หรือ “อันตราย” โดยอัตโนมัติ","formula":"","code":"G3U2L1S10"}],"G3U3L1":[{"title":"คลื่นคืออะไร","body":"คลื่นถ่ายโอนพลังงานและข้อมูลจากที่หนึ่งไปอีกที่หนึ่ง โดยสสารของตัวกลางไม่จำเป็นต้องเคลื่อนตามคลื่นทั้งหมด","example":"คลื่นบนเชือกเคลื่อน แต่จุดบนเชือกสั่นรอบตำแหน่ง","mis":"อย่าสับสนการเคลื่อนของรูปคลื่นกับอนุภาค","formula":"","code":"G3U3L1S1"},{"title":"คลื่นตามขวางและตามยาว","body":"คลื่นตามขวางมีการสั่นตั้งฉากทิศเคลื่อนคลื่น ส่วนตามยาวสั่นขนานทิศคลื่น","example":"คลื่นเชือกตามขวาง เสียงในอากาศตามยาว","mis":"การจัดประเภทพิจารณาทิศการสั่นเทียบกับทิศคลื่น","formula":"","code":"G3U3L1S2"},{"title":"แอมพลิจูด","body":"แอมพลิจูดคือการกระจัดสูงสุดจากตำแหน่งสมดุลและสัมพันธ์กับพลังงานของคลื่นในหลายระบบ","example":"สั่นเชือกแรงขึ้นทำให้แอมพลิจูดมากขึ้น","mis":"แอมพลิจูดไม่ใช่ความยาวคลื่น","formula":"","code":"G3U3L1S3"},{"title":"ความยาวคลื่น","body":"ระยะระหว่างจุดที่มีเฟสเดียวกันติดกัน เช่น ยอดถึงยอด สัญลักษณ์ λ","example":"วัดยอดหนึ่งถึงยอดถัดไป","mis":"อย่าวัดยอดถึงท้องเป็นหนึ่งความยาวคลื่น","formula":"","code":"G3U3L1S4"},{"title":"ความถี่และคาบ","body":"ความถี่ f คือจำนวนรอบต่อวินาที หน่วย Hz คาบ T คือเวลาต่อหนึ่งรอบ และ T=1/f","example":"5 Hz → T=0.2 s","mis":"ความถี่สูงหมายถึงคาบสั้น","formula":"T = 1/f","code":"G3U3L1S5"},{"title":"อัตราเร็วคลื่น","body":"v=fλ เชื่อมอัตราเร็ว ความถี่ และความยาวคลื่น เมื่อคลื่นเปลี่ยนตัวกลางความถี่จากแหล่งกำเนิดมักคงเดิมแต่อัตราเร็วและ λ เปลี่ยน","example":"f=5 Hz, λ=2 m → v=10 m/s","mis":"อย่าเปลี่ยน f โดยไม่มีเหตุเมื่อผ่านตัวกลาง","formula":"v = fλ","code":"G3U3L1S6"},{"title":"คลื่นแม่เหล็กไฟฟ้า","body":"เกิดจากสนามไฟฟ้าและแม่เหล็กเปลี่ยนแปลง เดินทางในสุญญากาศได้และในสุญญากาศมีอัตราเร็วเท่ากันทุกช่วงสเปกตรัม","example":"แสงจากดวงอาทิตย์เดินทางผ่านอวกาศ","mis":"สีต่างกันไม่ได้เดินทางเร็วต่างกันในสุญญากาศ","formula":"","code":"G3U3L1S7"},{"title":"สเปกตรัมแม่เหล็กไฟฟ้า","body":"เรียงจากความถี่ต่ำไปสูง: วิทยุ ไมโครเวฟ อินฟราเรด แสงเห็นได้ อัลตราไวโอเลต เอกซ์ แกมมา พลังงานโฟตอนเพิ่มตามความถี่","example":"X-ray ใช้ภาพทางการแพทย์แต่ต้องจำกัดปริมาณรับ","mis":"คำว่า radiation ไม่ได้หมายถึงรังสีไอออไนซ์ทั้งหมด","formula":"","code":"G3U3L1S8"}],"G3U3L2":[{"title":"การเดินทางของแสง","body":"แสงเดินทางเป็นเส้นตรงในตัวกลางสม่ำเสมอและใช้รังสีแทนทิศการเดินทางในแบบจำลอง","example":"เงาเกิดเพราะแสงไม่อ้อมวัตถุใหญ่ชัดเจนในแบบเรขาคณิต","mis":"รังสีเป็นเส้นแบบจำลองไม่ใช่เส้นที่จับได้","formula":"","code":"G3U3L2S1"},{"title":"กฎการสะท้อน","body":"มุมตกกระทบเท่ากับมุมสะท้อนเมื่อวัดจากเส้นปกติ รังสีตกกระทบ รังสีสะท้อน และเส้นปกติอยู่ในระนาบเดียวกัน","example":"มุมตก 35° → มุมสะท้อน 35°","mis":"อย่าวัดจากผิวกระจก","formula":"","code":"G3U3L2S2"},{"title":"กระจกเงาราบ","body":"ให้ภาพเสมือน หัวตั้ง ขนาดเท่าวัตถุ ระยะภาพหลังกระจกเท่าระยะวัตถุหน้ากระจก และกลับซ้ายขวาเชิงการรับรู้","example":"ยืน 2 m หน้ากระจก ภาพอยู่ 2 m หลังกระจก","mis":"ภาพเสมือนไม่รวมแสงจริงบนฉาก","formula":"","code":"G3U3L2S3"},{"title":"กระจกเว้า","body":"รวมรังสีขนานสู่โฟกัส ให้ภาพจริงหรือเสมือนตามตำแหน่งวัตถุ ใช้รังสีหลักช่วยวาดภาพ","example":"วัตถุนอกจุดโฟกัสบางตำแหน่งได้ภาพจริงกลับหัว","mis":"อย่าจำชนิดภาพโดยไม่ดูตำแหน่งวัตถุ","formula":"","code":"G3U3L2S4"},{"title":"กระจกนูน","body":"กระจายรังสีเสมือนออกจากโฟกัสหลังกระจก ให้ภาพเสมือน หัวตั้ง และเล็กลงสำหรับวัตถุจริงทั่วไป จึงเห็นมุมกว้าง","example":"กระจกมองข้างรถ","mis":"ภาพเล็กทำให้กะระยะผิดได้","formula":"","code":"G3U3L2S5"},{"title":"การหักเห","body":"เมื่อแสงผ่านตัวกลางที่อัตราเร็วต่างกัน ทิศเปลี่ยนยกเว้นตกตั้งฉาก เข้าตัวกลางดัชนีสูงกว่าจะเบนเข้าใกล้เส้นปกติ","example":"หลอดในน้ำดูหัก","mis":"แสงไม่ได้หักเพราะชนผิวแล้วเด้งแบบสะท้อน","formula":"","code":"G3U3L2S6"},{"title":"ดัชนีหักเห","body":"n=c/v บอกว่าแสงช้าลงกว่าสุญญากาศเท่าใด ตัวกลางดัชนีสูงมีอัตราเร็วแสงต่ำกว่า","example":"แก้วมี n มากกว่าอากาศ","mis":"ดัชนีไม่ใช่ความหนาแน่นมวลโดยตรง","formula":"n = c/v","code":"G3U3L2S7"},{"title":"การสะท้อนกลับหมด","body":"เกิดเมื่อแสงเดินจากตัวกลางดัชนีสูงไปต่ำและมุมตกกระทบมากกว่ามุมวิกฤต แสงสะท้อนกลับทั้งหมด","example":"ใยแก้วนำแสงใช้หลักนี้","mis":"ไม่เกิดเมื่อเดินจากดัชนีต่ำไปสูง","formula":"","code":"G3U3L2S8"},{"title":"เลนส์นูน","body":"เลนส์นูนรวมแสง รังสีขนานผ่านโฟกัสหลังเลนส์ ให้ภาพจริงหรือเสมือนตามระยะวัตถุ","example":"แว่นขยายวางวัตถุภายในโฟกัสให้ภาพเสมือนขยาย","mis":"เลนส์นูนไม่ได้ให้ภาพขยายทุกตำแหน่ง","formula":"","code":"G3U3L2S9"},{"title":"เลนส์เว้า","body":"เลนส์เว้ากระจายแสง รังสีขนานดูเสมือนออกจากโฟกัสหน้าเลนส์ ให้ภาพเสมือน หัวตั้ง เล็กลงสำหรับวัตถุจริง","example":"แว่นแก้สายตาสั้นใช้เลนส์กระจายตามหลักพื้นฐาน","mis":"อย่าสลับโฟกัสจริง/เสมือน","formula":"","code":"G3U3L2S10"},{"title":"การมองเห็นและความสว่าง","body":"มองเห็นเมื่อแสงจากแหล่งกำเนิดหรือสะท้อนจากวัตถุเข้าสู่ตา แสงจ้าหรือมืดเกินทำให้ตาล้า ควรจัดแสงเหมาะและลดแสงสะท้อน","example":"หน้าจอในห้องมืดมากอาจทำให้ไม่สบายตา","mis":"ตาไม่ได้ปล่อยแสงออกไปเห็นวัตถุ","formula":"","code":"G3U3L2S11"}],"G3U4L1":[{"title":"แรงโน้มถ่วงในระบบสุริยะ","body":"ดวงอาทิตย์มีมวลมากจึงสร้างแรงโน้มถ่วงดึงดาวเคราะห์ ดาวเคราะห์และดวงจันทร์ก็ดึงดูดกัน แรงลดลงเมื่อระยะเพิ่ม","example":"แรงโน้มถ่วงยึดโลกในวงโคจร","mis":"อวกาศไม่ได้ไม่มีแรงโน้มถ่วง","formula":"","code":"G3U4L1S1"},{"title":"วงโคจร","body":"วัตถุโคจรเพราะมีความเร็วด้านข้างขณะถูกแรงโน้มถ่วงดึงเข้าศูนย์กลาง จึงเกิดการตกอย่างต่อเนื่องรอบวัตถุแม่","example":"ดาวเทียมตกไปรอบโลกโดยไม่ชนพื้น","mis":"ไม่มีแรงขับตลอดเวลาไม่ได้แปลว่าจะตกลงตรง ๆ","formula":"","code":"G3U4L1S2"},{"title":"แกนโลกเอียง","body":"แกนหมุนโลกเอียงประมาณ 23.5° เทียบกับแนวตั้งฉากของระนาบวงโคจร ทำให้ซีกโลกได้รับมุมแสงและช่วงกลางวันต่างกันตลอดปี","example":"มิถุนายนซีกเหนือเอียงเข้าหาดวงอาทิตย์มากกว่า","mis":"ฤดูไม่เกิดจากระยะโลก-ดวงอาทิตย์เป็นหลัก","formula":"","code":"G3U4L1S3"},{"title":"ฤดู","body":"เมื่อซีกโลกเอียงเข้าหาดวงอาทิตย์ แสงตกตรงขึ้นและกลางวันนานขึ้น จึงรับพลังงานต่อพื้นที่มากขึ้น เกิดฤดูตรงข้ามกันระหว่างซีกโลก","example":"ธันวาคมซีกโลกใต้เป็นฤดูร้อน","mis":"ทั้งโลกไม่ได้มีฤดูเดียวกันพร้อมกัน","formula":"","code":"G3U4L1S4"},{"title":"เส้นทางปรากฏดวงอาทิตย์","body":"จุดขึ้น-ตกและความสูงเที่ยงวันเปลี่ยนตามฤดูกาลและละติจูด เป็นผลจากการหมุนโลก แกนเอียง และการโคจร","example":"เงาเที่ยงวันยาวต่างกันตามฤดู","mis":"การเคลื่อนปรากฏรายวันไม่ได้แปลว่าดวงอาทิตย์หมุนรอบโลก","formula":"","code":"G3U4L1S5"},{"title":"ข้างขึ้นข้างแรม","body":"ดวงจันทร์ครึ่งหนึ่งได้รับแสงเสมอ แต่เรามองเห็นส่วนสว่างต่างสัดส่วนเมื่อดวงจันทร์เปลี่ยนตำแหน่งรอบโลก","example":"เดือนดับอยู่ใกล้แนวโลก-ดวงอาทิตย์ด้านเดียวกัน","mis":"ไม่ใช่เงาโลกบัง ยกเว้นจันทรุปราคา","formula":"","code":"G3U4L1S6"},{"title":"น้ำขึ้นน้ำลง","body":"แรงโน้มถ่วงของดวงจันทร์ทำให้เกิดป่องน้ำสองด้านร่วมกับการเคลื่อนของระบบโลก-ดวงจันทร์ ดวงอาทิตย์เสริม/หักล้างบางส่วน","example":"วันเดือนดับ/วันเพ็ญเกิดน้ำเกิดช่วงต่างระดับมาก","mis":"เวลาน้ำขึ้นจริงขึ้นกับชายฝั่งและภูมิประเทศด้วย","formula":"","code":"G3U4L1S7"},{"title":"ดาวเทียม","body":"ดาวเทียมวงโคจรต่างระดับเหมาะกับงานต่างกัน เช่น สื่อสาร อุตุนิยมวิทยา สำรวจโลก นำทาง","example":"ดาวเทียมค้างฟ้าดูเหมือนอยู่ตำแหน่งเดิมเหนือเส้นศูนย์สูตร","mis":"ดาวเทียมทุกดวงไม่ได้ค้างฟ้า","formula":"","code":"G3U4L1S8"},{"title":"เทคโนโลยีอวกาศและข้อมูล","body":"กล้องโทรทรรศน์ ยานสำรวจ และดาวเทียมเก็บคลื่นแม่เหล็กไฟฟ้า/ข้อมูลจากระยะไกล ช่วยทดสอบแบบจำลองทางดาราศาสตร์และติดตามโลก","example":"ภาพดาวเทียมใช้ติดตามพายุ","mis":"ภาพสีดาวเทียมบางชนิดเป็นสีผสมเพื่อเน้นข้อมูล","formula":"","code":"G3U4L1S9"},{"title":"ขยะอวกาศและข้อจำกัด","body":"การใช้วงโคจรเพิ่มความเสี่ยงการชนและขยะอวกาศ ต้องออกแบบภารกิจ การลดเศษซาก และการจัดการเมื่อหมดอายุ","example":"ดาวเทียมบางดวงลดวงโคจรให้เผาไหม้ในบรรยากาศ","mis":"เทคโนโลยีอวกาศมีทั้งประโยชน์และต้นทุน","formula":"","code":"G3U4L1S10"}],"G3U5L1":[{"title":"การเปลี่ยนแปลงทางเคมี","body":"ปฏิกิริยาเคมีทำให้สารตั้งต้นเปลี่ยนเป็นผลิตภัณฑ์ที่มีองค์ประกอบหรือโครงสร้างใหม่ แตกต่างจากการเปลี่ยนสถานะทางกายภาพ","example":"เผาแมกนีเซียมเกิดสารใหม่","mis":"น้ำแข็งละลายไม่ใช่ปฏิกิริยาเคมี","formula":"","code":"G3U5L1S1"},{"title":"หลักฐานการเกิดปฏิกิริยา","body":"การเกิดแก๊ส ตะกอน สี กลิ่น แสง หรืออุณหภูมิเปลี่ยนอาจเป็นหลักฐาน แต่ควรพิจารณาร่วมกับบริบทเพราะบางการเปลี่ยนแปลงทางกายภาพก็ให้สัญญาณคล้ายกัน","example":"ฟองจากกรดกับโลหะเป็นแก๊สผลิตภัณฑ์","mis":"เดือดจากให้ความร้อนไม่ใช่หลักฐานเคมีเสมอ","formula":"","code":"G3U5L1S2"},{"title":"สมการข้อความ","body":"เขียนสารตั้งต้น → ผลิตภัณฑ์ช่วยสื่อสารว่าอะไรเปลี่ยนเป็นอะไร และเป็นฐานก่อนเรียนสมการเคมีเชิงสัญลักษณ์","example":"กรด + เบส → เกลือ + น้ำ","mis":"ลูกศรไม่ได้แปลว่าเท่ากับ","formula":"","code":"G3U5L1S3"},{"title":"กฎอนุรักษ์มวล","body":"ในระบบปิด มวลรวมก่อนและหลังปฏิกิริยาเท่ากันเพราะอะตอมไม่ได้หายหรือเกิดใหม่ เพียงจัดเรียงตัวใหม่","example":"ปฏิกิริยาในถุงปิดชั่งมวลเท่าเดิม","mis":"ระบบเปิดอาจมวลชั่งเปลี่ยนเพราะแก๊สเข้า/ออก","formula":"","code":"G3U5L1S4"},{"title":"คายและดูดความร้อน","body":"ปฏิกิริยาคายความร้อนถ่ายพลังงานสู่สิ่งแวดล้อม อุณหภูมิรอบระบบมักเพิ่ม; ดูดความร้อนรับพลังงาน อุณหภูมิมักลด","example":"ถุงประคบร้อน/เย็นบางชนิดใช้ปฏิกิริยา","mis":"อุณหภูมิเปลี่ยนต้องดูทิศพลังงานให้ถูก","formula":"","code":"G3U5L1S5"},{"title":"กรดและเบส","body":"สารละลายกรดและเบสมีสมบัติต่างกัน วัดด้วยตัวบ่งชี้หรือ pH ปฏิกิริยาการเป็นกลางระหว่างกรดกับเบสให้เกลือและน้ำตามกรณี","example":"HCl + NaOH → เกลือ + น้ำ","mis":"สารเป็นกลางไม่ได้แปลว่าไม่มีไอออน","formula":"","code":"G3U5L1S6"},{"title":"กรดกับโลหะ","body":"กรดหลายชนิดทำปฏิกิริยากับโลหะบางชนิดเกิดเกลือและแก๊สไฮโดรเจน อัตราขึ้นกับชนิดโลหะ ความเข้มข้น และพื้นที่ผิว","example":"สังกะสีกับกรดเกิดฟอง H₂","mis":"โลหะทุกชนิดไม่ได้ทำปฏิกิริยาเท่ากัน","formula":"","code":"G3U5L1S7"},{"title":"เบสกับโลหะบางชนิด","body":"เบสเข้มข้นบางชนิดทำปฏิกิริยากับโลหะบางประเภท เช่น อะลูมิเนียม ต้องทดลองด้วยความระมัดระวัง","example":"อะลูมิเนียมกับ NaOH ในเงื่อนไขเหมาะเกิดแก๊ส","mis":"อย่าเหมารวมเบสทุกชนิดกับโลหะทุกชนิด","formula":"","code":"G3U5L1S8"},{"title":"สนิมเหล็ก","body":"เหล็กเกิดออกซิเดชันเมื่อมีออกซิเจนและน้ำ/ความชื้น การเคลือบ ทาสี ชุบน้ำมัน หรือใช้โลหะป้องกันช่วยลดการสัมผัสหรือเปลี่ยนปฏิกิริยา","example":"ตะปูแห้งและไร้ออกซิเจนเกิดสนิมช้ากว่า","mis":"สนิมไม่ใช่เพียงเหล็กเปลี่ยนสี","formula":"","code":"G3U5L1S9"},{"title":"ประโยชน์และผลกระทบ","body":"ปฏิกิริยาใช้ผลิตอาหาร วัสดุ ยา และพลังงาน แต่ก็สร้างมลพิษ การกัดกร่อน หรือของเสีย การออกแบบกระบวนการต้องลดความเสี่ยง","example":"ตัวเร่งช่วยลดพลังงาน/เวลาบางกระบวนการ","mis":"ประโยชน์ทางเศรษฐกิจไม่ใช่เกณฑ์เดียว","formula":"","code":"G3U5L1S10"}],"G3U5L2":[{"title":"แนวคิดการเลือกวัสดุ","body":"เลือกวัสดุจากสมบัติที่เกี่ยวกับงาน เช่น ความแข็ง ความเหนียว การนำไฟฟ้า ความหนาแน่น ทนร้อน ทนสารเคมี ราคา และผลกระทบ","example":"ขวดน้ำต้องเบา ทนแตก และปลอดภัย","mis":"วัสดุแข็งที่สุดไม่ได้ดีที่สุดทุกงาน","formula":"","code":"G3U5L2S1"},{"title":"พอลิเมอร์","body":"โมเลกุลสายยาวเกิดจากหน่วยย่อยซ้ำ ทำให้ปรับสมบัติได้กว้าง เช่น ยืดหยุ่น ใส แข็ง หรือทนสารเคมี","example":"PE ใช้ถุง/ภาชนะหลายชนิด","mis":"พลาสติกทุกชนิดรีไซเคิลเหมือนกันไม่ได้","formula":"","code":"G3U5L2S2"},{"title":"เทอร์โมพลาสติกและเทอร์โมเซต","body":"เทอร์โมพลาสติกอ่อนตัวเมื่อร้อนและขึ้นรูปซ้ำได้หลายชนิด ส่วนเทอร์โมเซตมีโครงข่ายถาวรและไม่หลอมขึ้นรูปซ้ำง่าย","example":"ฝาขวดกับด้ามหม้ออาจใช้พอลิเมอร์ต่างกลุ่ม","mis":"ความร้อนสูงอาจทำให้สลายไม่ใช่หลอม","formula":"","code":"G3U5L2S3"},{"title":"เซรามิก","body":"วัสดุอนินทรีย์ที่ผ่านความร้อน มักแข็ง ทนสึก ทนร้อน และเป็นฉนวน แต่เปราะและแตกเมื่อกระแทก","example":"กระเบื้องและฉนวนไฟฟ้า","mis":"แข็งกับเหนียวเป็นคนละสมบัติ","formula":"","code":"G3U5L2S4"},{"title":"โลหะ","body":"พันธะโลหะทำให้โลหะหลายชนิดนำไฟฟ้า/ความร้อนดี เหนียวและขึ้นรูปได้ แต่ความหนาแน่นและการกัดกร่อนต่างกัน","example":"อะลูมิเนียมเบา เหล็กแข็งแรง ทองแดงนำไฟดี","mis":"โลหะทุกชนิดเป็นแม่เหล็กไม่ได้","formula":"","code":"G3U5L2S5"},{"title":"โลหะผสม","body":"ผสมโลหะหรือธาตุอื่นเพื่อปรับสมบัติ เช่น เพิ่มความแข็ง ทนกัดกร่อน หรือเปลี่ยนจุดหลอมเหลว","example":"สเตนเลสทนสนิมกว่าเหล็กกล้าบางชนิด","mis":"โลหะผสมไม่ใช่สารบริสุทธิ์","formula":"","code":"G3U5L2S6"},{"title":"วัสดุผสม","body":"รวมวัสดุสองชนิดขึ้นไปโดยยังมีเฟสต่างกัน เพื่อให้สมบัติรวมดีขึ้น เช่น เส้นใยรับแรงในเมทริกซ์","example":"คอนกรีตเสริมเหล็กและไฟเบอร์กลาส","mis":"สมบัติไม่ได้เป็นค่าเฉลี่ยง่าย ๆ","formula":"","code":"G3U5L2S7"},{"title":"ผลกระทบตลอดวงจรชีวิต","body":"ประเมินตั้งแต่การได้วัตถุดิบ การผลิต การขนส่ง การใช้งาน ไปจนถึงการซ่อม ใช้ซ้ำ รีไซเคิล หรือกำจัด","example":"วัสดุเบาอาจลดพลังงานขนส่ง","mis":"วัสดุรีไซเคิลได้แต่ไม่มีระบบเก็บก็อาจไม่ถูกรีไซเคิล","formula":"","code":"G3U5L2S8"}],"G3U6L1":[{"title":"วงจรไฟฟ้า","body":"กระแสไหลได้เมื่อมีเส้นทางปิดและแหล่งกำเนิดสร้างความต่างศักย์ วงจรประกอบด้วยแหล่งจ่าย สาย และอุปกรณ์ใช้พลังงาน","example":"เมื่อหน้าสัมผัสสวิตช์แยกจากกัน วงจรขาดและกระแสหยุดไหล","mis":"คำว่า “ไฟไหลจากแบตเตอรี่หมด” ไม่ใช่แบบจำลองที่ดี","formula":"","code":"G3U6L1S1"},{"title":"กระแสไฟฟ้า","body":"กระแส I คืออัตราการไหลของประจุ I=Q/t หน่วยแอมแปร์ แอมมิเตอร์ต้องต่ออนุกรมและมีความต้านทานต่ำ","example":"ประจุ 10 C ผ่าน 2 s → 5 A","mis":"อย่าต่อแอมมิเตอร์คร่อมแหล่งจ่ายโดยตรง","formula":"I = Q/t","code":"G3U6L1S2"},{"title":"ทิศกระแสและอิเล็กตรอน","body":"ทิศกระแสแบบดั้งเดิมภายนอกแหล่งจ่ายกำหนดจากขั้วบวกไปลบ ขณะที่อิเล็กตรอนในโลหะเคลื่อนโดยเฉลี่ยจากลบไปบวก","example":"ใช้ทิศกระแสมาตรฐานในการวิเคราะห์วงจร","mis":"อย่าสลับทิศจนคำนวณเครื่องหมายหรือทิศทางในวงจรผิด","formula":"","code":"G3U6L1S3"},{"title":"ความต่างศักย์","body":"V คือพลังงานต่อประจุระหว่างสองจุด วัดด้วยโวลต์มิเตอร์ต่อขนานคร่อมอุปกรณ์","example":"แบตเตอรี่ 1.5 V ให้พลังงาน 1.5 J ต่อ 1 C โดยอุดมคติ","mis":"โวลต์มิเตอร์ไม่ได้วัดกระแส","formula":"","code":"G3U6L1S4"},{"title":"ความต้านทาน","body":"R บอกการขัดขวางกระแส ขึ้นกับวัสดุ รูปร่าง และอุณหภูมิ ตัวต้านทานใช้ควบคุมกระแสในวงจร","example":"ลวดยาว/บางมักต้านทานมากขึ้น","mis":"R ไม่ใช่การสูญเสียประจุ","formula":"","code":"G3U6L1S5"},{"title":"กฎของโอห์ม","body":"สำหรับตัวนำโอห์มิกที่อุณหภูมิคงที่ V=IR กราฟ V-I เป็นเส้นตรงผ่านจุดกำเนิดและความชันสัมพันธ์กับ R ตามแกนที่เลือก","example":"12 V กับ 6 Ω → 2 A","mis":"ต้องดูว่าแกนกราฟเป็น V เทียบ I หรือ I เทียบ V","formula":"V = IR","code":"G3U6L1S6"},{"title":"วงจรอนุกรม","body":"อุปกรณ์ต่อเส้นทางเดียว กระแสเท่ากันทุกจุด ความต่างศักย์รวมเท่าผลรวมคร่อมอุปกรณ์ และความต้านทานรวมเพิ่ม","example":"R 2Ω + 3Ω อนุกรม → 5Ω","mis":"แรงดันไม่ได้เท่ากันทุกตัวถ้า R ต่างกัน","formula":"","code":"G3U6L1S7"},{"title":"วงจรขนาน","body":"อุปกรณ์ต่อคร่อมจุดคู่เดียวกัน ความต่างศักย์แต่ละแขนงเท่ากับแหล่งจ่าย กระแสรวมเป็นผลรวมแขนง ความต้านทานรวมลดลง","example":"เครื่องใช้ในบ้านต่อขนาน","mis":"กระแสแขนงไม่จำเป็นเท่ากัน","formula":"","code":"G3U6L1S8"},{"title":"การต่อมิเตอร์","body":"แอมมิเตอร์อนุกรมกับส่วนที่วัดกระแส โวลต์มิเตอร์ขนานคร่อมส่วนที่วัดความต่างศักย์ ต้องเลือกช่วงวัดและขั้วให้เหมาะ","example":"วงจรทดลอง V-I ต้องวัดพร้อมกันหลายค่า","mis":"ต่อผิดอาจทำให้เครื่องมือเสียหาย","formula":"","code":"G3U6L1S9"},{"title":"ความปลอดภัย","body":"กระแสสูงทำให้ร้อนและอันตราย ฟิวส์/เบรกเกอร์ช่วยตัดเมื่อกระแสเกิน ฉนวนและสายดินช่วยลดความเสี่ยง","example":"ไม่จับอุปกรณ์ไฟฟ้าด้วยมือเปียก","mis":"แรงดันและกระแสทั้งคู่เกี่ยวข้องกับอันตราย","formula":"","code":"G3U6L1S10"}],"G3U6L2":[{"title":"กำลังไฟฟ้า","body":"กำลังคืออัตราการเปลี่ยน/ใช้พลังงาน P=VI หน่วยวัตต์ เครื่องกำลังสูงใช้พลังงานต่อเวลามากกว่าเมื่อทำงานที่ค่ากำหนด","example":"เครื่อง 1000 W ใช้พลังงาน 1000 J ต่อวินาที","mis":"กำลังไม่ใช่พลังงานรวม","formula":"P = VI","code":"G3U6L2S1"},{"title":"พลังงานไฟฟ้า","body":"E=Pt ถ้า P เป็น kW และ t เป็นชั่วโมง จะได้ kWh ซึ่งเป็นหน่วยที่ใช้คิดค่าไฟ","example":"1 kW เปิด 2 h = 2 kWh","mis":"kWh เป็นหน่วยพลังงาน ไม่ใช่กำลัง","formula":"E = Pt","code":"G3U6L2S2"},{"title":"ค่าไฟและการประหยัด","body":"พลังงานรวมขึ้นกับกำลังและเวลา จึงลดการใช้ได้ทั้งเลือกอุปกรณ์ประสิทธิภาพดีและลดเวลาทำงานที่ไม่จำเป็น","example":"แอร์ 1000 W เปิด 8 h ใช้มากกว่า 2000 W เปิด 1 h","mis":"อย่าดูแต่เลขวัตต์","formula":"","code":"G3U6L2S3"},{"title":"ตัวต้านทาน","body":"ใช้จำกัดกระแส แบ่งแรงดัน และกำหนดสภาวะวงจร เลือกค่าความต้านทานและกำลังวัตต์ให้เหมาะ","example":"ต่อ R กับ LED เพื่อจำกัดกระแส","mis":"ตัวต้านทานไม่สร้างพลังงาน","formula":"","code":"G3U6L2S4"},{"title":"ไดโอด","body":"รอยต่อสารกึ่งตัวนำยอมให้กระแสไหลดีในทิศ forward มากกว่า reverse ใช้เรียงกระแสและป้องกันกลับขั้ว","example":"LED เป็นไดโอดที่ปล่อยแสง","mis":"ไดโอดไม่ใช่สวิตช์สมบูรณ์แบบทุกเงื่อนไข","formula":"","code":"G3U6L2S5"},{"title":"LED","body":"LED ต้องต่อขั้วถูกและจำกัดกระแส สีต่างชนิดมีแรงดันตกคร่อมต่างกัน","example":"ต่อ LED กับตัวต้านทานอนุกรม","mis":"ต่อแบตเตอรี่ตรงโดยไม่มีการจำกัดกระแสอาจเสีย","formula":"","code":"G3U6L2S6"},{"title":"ตัวเก็บประจุ","body":"เก็บประจุและพลังงานในสนามไฟฟ้าระหว่างแผ่น ใช้กรอง หน่วงเวลา หรือเก็บพลังงานช่วงสั้น","example":"แฟลชกล้องใช้ตัวเก็บประจุ","mis":"ตัวเก็บประจุไม่เหมือนแบตเตอรี่","formula":"","code":"G3U6L2S7"},{"title":"ทรานซิสเตอร์","body":"อุปกรณ์สารกึ่งตัวนำใช้ควบคุมกระแส/แรงดัน เป็นสวิตช์หรือขยายสัญญาณ ทำให้วงจรดิจิทัลและอิเล็กทรอนิกส์สมัยใหม่เป็นไปได้","example":"สัญญาณเล็กควบคุมโหลดใหญ่ผ่านทรานซิสเตอร์","mis":"ไม่ควรเข้าใจเป็นสวิตช์กลธรรมดา","formula":"","code":"G3U6L2S8"},{"title":"วงจรประยุกต์","body":"การออกแบบวงจรต้องเชื่อมแหล่งจ่าย อุปกรณ์ควบคุม ตัวป้องกัน และโหลด พร้อมคำนวณค่าที่ไม่เกินพิกัด","example":"วงจร LED มีแหล่งจ่าย สวิตช์ R และ LED","mis":"ค่าพิกัดของอุปกรณ์สำคัญต่อความปลอดภัย","formula":"","code":"G3U6L2S9"}],"G3U7L1":[{"title":"องค์ประกอบชีวภาพและกายภาพ","body":"ระบบนิเวศมีสิ่งมีชีวิต เช่น ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย และปัจจัยกายภาพ เช่น แสง น้ำ อุณหภูมิ ดิน ทั้งสองส่วนมีปฏิสัมพันธ์กัน","example":"ปริมาณแสงมีผลต่อพืชน้ำและต่อผู้บริโภคต่อเนื่อง","mis":"อย่ามองสิ่งมีชีวิตแยกจากสิ่งแวดล้อม","formula":"","code":"G3U7L1S1"},{"title":"ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย","body":"ผู้ผลิตใช้พลังงาน เช่น พลังงานแสง สร้างสารอินทรีย์จากสารอนินทรีย์ ผู้บริโภครับพลังงานจากอาหาร ผู้ย่อยสลายย่อยซากคืนสารอาหารสู่ระบบ","example":"เห็ดราเป็นผู้ย่อยสลายหลายชนิด","mis":"ผู้ย่อยสลายคืนสารอาหารสู่ระบบ แต่ไม่ทำให้พลังงานหมุนเวียนกลับเหมือนสาร","formula":"","code":"G3U7L1S2"},{"title":"โซ่อาหาร","body":"โซ่อาหารแสดงเส้นทางการถ่ายทอดพลังงานแบบเส้นเดียว ลูกศรชี้จากสิ่งที่ถูกกินไปยังผู้กิน","example":"หญ้า → ตั๊กแตน → กบ → งู","mis":"ลูกศรไม่ได้ชี้ว่าใครล่าใครจากผู้ล่าไปเหยื่อ","formula":"","code":"G3U7L1S3"},{"title":"สายใยอาหาร","body":"ในธรรมชาติสิ่งมีชีวิตกินอาหารหลายชนิด โซ่หลายเส้นเชื่อมเป็นสายใย การเปลี่ยนประชากรหนึ่งชนิดจึงกระทบหลายเส้นทาง","example":"กบลดอาจทำให้แมลงเพิ่มและผู้ล่ากบลด","mis":"อย่าทำนายผลจากเส้นทางเดียว","formula":"","code":"G3U7L1S4"},{"title":"การถ่ายทอดพลังงาน","body":"พลังงานที่ถ่ายทอดไปยังลำดับการกินถัดไปลดลง เพราะสิ่งมีชีวิตใช้พลังงานในการดำรงชีวิตและพลังงานบางส่วนกระจายสู่สิ่งแวดล้อมเป็นความร้อน","example":"ผู้ผลิตต้องมีพลังงานมากเพื่อรองรับผู้บริโภค","mis":"พลังงานไม่หมุนเวียนเหมือนสาร","formula":"","code":"G3U7L1S5"},{"title":"การหมุนเวียนสาร","body":"ธาตุอาหารและสสารหมุนเวียนผ่านสิ่งมีชีวิตและสิ่งแวดล้อม ผู้ย่อยสลายมีบทบาทคืนสารอนินทรีย์","example":"คาร์บอนจากซากกลับสู่ระบบ","mis":"อย่าสับสนการหมุนเวียนสารกับการไหลพลังงาน","formula":"","code":"G3U7L1S6"},{"title":"การสะสมสารพิษ","body":"สารสลายยากบางชนิดสะสมในร่างกายและมีความเข้มข้นสูงขึ้นตามลำดับการกินเมื่อผู้ล่ากินเหยื่อจำนวนมาก","example":"ปรอทในห่วงโซ่อาหารน้ำ","mis":"สารทุกชนิดไม่ได้เกิด biomagnification","formula":"","code":"G3U7L1S7"},{"title":"ผู้ล่า–เหยื่อและการแข่งขัน","body":"ผู้ล่ากินเหยื่อ ส่วนการแข่งขันเกิดเมื่อทรัพยากรจำกัดและสิ่งมีชีวิตใช้ทรัพยากรเดียวกัน","example":"ต้นไม้แข่งขันแสงและน้ำ","mis":"การแข่งขันไม่ได้แปลว่าต้องต่อสู้โดยตรง","formula":"","code":"G3U7L1S8"},{"title":"พึ่งพา อิงอาศัย ปรสิต","body":"ภาวะพึ่งพาได้ประโยชน์ทั้งคู่ อิงอาศัยฝ่ายหนึ่งได้ประโยชน์อีกฝ่ายไม่ค่อยได้รับผล ปรสิตฝ่ายหนึ่งได้ประโยชน์อีกฝ่ายเสียประโยชน์","example":"เห็บกับสุนัขเป็นปรสิต","mis":"ต้องดูผลต่อทั้งสองฝ่าย","formula":"","code":"G3U7L1S9"}],"G3U7L2":[{"title":"ความหลากหลายทางพันธุกรรม","body":"ความแตกต่างของยีน/แอลลีลภายในชนิดทำให้บุคคลมีลักษณะแตกต่างและเพิ่มโอกาสที่ประชากรบางส่วนจะทนการเปลี่ยนแปลง","example":"พันธุ์ข้าวหลายพันธุ์ในชนิดเดียวกัน","mis":"จำนวนพันธุ์ชื่อการค้าอย่างเดียวไม่ได้บอกความหลากหลายทั้งหมด","formula":"","code":"G3U7L2S1"},{"title":"ความหลากหลายของชนิดพันธุ์","body":"พิจารณาทั้งจำนวนชนิดและความสม่ำเสมอของจำนวนแต่ละชนิด พื้นที่ที่มี 10 ชนิดแต่ชนิดหนึ่งครองเกือบทั้งหมดอาจต่างจากพื้นที่ที่กระจายสมดุล","example":"สำรวจจำนวนชนิดในแปลงตัวอย่าง","mis":"จำนวนตัวทั้งหมดไม่เท่าความหลากหลายชนิด","formula":"","code":"G3U7L2S2"},{"title":"ความหลากหลายของระบบนิเวศ","body":"หมายถึงความหลากหลายของถิ่นอาศัยและระบบนิเวศ เช่น ป่าดิบ ทุ่งหญ้า ชายเลน แนวปะการัง แต่ละระบบมีเงื่อนไขและชุมชนต่างกัน","example":"จังหวัดหนึ่งมีทั้งป่าและพื้นที่ชุ่มน้ำ","mis":"ไม่ใช่การนับชนิดอย่างเดียว","formula":"","code":"G3U7L2S3"},{"title":"ความสำคัญ","body":"ความหลากหลายช่วยการทำงานของระบบนิเวศ แหล่งอาหาร ยา พันธุกรรม การผสมเกสร การควบคุมศัตรู และความยืดหยุ่นต่อการรบกวน","example":"ความหลากหลายแมลงผสมเกสรช่วยพืชหลายชนิด","mis":"ระบบที่หลากหลายไม่ได้คงที่ไม่เปลี่ยนเลย","formula":"","code":"G3U7L2S4"},{"title":"สาเหตุการสูญเสีย","body":"การทำลายถิ่นอาศัย ใช้ทรัพยากรเกิน ชนิดต่างถิ่นรุกราน มลพิษ และการเปลี่ยนแปลงภูมิอากาศเป็นแรงกดดันสำคัญ","example":"ถนนแบ่งป่าเป็นหย่อมเล็ก ๆ","mis":"ปัจจัยหลายอย่างอาจเสริมกัน","formula":"","code":"G3U7L2S5"},{"title":"การอนุรักษ์ในถิ่นและนอกถิ่น","body":"อนุรักษ์ในถิ่นรักษาชนิดพร้อมระบบนิเวศ เช่น เขตคุ้มครอง ส่วนนอกถิ่น เช่น สวนพฤกษศาสตร์ ธนาคารเมล็ด ใช้เสริมเมื่อจำเป็น","example":"ธนาคารเมล็ดเก็บความหลากหลายพันธุกรรม","mis":"การเลี้ยงในสวนสัตว์อย่างเดียวไม่รักษาระบบนิเวศ","formula":"","code":"G3U7L2S6"},{"title":"ใช้ทรัพยากรอย่างยั่งยืน","body":"กำหนดอัตราใช้ไม่เกินการฟื้นตัว ลดของเสีย และให้ชุมชนมีส่วนร่วม ใช้ข้อมูลติดตามผลปรับการจัดการ","example":"กำหนดฤดูปิดจับสัตว์น้ำ","mis":"คำว่าอนุรักษ์ไม่ได้หมายถึงห้ามใช้ทุกอย่าง","formula":"","code":"G3U7L2S7"},{"title":"ตัดสินใจจากหลักฐาน","body":"เปรียบเทียบผลทางนิเวศ เศรษฐกิจ และสังคมของทางเลือก พร้อมระบุความไม่แน่นอนและติดตามผลหลังดำเนินการ","example":"โครงการท่องเที่ยวเชิงนิเวศต้องวัดผลต่อชนิดพันธุ์และรายได้ชุมชน","mis":"อย่าตัดสินด้วยความชอบชนิดสัตว์เพียงอย่างเดียว","formula":"","code":"G3U7L2S8"}]},"activities":{"G1U1L1":{"goal":"ออกแบบการตรวจสอบว่าปริมาณแสงสัมพันธ์กับการเจริญของต้นถั่วอย่างไร","evidence":"ความสูงของต้นถั่วจากหลายซ้ำภายใต้ชั่วโมงรับแสงที่กำหนด","conclusion":"สรุปได้เฉพาะว่าภายใต้เงื่อนไขทดลอง ปริมาณแสงที่ต่างกันสัมพันธ์กับการเจริญที่วัดได้อย่างไร","variable":"ตัวแปรต้น = ชั่วโมงรับแสง; ตัวแปรตาม = ความสูง; ควบคุมชนิดพืช น้ำ ดิน และช่วงเวลาวัด","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U2L1":{"goal":"ใช้จุดเดือด จุดหลอมเหลว และความหนาแน่นจำแนกตัวอย่างสาร","evidence":"ตารางอุณหภูมิระหว่างให้ความร้อนและค่ามวล-ปริมาตรของแต่ละตัวอย่าง","conclusion":"ตัวอย่างที่มีชุดสมบัติสอดคล้องกันมากกว่าจึงมีหลักฐานรองรับการจำแนกมากกว่า","variable":"คำนวณความหนาแน่นจากมวล/ปริมาตรและอ่านอุณหภูมิภายใต้เงื่อนไขเดียวกัน","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อมูลแล้วสรุปเฉพาะที่หลักฐานรองรับ"]},"G1U2L2":{"goal":"สร้างแบบจำลองอะตอมและใช้สมบัติเลือกวัสดุให้เหมาะกับงาน","evidence":"องค์ประกอบของแบบจำลองและตารางสมบัติการนำไฟฟ้า ความแข็ง และการขึ้นรูป","conclusion":"เลือกวัสดุจากสมบัติที่ตรงความต้องการของงาน ไม่เลือกจากชื่อวัสดุเพียงอย่างเดียว","variable":"แยกธาตุ สารประกอบ โลหะ อโลหะ และกึ่งโลหะตามเกณฑ์ที่เรียน","steps":["กำหนดสิ่งที่ต้องตรวจสอบและเงื่อนไขให้ชัด","เก็บข้อมูลด้วยวิธีเดียวกันและบันทึกอย่างเป็นระบบ","เปรียบเทียบข้อม function getP(id){let p=baseProgress();try{let raw=UNSAVED_PROGRESS.has(pkey(id))?UNSAVED_PROGRESS.get(pkey(id)):localStorage.getItem(pkey(id));if(raw===null&&SESSION.user?.id==='M20105')raw=localStorage.getItem('slh_v162_'+id);const s=JSON.parse(raw||'null');if(s&&typeof s==='object'&&!Array.isArray(s))p=deepMerge(p,s)}catch{storageWarning()}return p}
function deepMerge(a,b){if(Array.isArray(a)||Array.isArray(b)||typeof a!=='object'||typeof b!=='object'||!a||!b)return b??a;const o={...a};Object.keys(b).forEach(k=>o[k]=k in a?deepMerge(a[k],b[k]):b[k]);return o}
function saveP(id,p){const key=pkey(id),raw=JSON.stringify(p);try{localStorage.setItem(key,raw);UNSAVED_PROGRESS.delete(key);return true}catch{UNSAVED_PROGRESS.set(key,raw);storageWarning();return false}}
function userStats(){let xp=0,done=0,exercises=0,games=0;Object.keys(lessonById).forEach(id=>{const p=getP(id);xp+=p.xp||0;if(p.exam.passed)done++;exercises+=Object.values(p.ex).filter(e=>e.done).length;games+=Object.values(p.games).filter(g=>g.done).length});return {xp,level:Math.floor(xp/300)+1,done,exercises,games,total:Object.keys(lessonById).length}}
function gradeRelation(g){if(!SESSION.user||SESSION.user.teacher)return '';return g<SESSION.user.grade?'review':g===SESSION.user.grade?'current':'advance'}
function statusText(p){if(p.exam.passed)return 'ทบทวน';if(p.contentIndex>0||p.resume!=='content')return 'เรียนต่อ';return 'เริ่มเรียน'}
function nextRequired(p){if(!p.contentDone)return 'content';if(!p.visited?.lab)return 'lab';if(!p.games.g1.done)return 'g1';if(!p.games.g2.done)return 'g2';if(!p.games.g3.done)return 'g3';if(!p.ex.e1.done)return 'e1';if(!p.ex.e2.done)return 'e2';if(!p.ex.e3.done)return 'e3';if(!p.exam.passed)return 'exam';return 'result'}
function stageDone(p,s){return s==='content'?p.contentDone:s==='lab'?false:s==='g1'?p.games.g1.done:s==='g2'?p.games.g2.done:s==='g3'?p.games.g3.done:s==='e1'?p.ex.e1.done:s==='e2'?p.ex.e2.done:s==='e3'?p.ex.e3.done:s==='exam'?p.exam.passed:s==='result'?p.exam.passed:false}
function stageStatus(p,s){if(s==='lab')return p.simulation?.[SESSION.lesson.id]?.explored?'ทดลองแล้ว':p.visited?.lab?'เปิดแล้ว':'ลองทดลอง';if(stageDone(p,s))return s==='content'?'อ่านจบแล้ว':'ผ่านเกณฑ์';if(s==='result')return p.exam.attempts?'มีผลสอบ':'ยังไม่มีผลสอบ';const attempted=s==='lab'?!!(p.lab.evidence||p.lab.variable||p.lab.text):s.startsWith('g')?p.games[s].attempts>0:s.startsWith('e')&&s!=='exam'?Object.keys(p.ex[s].state?.answers||{}).length>0:s==='exam'?p.exam.attempts>0||Object.keys(p.exam.current?.answers||{}).length>0:p.contentIndex>0;return attempted?'ทำแล้ว • ยังไม่ผ่าน':p.visited?.[s]?'เปิดแล้ว':'ยังไม่ทำ'}

function ensureEx(stage,p){const saved=p.ex[stage].state,version=window.SLH_EXERCISES.version;if(saved&&(stage==='e3'||saved.version===version))return saved;if(saved)p.ex[stage].previousState=saved;const type=stage==='e1'?'basic':stage==='e2'?'apply':'onet';const pool=practicePool(SESSION.lesson.id).filter(q=>q.type===type||(stage==='e3'&&q.type==='analyze'));if(pool.length<6)throw Error('Insufficient exercise questions: '+SESSION.lesson.id+'/'+stage);const qs=sample(pool,6).map(q=>({...q,opts:shuffle([...q.opts])}));p.ex[stage].state={version,qs,answers:{},checked:false,results:{}};saveP(SESSION.lesson.id,p);return p.ex[stage].state}

<button class="pixelBtn green" data-ex-next="${stage}">${stage==='e1'?'ไปประยุกต์':stage==='e2'?'ไป O-NET Challenge':'ไปข้อสอบท้ายบท'} →</button></div></section>`}
function buildExamAttempt(){return window.SLH_FINAL_EXAMS.build(SESSION.lesson.id,shuffle)}
function renderExam(p){if(!p.exam.current)p.exam.current=buildExamAttempt(),saveP(SESSION.lesson.id,p);const st=p.exam.current,q=st.qs[st.idx];return `<section class="examCard"><div class="gameTitle"><span class="num">🏆</span><div><h2 style="margin:0">Final Challenge • ข้อสอบท้ายบท</h2><div style="color:var(--mut)">20 ข้อ • ผ่าน 60% • ครอบคลุมหัวข้อหลัก • สลับลำดับข้อและตัวเลือกเมื่อทำใหม่</div><p>ข้อสอบแต่งใหม่สำหรับบทนี้ แยกจากแบบฝึก • ทำซ้ำจะพบข้อจากคลังเดิม</p>${st.version===window.SLH_FINAL_EXAMS.version?'':'<p role="status">กำลังทำชุดเดิมที่บันทึกไว้ เริ่มครั้งถัดไปจะใช้ข้อสอบปรับปรุง โดยคงคะแนนเดิมไว้</p>'}<div class="callout">ลองทำข้อสอบได้ทันที หากยังไม่มั่นใจ แนะนำให้อ่านเนื้อหาและฝึกกิจกรรมก่อน คำตอบจะเก็บไว้เมื่อสลับกิจกรรม</div></div></div><div class="examNav" style="margin:12px 0">${st.qs.map((_,i)=>`<button data-exam-go="${i}" class="${st.idx===i?'current':''} ${st.answers[i]!=null?'answered':''}">${i+1}</button>`).join('')}</div><div class="question"><span class="qTag ${q.type==='onet'?'onet':''}">${esc(window.SLH_FINAL_EXAMS.labels[q.type]||(q.type==='onet'?'ชุดเดิม • ใช้หลักฐาน':q.type==='basic'?'ชุดเดิม • พื้นฐาน':'ชุดเดิม'))}</span><div class="qTitle">ข้อ ${st.idx+1}. ${mathText(q.q)}</div><div class="choiceGrid">${q.opts.map((o,j)=>`<button class="choice ${st.answers[st.idx]===o?'sel':''}" data-exam-choice="${esc(o)}" aria-pressed="${st.answers[st.idx]===o}">${['ก','ข','ค','ง'][j]}. ${mathText(o)}</button>`).join('')}</div></div><div class="contentNav"><button class="pixelBtn soft" data-exam-prev ${st.idx===0?'disabled':''}>← ก่อนหน้า</button>${st.idx<19?`<button class="pixelBtn blue" data-exam-next>ถัดไป →</button>`:`<button class="pixelBtn green" data-exam-submit>ส่งคำตอบ</button>`}</div></section>`}
function mastery(p){const by={};p.trace.forEach(t=>{if(!t.code)return;if(!by[t.code])by[t.code]={ok:0,n:0};by[t.code].n++;if(t.ok)by[t.code].ok++});return PACKS[SESSION.lesson.id].map(s=>{const m=by[s.code]||{ok:0,n:0};const pct=m.n?Math.round(m.ok/m.n*100):0;return {title:s.title,pct,label:m.n===0?'ยังไม่มีข้อมูล':pct>=90?'เชี่ยวชาญ':pct>=75?'ชำนาญ':pct>=60?'พื้นฐานดี':'กำลังพัฒนา'}})}
function renderResult(p){if(!p.exam.attempts)return `<section class="panel"><h1>ยังไม่มีผลสอบ</h1><p>เลือกทำกิจกรรมหรือเริ่มข้อสอบท้ายบทได้ตามความพร้อม</p><button class="pixelBtn blue" data-stage="exam">เริ่มข้อสอบท้ายบท</button></section>`;const ms=mastery(p),last=p.exam.history[0];return `<section class="panel"><div class="resultHero"><div class="scoreCircle" style="--score:${p.exam.last}%"><strong>${p.exam.last}%</strong></div><div><h1>${p.exam.passed?'🎉 ผ่านเกณฑ์แล้ว!':'📚 ยังไม่ผ่าน 60%'}</h1><p>คะแนนล่าสุด ${p.exam.last}% • คะแนนดีที่สุด ${p.exam.best}% • ทำข้อสอบ ${p.exam.attempts} ครั้ง</p>${p.exam.passed&&p.exam.last<60?'<div class="callout"><b>หมายเหตุ:</b> ครั้งล่าสุดต่ำกว่า 60% แต่คะแนนดีที่สุดของคุณผ่านเกณฑ์แล้ว</div>':''}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pixelBtn green" data-result-retry>ทำใหม่เพื่อ 100%</button><button class="pixelBtn blue" data-result-review>ทบทวนบทเรียน</button></div></div></div><div class="panel" style="box-shadow:none"><h2>ความเชี่ยวชาญรายหัวข้อ</h2><div class="masteryList">${ms.map(m=>`<div class="masteryRow"><div><b>${esc(m.title)}</b><br><small>${m.label}</small></div><div class="miniBar"><span style="width:${m.pct}%"></span></div><b>${m.pct}%</b></div>`).join('')}</div></div>${last&&(last.responses||last.review)?.length?`<div class="panel examReview" style="box-shadow:none"><h2>${last.responses?'เฉลยและเหตุผลทุกข้อจากครั้งล่าสุด':'ข้อที่ควรทบทวนจากครั้งล่าสุด'}</h2>${(last.responses||last.review).map((r,i)=>`<div class="callout ${r.ok?'':'warn'}"><b>${i+1}. ${mathText(r.q)}</b><br>${r.ok?'✓ ตอบถูก':'ควรทบทวน'} • ตอบ: ${mathText(r.selected)}<br>คำตอบที่ถูก: <b>${mathText(r.correct)}</b><br>${mathText(r.why)}<br>${reviewLink(r.code)}</div>`).join('')}</div>`:''}</section>`}
function bindLearning(stage){$$('[data-stage]').forEach(b=>b.onclick=()=>{if(STAGES.includes(b.dataset.stage))renderLearning(b.dataset.stage)});$$('[data-review-topic]').forEach(b=>b.onclick=()=>{const code=b.dataset.reviewTopic;renderLearning('content');document.querySelector('#reading-'+code)?.scrollIntoView({behavior:'smooth',block:'start'})});if(stage==='content'){$('[data-content-complete]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);p.contentIndex=(PACKS[SESSION.lesson.id]||[]).length;p.contentDone=true;p.resume='lab';saveP(SESSION.lesson.id,p);toast('🧪 อ่านจบแล้ว ลองปรับ Simulation กัน');renderLearning('lab')})}

if(['e1','e2','e3'].includes(stage)){ $$('[data-ex-q]').forEach(b=>b.onclick=()=>{const p=getP(SESSION.lesson.id);if(exerciseComplete(p.ex[stage].state))return;p.ex[stage].state.answers[b.dataset.exQ]=b.dataset.exO;p.ex[stage].state.checked=false;p.ex[stage].state.results={};saveP(SESSION.lesson.id,p);renderLearning(stage)}); $('[data-ex-check]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id),st=p.ex[stage].state;if(exerciseComplete(st))return;if(Object.keys(st.answers).length!==st.qs.length){toast('ตอบให้ครบทุกข้อก่อน');return}let all=true;st.checked=true;st.results={};st.qs.forEach((q,i)=>{const sel=st.answers[i],ok=sel===q.correct;st.results[i]=ok;if(!ok)all=false;record(stage,q,sel,ok,p)});if(all){p.ex[stage].done=true;p.xp=Math.max(p.xp,stage==='e1'?140:stage==='e2'?170:200);p.resume=stage==='e1'?'e2':stage==='e2'?'e3':'exam';toast('✅ ผ่าน 100%')}else toast('ยังไม่ครบ 100% ตรวจข้อที่ผิดแล้วลองใหม่');saveP(SESSION.lesson.id,p);renderLearning(stage)}); $('[data-ex-reset]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);p.ex[stage].state=null;p.ex[stage].done=false;saveP(SESSION.lesson.id,p);renderLearning(stage)}); $('[data-ex-next]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);const n=stage==='e1'?'e2':stage==='e2'?'e3':'exam';p.resume=n;saveP(SESSION.lesson.id,p);renderLearning(n)})}
if(stage==='exam'){ $$('[data-exam-go]').forEach(b=>b.onclick=()=>{const p=getP(SESSION.lesson.id);p.exam.current.idx=+b.dataset.examGo;saveP(SESSION.lesson.id,p);renderLearning('exam')}); $$('[data-exam-choice]').forEach(b=>b.onclick=()=>{const p=getP(SESSION.lesson.id);p.exam.current.answers[p.exam.current.idx]=b.dataset.examChoice;saveP(SESSION.lesson.id,p);renderLearning('exam')}); $('[data-exam-prev]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);p.exam.current.idx=Math.max(0,p.exam.current.idx-1);saveP(SESSION.lesson.id,p);renderLearning('exam')}); $('[data-exam-next]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);p.exam.current.idx=Math.min(19,p.exam.current.idx+1);saveP(SESSION.lesson.id,p);renderLearning('exam')}); $('[data-exam-submit]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id),st=p.exam.current;if(Object.keys(st.answers).length!==20){toast('ตอบให้ครบทั้ง 20 ข้อก่อน');return}let score=0,review=[];st.qs.forEach((q,i)=>{const sel=st.answers[i],ok=sel===q.correct;if(ok)score++;else review.push({...q,selected:sel});record('exam',q,sel,ok,p)});const pct=Math.round(score/20*100);p.exam.last=pct;p.exam.best=Math.max(p.exam.best,pct);p.exam.attempts++;p.exam.passed=p.exam.passed||pct>=60;p.exam.history.unshift({version:st.version||1,pct,score,at:Date.now(),started:st.started,responses:st.qs.map((q,i)=>({...q,selected:st.answers[i],ok:st.answers[i]===q.correct}))});p.exam.history=p.exam.history.slice(0,10);p.exam.current=null;p.resume='result';if(pct>=60){p.completedAt=p.completedAt||Date.now();p.xp=Math.max(p.xp,pct===100?300:250)}saveP(SESSION.lesson.id,p);toast(pct>=60?'🎉 ผ่านข้อสอบแล้ว':'📚 ยังไม่ผ่าน 60%');renderLearning('result')})}
if(stage==='result'){ $('[data-result-retry]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);p.exam.current=buildExamAttempt();p.resume='exam';saveP(SESSION.lesson.id,p);renderLearning('exam')}); $('[data-result-review]')?.addEventListener('click',()=>{const p=getP(SESSION.lesson.id);p.contentIndex=0;p.resume='content';saveP(SESSION.lesson.id,p);renderLearning('content')})}}
function openLesson(id){SESSION.lesson=lessonById[id];const meta=lessonMeta[id];SESSION.grade=meta.grade;SESSION.unit=meta.unit;const p=getP(id),stage=STAGES.includes(p.resume)?p.resume:'content';toast(p.visited?.[stage]?'📍 เรียนต่อจากจุดที่ค้าง':'เลือกทำกิจกรรมที่สนใจได้เลย');renderLearning(stage)}
